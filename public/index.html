<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
/* Staff who've logged in get their own page as the app's front door — opening the
   PWA drops them straight into their Teams home instead of the leadership
   dashboard. Tapping "← Dashboard" over there sets gp-skip-teams for the rest of
   the browser session so they don't get bounced back here.

   This has to sit in <head>, above every byte of body markup, and it touches no
   DOM for exactly that reason. It used to run from a script below the header,
   after the blocking <script src> tags — so the browser had already laid out and
   painted the dashboard chrome by the time the redirect fired, and staff saw the
   dashboard flash for ~200ms on every single app open before landing on their own
   page. Nothing above this line paints. */
(function(){
  /* A guest belongs in My YWAM GP's own guest mode (teams.html?guest=1: the tour, the
     Library, Base), not on this old dashboard — whether they chose "Look around"
     in the app (gp-app-guest) or "View as guest" here before it moved (gp-guest).
     gp-skip-teams is the one way to ask for this page on purpose. */
  var guest = false;
  try { guest = localStorage.getItem('gp-app-guest')==='1'; } catch(e){}
  try { guest = guest || sessionStorage.getItem('gp-guest')==='1'; } catch(e){}
  /* a member of the advisory board, signed in on the app: the app is their home */
  var board = false;
  try { board = !!localStorage.getItem('gp-board'); } catch(e){}
  try {
    if(sessionStorage.getItem('gp-skip-teams')) return;
    var saved = JSON.parse(localStorage.getItem('gp-staff')||'null');
    if(!(saved && saved.user && saved.pin) && board){
      window.gpLeaving = true;
      window.location.replace('teams.html');
      return;
    }
    if(!(saved && saved.user && saved.pin) && guest){
      window.gpLeaving = true;
      window.location.replace('teams.html?guest=1');
      return;
    }
    if(saved && saved.user && saved.pin){
      /* replace() does not stop this document: scripts below keep running until
         the navigation commits. Left alone they would render the dashboard and
         lift the splash off it — the very flash this is here to prevent — and
         fetchData() would spend a Netlify invocation on a page nobody will see,
         once per staff member per app open. gpLeaving stops both. */
      window.gpLeaving = true;
      window.location.replace('teams.html');
    }
  } catch(e){}
})();
</script>

<!-- Fonts load OUT of the render path, on purpose.

     As an @import inside <style> this was render-blocking, and a pending
     stylesheet also blocks script execution — so on a slow or unreachable font
     CDN the app's JavaScript did not run until the request resolved or timed
     out. Measured at 8.1 seconds of dead app on a hanging font request, which
     is exactly the connection this thing is built for.

     media="print" makes the browser fetch it without blocking; onload promotes
     it to all. Text renders immediately in the fallback face and swaps when the
     webfont lands (the URL already carries display=swap). The <noscript> copy
     keeps fonts working if scripts are off. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap"></noscript>
<script>
/* Apply a saved theme BEFORE anything paints. Same class of problem as the splash:
   read it late and the reader watches the app flash the wrong colours on every
   open. No attribute means "follow the system", which is the default. */
(function(){
  try {
    var t = localStorage.getItem('gp-theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<style>
/* ==================== THEME TOKENS ====================
   THIS BLOCK IS DUPLICATED VERBATIM IN index.html, teams.html AND help.html.
   tests/test-theme.mjs asserts the copies are byte-identical — edit one, edit all.

   Three states, which is what a phone actually has:
     no attribute  -> follow the system (prefers-color-scheme)
     data-theme="light" / "dark" -> the reader chose, and their choice wins both ways
   That is why the media query is guarded with :not([data-theme="light"]) — without
   it, a reader who picks light on a dark phone gets ignored.

   Two pairs must never be collapsed into one token, because they diverge between
   themes and a blind find-and-replace inverts them:
     --ink (body text) vs --headerBg (the black header, hero and coin, which stay
       dark in BOTH themes — this is the brand, not the background)
     --surface (cards) vs --onDark (text sitting on that black header)
   The brand marks in logo.js are white and drawn for the black header, so anything
   showing them needs --headerBg behind it in either theme or they vanish. */
:root {
  --pInk:#17150F;          /* personality hero text — fixed: the hero sits on a fixed light tint in both themes */
  --pInk2:#3B372E;
  --pAgree:#1F8A6F;        /* the agree side of the seven circles */
  --pDisagree:#7B4FA0;     /* the disagree side */
  --pAgreeInk:#1B7A62;     /* the same, as small text */
  --pDisagreeInk:#6E4592;
  --pGood:#1F8A6F;         /* strengths ✓ */
  --pBad:#B3261E;          /* watch out for ! */
  --pOnMark:#fff;          /* the glyph inside those marks */
  --bg:#FAF6F0;            /* page */
  --surface:#fff;          /* cards */
  --surface2:#F0EADF;      /* tracks, subtle fills */
  --ink:#17150F;           /* body text */
  --muted:#6B6557;         /* secondary text */
  --faint:#6F6A5A;         /* tertiary text */
  --line:#F0EADF;          /* hairlines */
  --border:#E4DDD0;        /* card borders */
  --border2:#C9C3B6;       /* input borders */
  --accent:#1F44FF;        /* cobalt */
  --accent2:#5B7BFF;       /* gradient partner */
  --accentInk:#fff;        /* text on cobalt */
  --accentSoft:#E8ECFF;    /* cobalt tint fill */
  --accentSoftBorder:#B9C4FF;
  --amber:#FFB323;
  --amberInk:#17150F;      /* text on amber */
  --amberDeep:#96650A;     /* amber as TEXT, so darker than --amber */
  --good:#0A7D3C;
  --goodInk:#fff;          /* text on a solid --good fill */
  --goodSoft:#E3F6EA;
  --bad:#B3261E;
  --badSoft:#FBE6E6;
  --warm:#A84E1C;       /* 'just started' on the goal rings */
  --banner:#FFF1D6;
  --bannerBorder:#FFD98A;
  --bannerInk:#5C4A1E;
  --headerBg:#17150F;      /* header, hero, black cards, loading coin */
  --onDark:#FAF6F0;        /* text on --headerBg */
  --onDarkFaint:#9A9384;   /* tertiary text on --headerBg, which is dark in BOTH themes */
  --onDarkBorder:#4A463D;  /* outlined buttons in the header */
  --navBg:var(--surface);  /* bottom tab bar — a card-like surface in light, but
    flush with --headerBg in dark (see the dark blocks below): a visibly lighter
    grey bar was the one thing standing out against an otherwise black shell
    while the rest of the page was still loading. */
  --shadow:rgba(31,68,255,.28);
  --shadowSoft:rgba(31,68,255,.12);
  --scrim:rgba(23,21,15,.45);
  color-scheme:light;
}

/* Motion: one spring, used everywhere something appears or grows. The overshoot
   is what separates "an app" from "a web page"; honoured only when the reader has
   not asked for less motion. */
:root { --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.4,0,.2,1);
        --r:18px; --rSm:12px; --rLg:22px; }
@media (prefers-reduced-motion: reduce) { :root { --spring:linear; --ease:linear; } }

/* ---- progress rings, shared ----
   Driven by gpRingHtml()/gpRingVars() in rollup.js. One element, no SVG: the
   conic-gradient is the sweep and the ::after punches the middle out, so the ring
   inherits whatever background it is sitting on. */
.gRing { flex:0 0 auto; width:42px; height:42px; border-radius:50%; position:relative;
  background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--surface2) 0);
  display:grid; place-items:center; transition:background .3s var(--ease); }
.gRing::after { content:''; position:absolute; inset:4px; border-radius:50%; background:var(--surface); }
.gRing span { position:relative; z-index:1; font-family:'Koulen',sans-serif; font-size:12.5px;
  color:var(--gc); letter-spacing:-.2px; }
.gRing.sm { width:34px; height:34px; }
.gRing.sm span { font-size:10.5px; }
.gRing.sm::after { inset:3px; }
.gRing.lg { width:58px; height:58px; }
.gRing.lg span { font-size:16px; }
.gRing.lg::after { inset:5px; }
/* On the black hero the punched-out middle has to match the hero, not a card. */
.hero .gRing::after, .focusCard .gRing::after { background:var(--headerBg); }
.hero .gRing, .focusCard .gRing { background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--onDarkBorder) 0); }
/* ...and the digits go to plain light text there. The paper-mode versions of those
   colours are chosen to be readable ON PAPER, so they are far too dark to sit on
   the hero; the sweep still carries the colour, which is where it reads anyway. */
.hero .gRing span, .focusCard .gRing span { color:var(--onDark); }

/* ---- a number that has just landed ----
   Pairs with gpAnimateCounts(): the value climbs and the element settles into
   place, so a figure reads as arriving rather than simply being there. */
@keyframes gpPop { 0%{transform:scale(.88);opacity:.55} 100%{transform:scale(1);opacity:1} }
[data-count] { display:inline-block; animation:gpPop .42s var(--spring) both; }
@media (prefers-reduced-motion: reduce) { [data-count] { animation:none } }

<style>
* { box-sizing: border-box; margin: 0; }
/* ---- locked to the edges of the phone ----
   The page asks for viewport-fit=cover and a black-translucent status bar, which
   together hand it the whole screen INCLUDING the notch and the home-indicator
   strip. Nothing then padded for them, so the header sat under the notch — and
   because iOS reports those insets late and re-reports them on rotation, on
   keyboard open/close and when the URL bar collapses, the content shifted each
   time. That is the wiggle. Pad by the insets and the chrome stops moving.
   overflow-x is on html as well as body on purpose: on iOS, body alone still lets
   the document itself rubber-band sideways.

   overscroll-behavior was `none` on both html and body — see teams.html for
   the same rule's full story: reported and confirmed live (via a real
   user's DevTools) as disabling scrolling entirely on real desktop Chrome,
   not just the rubber-band bounce it was meant to control. `contain` was
   tried next and, on a fresh live check, turned out to trip the same
   Chromium bug. So: no overscroll-behavior at all on html/body (the `auto`
   the user's own console test proved fixes it) — see teams.html for why
   dropping it is safe.

   html also gets --headerBg as its background — see teams.html for the
   full story: a sliver at the very bottom of the splash, on a real iPhone
   with a home indicator, was body's --bg (a shade darker than the splash)
   peeking through a gap some iOS Safari builds leave at first paint. */
html { height:100%; overflow-x:hidden; background:var(--headerBg); }
body { background:var(--bg); color:var(--ink); font-family:'Kantumruy Pro',system-ui,sans-serif;
  padding-bottom:calc(44px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  overflow-x:hidden; -webkit-text-size-adjust:100%; }
button, select, input, textarea { font-family:inherit; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }

header { background:var(--headerBg); color:var(--onDark); padding:calc(18px + env(safe-area-inset-top)) 16px 14px; }
.topRow { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
.brandRow { display:flex; align-items:center; gap:12px; }
.brandKh { font-family:'Koulen',sans-serif; font-size:26px; line-height:1.05; letter-spacing:1px; }
.brandEn { font-size:10px; letter-spacing:3px; color:var(--amber); font-weight:700; }
.langBtn { border:1px solid var(--onDarkBorder); background:transparent; color:var(--onDark); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
.hbtns { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
/* Who you are, top right — the way in to your own page (or to signing in). */
.userChip { display:flex; align-items:center; gap:7px; border:1px solid var(--onDarkBorder); background:transparent;
  color:var(--onDark); border-radius:999px; padding:4px 12px 4px 4px; font-size:13px; font-family:inherit;
  cursor:pointer; max-width:46vw; }
.userChip.guest { padding:6px 13px; gap:5px; border-color:var(--amber); color:var(--amber); font-weight:700; }
.userChip .uAv { width:26px; height:26px; border-radius:50%; flex:0 0 auto; object-fit:cover;
  background:var(--accent); color:var(--accentInk); display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; letter-spacing:.3px; overflow:hidden; }
.userChip .uName { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (max-width:480px){
  /* Keep the notch inset here too — this rule wins on every phone, which is the
     only place the inset is ever non-zero. */
  header { padding:calc(14px + env(safe-area-inset-top)) 12px 12px; }

}

<!-- ==================== SPLASH ====================
     THIS BLOCK IS DUPLICATED VERBATIM IN index.html AND teams.html.
     tests/test-splash.mjs asserts the two copies are byte-identical — edit one,
     edit both. It is inlined rather than pulled from a file because it has to
     paint on the very first frame: an external stylesheet is another round trip,
     and a round trip is the whole problem this solves.

     Why it exists: the PWA's start_url is index.html, so every launch loads the
     dashboard and then navigates to the staff page. That second navigation is a
     real network fetch, so for as long as it takes you saw the dashboard. Script
     timing cannot fix that — the splash is in the markup from the first byte and
     covers the viewport, so there is nothing to see underneath at any point.

     background is the manifest's background_color, so the iOS launch screen and
     this are the same colour and the hand-off has no flash of white or paper.

     The ring spins immediately, from CSS alone, because logo.js is 77KB and must
     not block the head. The real GP mark fades into the middle the moment it
     lands — normally within a few tens of ms, and instantly once cached. -->
<style>
#splash { position:fixed; inset:0; z-index:9999; background:var(--headerBg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  opacity:1; transition:opacity .34s ease; }
#splash.gone { opacity:0; pointer-events:none; }
.spCoin { width:104px; height:104px; border-radius:50%; position:relative;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px rgba(31,68,255,.16), 0 14px 40px rgba(31,68,255,.34); }
/* The comet ring: visible from frame one, no image needed. Masked to a 3px band
   so it reads as a ring rather than a filled disc. */
.spCoin::before { content:''; position:absolute; inset:-9px; border-radius:50%;
  background:conic-gradient(from 0deg, rgba(31,68,255,0) 0deg, rgba(31,68,255,.15) 200deg, var(--accent) 340deg, var(--accent2) 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  animation:spSpin 1s linear infinite; }
/* The mark is white, drawn for the black header, so it reads on this background
   with no coin behind it. Hidden until it has a src, so it is never a blank gap. */
.spCoin img { width:74px; height:auto; opacity:0; transition:opacity .3s ease;
  animation:spSpin 1.4s linear infinite; }
.spCoin img[src] { opacity:1; }
.spWord { font-family:'Koulen',system-ui,sans-serif; font-size:20px; letter-spacing:2.5px;
  color:var(--onDark); text-transform:uppercase; }
.spWord::after { content:''; animation:spDots 1.4s steps(1,end) infinite; }
@keyframes spSpin { to { transform:rotate(360deg) } }
@keyframes spDots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%,100%{content:'...'} }
@media (prefers-reduced-motion: reduce){
  .spCoin::before, .spCoin img { animation:none }
  .spWord::after { content:'...' }
}
</style>
<div id="splash"><div class="spCoin"><img id="splashLogo" alt=""></div><div class="spWord">Impact Loading</div></div>
<script>
/* Two calls, so nothing else needs to know how the splash is built:
   gpSplashLogo(src) drops the real mark in once logo.js has landed, and
   gpSplashDone() takes the splash down when there is finally something behind it
   worth looking at. Both are safe to call more than once, and safe to call before
   the element exists.

   The timeout is the important part: if any path forgets to call gpSplashDone —
   an error boundary, a branch added later — the splash would sit there covering a
   working app forever. Better to reveal a half-drawn page than to trap it. */
(function(){
  var TIMEOUT = 8000;
  window.gpSplashLogo = function(src){
    var i = document.getElementById('splashLogo');
    if(i && typeof src === 'string' && src && !i.getAttribute('src')) i.src = src;
  };
  window.gpSplashDone = function(){
    var s = document.getElementById('splash');
    if(!s || s.className.indexOf('gone') > -1) return;
    s.className = 'gone';
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 420);
  };
  setTimeout(function(){ window.gpSplashDone(); }, TIMEOUT);
})();
</script>

<script>
/*  Error boundary — must come first, before any other script.

    The page depends on taxonomy.js loading; if that request fails (flaky
    connection, cache miss) the app's globals are missing and everything after
    it dies, which used to mean a silent blank screen with no way out. Show
    something honest and recoverable instead.  */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    // And lift the splash, or the message sits behind it and the app looks hung.
    if(window.gpSplashDone) window.gpSplashDone();
    var html =
      '<div style="max-width:420px;margin:14vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:var(--ink)">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:var(--muted);margin:0 0 18px">'+
      'Usually a connection hiccup. Your data is safe — nothing was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:var(--accent);color:var(--accentInk);font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<div style="font-size:11px;color:var(--faint);margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
  /* A failed <script src> fires an error event on the element itself.

     Only some scripts are load-bearing. logo.js and km.js are marked
     data-optional because the page works without them — a missing logo is a
     missing image, and a missing dictionary just leaves the text in English.
     Killing the whole app for either is far worse than the thing it prevents,
     and on the patchy phone connections this is built for, a third request is a
     third chance to fail. taxonomy.js has no fallback and stays fatal. */
    if(e && e.target && e.target.tagName === 'SCRIPT'){
      if(e.target.hasAttribute('data-optional')) return;
      fallback('could not load ' + (e.target.src||'a script'));
      return;
    }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>

function ring(p, size){
  p = Math.max(0, Math.round(p));
  var shown = Math.min(100, p);
  var r = (size-10)/2, c = 2*Math.PI*r, off = c*(1-shown/100);
  var cx = size/2;

/* ---------- weeks & dates ----------
   The same rule as isoWeekOf / weekYearOf in teams.html and isoWeek_ / weekYear_
   in api.js: week 1 is the Monday–Sunday week that holds 1 January, so 28–31
   December 2026 are already week 1 of 2027. currentWeekYear() is the year that
   goes with currentWeek(), and the one getData answers with when asked for none.
   (When next year's 1 January is a Monday, the last days of December still clamp
   onto week 52 of their own year — see weekYear_.) */
function weekYearOf(d){
  var y = d.getFullYear(), jan1 = new Date(y + 1, 0, 1);
  var nextW1 = new Date(y + 1, 0, 1 - ((jan1.getDay() + 6) % 7));
  return d >= nextW1 ? y + 1 : y;
}
function currentWeekYear(){ return weekYearOf(new Date()); }
function mondayOfW1(year){
  var y = year ? Number(year) : currentWeekYear();
  var jan1 = new Date(y, 0, 1);
  return new Date(y, 0, 1 - ((jan1.getDay() + 6) % 7));
}
function weekRange(w, year){
  var start = new Date(mondayOfW1(year).getTime() + (w-1)*7*86400000);
  var end = new Date(start.getTime() + 6*86400000);
  return [start, end];
}
function fmtDate(d){
  var loc = state.lang === 'km' ? 'km-KH' : 'en-US';
  try { return d.toLocaleDateString(loc, { month:'short', day:'numeric' }); }
  catch(e){ return (d.getMonth()+1)+'/'+d.getDate(); }
}
function weekLabel(w){
  var r = weekRange(w);
  return 'W'+w+' · '+fmtDate(r[0])+'–'+fmtDate(r[1])+' · Q'+(qOf(w)+1);
}
function currentWeek(){
  var now = new Date(), diff = Math.floor((now - mondayOfW1(weekYearOf(now))) / (7*86400000)) + 1;
  return Math.max(1, Math.min(52, diff));
}
state.week = currentWeek();

function logHtml(){
  var deps = getDepartments(state.campus);
  if(!deps[state.dept]) state.dept = Object.keys(deps)[0];
  if(!deps[state.dept][state.ministry]) state.ministry = Object.keys(deps[state.dept])[0];
  var h = '<h2>'+esc(t('Log Numbers'))+' <small>· '+esc(t(campusName()))+'</small></h2>';
  h += '<div class="pickerRow">';
  h += '<label class="pick"><span>'+esc(t('Department'))+'</span><select id="deptSel">'+
    Object.keys(deps).map(function(d){ return '<option value="'+esc(d)+'"'+(state.dept===d?' selected':'')+'>'+(MIN_EMOJI[d]?MIN_EMOJI[d]+' ':'')+esc(t(d))+'</option>'; }).join('')+'</select></label>';
  h += '<label class="pick"><span>'+esc(t(state.dept===BL_DEPT?'Oversees':'Ministry'))+'</span><select id="minSel">'+
    Object.keys(deps[state.dept]).map(function(m){ return '<option value="'+esc(m)+'"'+(state.ministry===m?' selected':'')+'>'+(MIN_EMOJI[m]?MIN_EMOJI[m]+' ':'')+esc(t(m))+'</option>'; }).join('')+'</select></label>';
  h += '<label class="pick"><span>'+esc(t('Week'))+'</span><select id="weekSel">'+weekOptions(state.week)+'</select></label>';
  h += '</div><div class="card" id="logCard">';
  var entries = state.data.entries[state.campus]||{};
  if(state.dept===BL_DEPT && state.ministry==='Campus Director'){
    var hsNow = healthScore([state.campus]);
    h += '<div class="row"><div><div class="rowName">'+esc(t('Staff Health Score (from survey)'))+'</div>'+
      '<div class="rowSub">'+esc(t('auto from KPI'))+'</div></div><span class="rowVal">'+(hsNow===null?'—':hsNow.toFixed(1)+'/10')+'</span></div>';
  }
  visibleMetrics(deps[state.dept][state.ministry]).forEach(function(metric){
    var key = state.dept+'|'+state.ministry+'|'+metric;
    var mode = modeOf(metric);
    var wks = entries[key] || {};
    var agg = aggregate(wks, mode);
    var cur = wks[state.week]!==undefined ? wks[state.week] : '';
    var sub, extra = '';
    if(mode==='latest'){
      // Headcounts (students enrolled, staff, schools…) rarely change week to
      // week, so carry the last figure forward already filled in instead of
      // making someone retype it. Still editable, so real growth or decline
      // still registers — and the ▲/▼ badge shows the change.
      var prev = lastBefore(wks, state.week);
      var isCarried = (cur==='' && prev!==null);
      if(isCarried){ cur = prev.value; extra = ' data-carried="1"'; }
      sub = esc(t('now'))+' '+fmt(agg,metric);
      if(prev!==null){
        sub += ' · ' + (isCarried
          ? esc(t('carried from week'))+' '+prev.week
          : esc(t('week'))+' '+prev.week+': '+fmt(prev.value,metric));
        var d = Number(cur)-prev.value;
        if(d) sub += '<span class="trend '+(d>0?'up':'down')+'">'+(d>0?'▲':'▼')+' '+fmt(Math.abs(d),metric)+'</span>';
      }
    } else if(mode==='avg'){
      sub = esc(t('avg'))+' '+fmt(agg,metric)+gpVsLastWeek(wks, state.week, metric, wks[state.week]);
    } else {
      // Running totals: this box is the week's ADDITION, not the new total.
      // Spelling that out stops people entering "105" when they mean "+5".
      // Last week sits beside it so a rise or fall is visible while typing.
      sub = esc(t('total so far'))+' '+fmt(agg,metric)+
        gpVsLastWeek(wks, state.week, metric, wks[state.week])+'<span class="newTot"></span>';
      extra = ' data-run="'+(agg===null?0:agg)+'"';
    }
    h += '<div class="row"><div><div class="rowName">'+esc(t(metric))+'</div><div class="rowSub">'+sub+'</div></div>'+
      '<input type="number" inputmode="decimal" placeholder="'+(mode==='sum'?'+0':'0')+'" data-metric="'+esc(metric)+'" data-mode="'+mode+'" value="'+cur+'"'+extra+'></div>';
  });
  h += '<button class="saveBtn" id="saveBtn">'+esc(t('Save Week'))+' '+state.week+'</button></div>';
  h += '<p class="note">'+esc(t('Entries save to the shared GP Impact Data sheet — every leader sees the same live numbers.'))+'</p>';
  return h;
}

/* ---------- OKR ---------- */
function objProgress(o){ return R().objProgress(o); }
function krProgress(o, kr){ return R().krProgress(o, kr); }
/* Fills the note under one key-result slot in the editor. textContent, so there
   is nothing to escape. */
/* Three key-result rows to start (or as many as the objective has); "+ Add a key
   result" adds more in place, up to MAX_KRS — the server keeps no more than that. */
var MAX_KRS = 10;
function krRowHtml(k, kr){
  kr = kr||{text:'',metricKey:'',target:''};
  return '<div class="formBlock" data-kr-row="'+k+'"><label>'+esc(t('Key result'))+' '+(k+1)+'</label>'+
    '<input type="text" id="krText'+k+'" value="'+esc(kr.text)+'">'+
    '<label>'+esc(t('Measure by'))+'</label><select id="krMetric'+k+'">'+metricOptions(kr.metricKey)+'</select>'+
    '<label>'+esc(t('Target (if linked to a KPI)'))+'</label><input type="number" id="krTarget'+k+'" inputmode="decimal" placeholder="0" value="'+(kr.target||'')+'" style="width:130px">'+
    '<div class="krWarn" id="krWarn'+k+'"></div>'+
  '</div>';
}
function bindKrRow(k){
  var sel=document.getElementById('krMetric'+k), tin=document.getElementById('krTarget'+k);
  if(!sel || !tin) return;
  sel.addEventListener('change', function(){ krTargetCheck(k); });
  tin.addEventListener('input', function(){ krTargetCheck(k); });
  krTargetCheck(k);   /* an objective opened for editing says it straight away */
}
function addKrRow(){
  var btn=document.getElementById('addKrBtn');
  if(!btn) return;
  var k=document.querySelectorAll('#okrForm [data-kr-row]').length;
  if(k>=MAX_KRS) return;
  btn.insertAdjacentHTML('beforebegin', krRowHtml(k));
  bindKrRow(k);
  if(k+1>=MAX_KRS) btn.style.display='none';
  var box=document.getElementById('krText'+k);
  if(box) box.focus();
}
function krTargetCheck(k){
  var el = document.getElementById('krWarn'+k);
  var sel = document.getElementById('krMetric'+k);
  var tin = document.getElementById('krTarget'+k);
  if(!el || !sel || !tin) return;
  el.textContent = gpKrTargetNote(R(), state.campus, state.okrQuarter, sel.value,
    Number(tin.value)||0);
}

function metricOptions(selected){
  var deps = getDepartments(state.campus);
  var h = '<option value="">'+esc(t('Manual progress (%)'))+'</option>';
  Object.keys(deps).forEach(function(d){
    h += '<optgroup label="'+esc(t(d))+'">';
    Object.keys(deps[d]).forEach(function(min){
      visibleMetrics(deps[d][min]).forEach(function(met){
        var key = d+'|'+min+'|'+met;
        h += '<option value="'+esc(key)+'"'+(selected===key?' selected':'')+'>'+esc(t(min)+' · '+t(met))+'</option>';
      });
    });
    h += '</optgroup>';
  });
  return h;
}

function okrHtml(){
  var q = state.okrQuarter;
  var h = '<h2>'+esc(t('OKRs'))+' <small>· '+esc(t(campusName()))+'</small></h2>';
  h += '<div class="pickerRow"><label class="pick" style="max-width:180px"><span>'+esc(t('Quarter'))+'</span><select id="okrQSel">';
  for(var i=1;i<=4;i++) h += '<option value="'+i+'"'+(q===i?' selected':'')+'>Q'+i+'</option>';
  h += '</select></label></div>';

  var list = state.data.okrs.filter(function(o){ return o.campus===state.campus && Number(o.quarter)===q; });
  if(!list.length && !state.okrFormOpen) h += '<p class="note">'+esc(t('No objectives yet. Set 2–3 per department — each with measurable key results.'))+'</p>';

  list.forEach(function(o){
    var p = objProgress(o);
    h += '<div class="okrCard"><div class="okrHead"><div><div class="okrObj">'+esc(o.objective)+'</div>'+
      '<div class="okrDept">'+emj(o.dept)+esc(t(o.dept))+' · Q'+o.quarter+'</div></div>'+ring(p,58)+'</div>';
    o.krs.forEach(function(kr, ki){
      var kp = krProgress(o, kr);
      h += '<div class="kr"><div class="krText">'+esc(kr.text)+'</div><div class="krMeta">';
      if(kr.metricKey){
        var met = kr.metricKey.split('|')[2];
        h += '<span>'+fmt(kp.actual,met)+' / '+fmt(kr.target,met)+' · '+esc(t('auto from KPI'))+'</span><span>'+kp.pct+'%</span>';
      } else if(kr.kind==='count'){
        // counted on the staff app (− / +); the dashboard just shows it
        h += '<span>'+(Number(kr.current)||0)+' / '+(Number(kr.target)||0)+'</span><span>'+kp.pct+'%</span>';
      } else {
        // Empty rather than 0 when nothing is set — see the staff page's copy.
        h += '<span>'+esc(t('manual'))+'</span><span><input type="number" class="manualIn" min="0" max="100" placeholder="0" value="'+(Number(kr.manual) ? Number(kr.manual) : '')+'" data-manual="'+o.id+'|'+ki+'"'+(state.data.leader?'':' disabled')+'> %</span>';
      }
      h += '</div><div class="krBar"><div class="barFill'+(kp.pct>=100?' done':'')+'" style="width:'+Math.min(100,kp.pct)+'%"></div></div>'+(kr.metricKey?gpKrWarnHtml(kp):'')+'</div>';
    });
    if(state.data.leader){
      h += '<div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">'+
        '<button class="dangerBtn" data-del="'+o.id+'">'+esc(t('Delete'))+'</button>'+
        '<button class="ghostBtn" data-edit="'+o.id+'">'+esc(t('Edit'))+'</button></div>';
    }
    h += '</div>';
  });

  if(!state.data.leader){
    return h;
  }

  if(state.okrFormOpen){
    var editing = null;
    if(state.editingId) state.data.okrs.forEach(function(o){ if(o.id===state.editingId) editing=o; });
    var krs = editing ? editing.krs : [];
    h += '<div class="okrCard" id="okrForm"><div class="okrObj">'+esc(t(editing?'Edit objective':'New objective'))+'</div><div class="formBlock" style="border:none;margin-top:4px">';
    h += '<label>'+esc(t('Objective'))+'</label><input type="text" id="objText" value="'+(editing?esc(editing.objective):'')+'">';
    h += '<label>'+esc(t('Owner'))+'</label><select id="objDept">'+Object.keys(getDepartments(state.campus)).map(function(d){
      return '<option value="'+esc(d)+'"'+(editing&&editing.dept===d?' selected':'')+'>'+esc(t(d))+'</option>'; }).join('')+'</select>';
    var rows = Math.min(MAX_KRS, Math.max(3, krs.length));
    for(var k=0;k<rows;k++) h += krRowHtml(k, krs[k]);
    h += '<button class="ghostBtn" id="addKrBtn" type="button" style="width:100%'+(rows>=MAX_KRS?';display:none':'')+'">'+esc(t('+ Add a key result'))+'</button>';
    h += '<button class="saveBtn" id="saveOkrBtn">'+esc(t(editing?'Save changes':'Add objective'))+'</button>'+
      '<button class="ghostBtn" id="cancelOkrBtn" style="width:100%">'+esc(t('Cancel'))+'</button></div></div>';
  } else {
    h += '<button class="saveBtn" id="openOkrBtn">'+esc(t('+ New Objective'))+'</button>';
  }
  return h;
}

/* ---------- Health survey ---------- */
/* ---------- events & server ---------- */
function apiCall(fn, args){
  return fetch('/.netlify/functions/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args || [] })
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  });
}

function toggleLeader(){
  if(state.data.leader){
    state.leaderCode=''; lsDel('gp-leadercode');
    fetchData(); return;
  }
  var code = prompt(t('Enter leadership code'));
  if(!code) return;
  apiCall('getData', [code]).then(function(d){
    if(d.leader){
      state.leaderCode = code; lsSet('gp-leadercode', code);
      state.data = d; render();
    } else {
      showError(t('Wrong code'));
    }
  }).catch(function(){ showError(t('Wrong code')); });
}

function bindEvents(){
  document.getElementById('langBtn').onclick = toggleLang;
  /* Refresh spins the GP mark, the same way the boot screen and pull-to-refresh
     do. It used to swap in a "…" — a dead ellipsis that looked like nothing was
     happening, and that stayed on the button forever if the request failed,
     because only a successful render put the ↻ back. */
  document.getElementById('refreshBtn').onclick = function(){
    var btn = this;
    if(btn.dataset.busy) return;
    btn.dataset.busy = '1';
    btn.classList.add('spinBtn');
    btn.innerHTML = logoImg('spinMark') || '↻';
    var done = function(){
      delete btn.dataset.busy;
      btn.classList.remove('spinBtn');
      btn.textContent = '↻';
    };
    var p = fetchData();
    if(p && p.then) p.then(done, done); else done();
  };
  document.getElementById('lockBtn').onclick = toggleLeader;
  document.querySelectorAll('[data-campus]').forEach(function(b){
    b.onclick = function(){ state.campus=b.getAttribute('data-campus'); if(state.view==='all') state.view='dashboard'; render(); };
  });
  var all = document.querySelector('[data-all]');
  if(all) all.onclick = function(){ state.view='all'; render(); };
  document.querySelectorAll('[data-view]').forEach(function(b){
    b.onclick = function(){ gpTap(); state.view=b.getAttribute('data-view'); render(); };
  });
  var gc=document.getElementById('gCreate');
  if(gc) gc.onclick=function(){ window.location.href='teams.html?reg=1'; };
  var gl=document.getElementById('gLogin');
  if(gl) gl.onclick=function(){ window.location.href='teams.html'; };
  gpBindDrill(R());
  gpBindStaffMix(staffBreakdown(state.view==='all' ? CAMPUSES.map(function(c){return c.id;}) : [state.campus]));
  var ds=document.getElementById('deptSel');
  if(ds) ds.onchange=function(){ state.dept=ds.value; state.ministry=Object.keys(getDepartments(state.campus)[state.dept])[0]; render(); };
  var ms=document.getElementById('minSel');
  if(ms) ms.onchange=function(){ state.ministry=ms.value; render(); };
  var ws=document.getElementById('weekSel');
  if(ws) ws.onchange=function(){ state.week=Number(ws.value); render(); };
  var sb=document.getElementById('saveBtn');
  if(sb) sb.onclick=function(){ saveCard(sb); };
  // Running totals live in rollup.js now — the staff page's daily card needs the
  // same behaviour, and a second hand-written copy is how these drift.
  gpBindRunningTotals(document.getElementById('logCard'));

  var dds=document.getElementById('dashDeptSel');
  if(dds) dds.onchange=function(){ state.dashDept=dds.value; render(); };
  var qs=document.getElementById('okrQSel');
  if(qs) qs.onchange=function(){ state.okrQuarter=Number(qs.value); render(); };
  var ob=document.getElementById('openOkrBtn');
  if(ob) ob.onclick=function(){ state.okrFormOpen=true; state.editingId=null; render(); };
  var cb=document.getElementById('cancelOkrBtn');
  if(cb) cb.onclick=function(){ state.okrFormOpen=false; state.editingId=null; render(); };
  var sob=document.getElementById('saveOkrBtn');
  if(sob) sob.onclick=function(){ saveOkrForm(sob); };
  for(var kw=0;document.getElementById('krText'+kw);kw++) bindKrRow(kw);
  var akb=document.getElementById('addKrBtn');
  if(akb) akb.onclick=function(){ addKrRow(); };
  document.querySelectorAll('[data-edit]').forEach(function(b){
    b.onclick=function(){ state.editingId=b.getAttribute('data-edit'); state.okrFormOpen=true; render(); };
  });
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=function(){
      if(!confirm(t('Delete')+'?')) return;
      serverCall('deleteObjective', [b.getAttribute('data-del'), state.leaderCode]);
    };
  });
  document.querySelectorAll('[data-manual]').forEach(function(inp){
    inp.onchange=function(){
      var parts = inp.getAttribute('data-manual').split('|');
      var okr=null; state.data.okrs.forEach(function(o){ if(o.id===parts[0]) okr=o; });
      if(!okr) return;
      okr.krs[Number(parts[1])].manual = Number(inp.value)||0;
      serverCall('saveObjective', [okr, state.leaderCode]);
    };
  });

}

function serverCall(fn, args){
  hideError();
  apiCall(fn, args).then(function(d){ state.data=d; render(); })
    .catch(function(){ showError("Couldn't save. Check your connection and try again."); });
}

function saveCard(btn){
  var updates=[];
  document.querySelectorAll('#logCard input[data-metric]').forEach(function(inp){
    updates.push({ dept:state.dept, ministry:state.ministry, metric:inp.getAttribute('data-metric'),
      week:state.week, value: inp.value==='' ? null : Number(inp.value) });
  });
  /* a score is 1–10 and a percentage 0–100 (kpiRange in taxonomy.js); the
     server refuses anything else, so say so here instead of losing it */
  if(state.ministry!=='Outreach Teams' && typeof kpiRange==='function'){
    for(var i=0;i<updates.length;i++){
      var r=kpiRange(updates[i].metric||''), v=updates[i].value;
      if(r && v!==null && !isNaN(v) && (v<r.min || v>r.max)){
        showError(gpT('{metric} goes from {min} to {max} — check the number you typed.',{metric:t(updates[i].metric), min:r.min, max:r.max}));
        return;
      }
    }
  }
  btn.disabled=true; btn.textContent=t('Saving…'); hideError();
  /* The server needs to know who is writing: the leadership code, or a staff
     login. Without one of them it refuses, and a staff login may only write its
     own campus. */
  var sess = staffSession() || {};
  apiCall('saveEntries', [state.campus, updates, state.leaderCode, sess.user, sess.pin]).then(function(d){
    if(d && d.ok === false){
      btn.disabled=false; btn.textContent=t('Save Week')+' '+state.week;
      showError(d.err === 'wrong_campus'
        ? t('You can only log numbers for your own campus.')
        : d.err === 'no_campus'
          ? t('Your profile has no campus yet — add one on your profile page.')
          : t('Sign in again to save numbers.'));
      return;
    }
    state.data = d; btn.innerHTML='<span class="savedSpark">✦</span> '+t('Saved');
    setTimeout(function(){ render(); }, 900);
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Save Week')+' '+state.week;
    showError("Couldn't save. Check your connection and press Save again.");
  });
}

function saveOkrForm(btn){
  var text = document.getElementById('objText').value.trim();
  if(!text){ showError(t('Objective')+'?'); return; }
  var krs=[];
  for(var k=0;document.getElementById('krText'+k);k++){
    var tx = document.getElementById('krText'+k).value.trim();
    if(!tx) continue;
    krs.push({ text:tx, metricKey:document.getElementById('krMetric'+k).value,
      target:Number(document.getElementById('krTarget'+k).value)||0, manual:0 });
  }
  if(!krs.length){ showError(t('Key result')+'?'); return; }
  if(state.editingId){
    state.data.okrs.forEach(function(o){
      if(o.id===state.editingId){
        krs.forEach(function(nk){
          o.krs.forEach(function(ok){
            if(ok.text!==nk.text) return;
            // headings and counts are set on the staff app; editing here keeps them
            nk.group = ok.group||'';
            if(!nk.metricKey && !ok.metricKey){ nk.manual=ok.manual; nk.kind=ok.kind||''; nk.current=ok.current||0; }
          });
        });
      }
    });
  }
  var obj = { id: state.editingId || ('o'+Date.now()), campus: state.campus, quarter: state.okrQuarter,
    dept: document.getElementById('objDept').value, objective: text, krs: krs };
  btn.disabled=true; btn.textContent=t('Saving…');
  apiCall('saveObjective', [obj, state.leaderCode]).then(function(d){
    state.data=d; state.okrFormOpen=false; state.editingId=null; render();
  }).catch(function(){
    btn.disabled=false; btn.textContent=t('Add objective');
    showError("Couldn't save. Check your connection and try again.");
  });
}

function showError(msg){ var e=document.getElementById('errorBar'); e.textContent=msg; e.classList.remove('hidden'); }
function hideError(){ document.getElementById('errorBar').classList.add('hidden'); }

function fetchData(){
  // Returns the promise so pull-to-refresh knows when to stop spinning.
  /* One request: getData brings the roster with it, so the dashboard no longer
     makes a second round trip for the staff headcount. */
  return apiCall('getData', [state.leaderCode]).then(function(d){
    if(d && Array.isArray(d.roster)) state.roster = d.roster;
    state.data=d; state.loaded=true;
    /* Khmer used to be fetched into a `gp-km-v2` cache, and this is where the
       cache was read — falling back to English when it was empty. Nothing writes
       that key any more (km.js ships BUILTIN_KM with the page), so the fallback
       fired every single time: a Khmer reader picked Khmer, reloaded, and the
       first data load quietly put the page back into English while the toggle
       still read ខ្មែរ. The dictionary is local now, so there is nothing to wait
       for and nothing to fall back to. */
    render();
  }).catch(function(){ showError("Couldn't load data. Pull down to refresh."); });
}

/* The dashboard is the public face of the app — anyone can read it without an
   account. The chip in the top right is the one place that changes: it's your
   face and a door to your own page if you're signed in, and an invitation to
   sign in if you're not. */
function renderUserChip(){
  var chip=document.getElementById('userChip');
  if(!chip) return;
  var card=null, session=null;
  try {
    session = JSON.parse(localStorage.getItem('gp-staff')||'null');
    card = JSON.parse(localStorage.getItem('gp-staff-card')||'null');
  } catch(e){}
  var signedIn = !!(session && session.user);

  if(!signedIn){
    chip.className='userChip guest';
    chip.innerHTML='<span aria-hidden="true">✦</span> '+esc(t('Sign in'));
    chip.setAttribute('aria-label', t('Sign in to your staff page'));
  } else {
    var name=(card&&card.name)||session.user;
    var first=String(name).trim().split(/\s+/)[0];
    var av=(card&&card.photo)
      ? '<img class="uAv" src="'+esc(card.photo)+'" alt="">'
      : '<span class="uAv">'+esc(initialsOf(name))+'</span>';
    chip.className='userChip';
    chip.innerHTML=av+'<span class="uName">'+esc(first)+'</span>';
    chip.setAttribute('aria-label', t('Open my page'));
  }
  chip.onclick=function(){
    // Going to my own page means I want to be taken there next time too.
    try { sessionStorage.removeItem('gp-skip-teams'); } catch(e){}
    window.location.href='teams.html';
  };
}
function initialsOf(name){
  return String(name||'?').trim().split(/\s+/).map(function(w){return w[0];})
    .slice(0,2).join('').toUpperCase();
}

(function(){
  renderUserChip();
  var hb=document.getElementById('helpBtn');
  if(hb) hb.onclick=function(){ window.location.href='help.html'; };
})();

/* Shared with the staff page — see gpPullToRefresh in rollup.js. */
gpPullToRefresh(function(){ return fetchData(); });
gpSelectNumberOnFocus();   // tapping a number box types over it, rather than beside the 0
gpInstallPrompt();

render();
if(!window.gpLeaving) fetchData();
