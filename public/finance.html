      C.forEach(function(x){ var k=ihKey_(x); seen[k]=1; var r=merge3_(mB[k], mA[k], x); if(r!==undefined) out.push(r); });
      B.forEach(function(x, i){ var k=ihKey_(x); if(seen[k]) return; var r=merge3_(x, mA[k], undefined); if(r!==undefined) out.splice(Math.min(i, out.length), 0, r); });
      return out; }
    if(A.length===B.length && B.length===C.length) return C.map(function(x, i){ return merge3_(B[i], A[i], x); });
    throw { conflict:true };
  }
  if(obj){ var r={}, ks={}; [A,B,C].forEach(function(o){ Object.keys(o).forEach(function(k){ ks[k]=1; }); });
    Object.keys(ks).forEach(function(k){ var v=merge3_(B[k], A[k], C[k]); if(v!==undefined) r[k]=v; }); return r; }
  throw { conflict:true };
}
function ihUndoBack_(i){ var u=UNDO[i]; if(!u) return; var cur=JSON.parse(JSON.stringify(stateObj_())), gone=UNDO.length-i;
  UNDO.splice(i); UNDO.push({ msg:'Put back the '+gone+' input'+(gone>1?'s':'')+' undone from “'+u.msg+'” on', at:Date.now(), st:cur, open:true });
  ihApply_(u.st, 'Went back to before “'+u.msg+'”'); }
function ihApply_(st, msg){ resetState_(); loadState_(st); refreshBal_(); keep_();
  S.inBal=null; S.inAl=null; S.ruleDrafts={}; S.xfer=null; S.fl1=null; S.flUp=null; S.debtUp=null; S.undoAsk=false; S.ihAsk=null; S.ihClash=null;
  render(); ihOpen_(); toast('↩ '+msg); }
function ihUndoOne_(i){ var u=UNDO[i]; if(!u) return;
  if(i===UNDO.length-1){ UNDO.pop(); undoSave_(); S.ihAsk=null; ihApply_(u.st, u.msg); return; }
  if(!u.after){ S.ihClash=i; S.ihAsk=null; ihOpen_(); return; }
  var cur=JSON.parse(JSON.stringify(stateObj_())), R;
  try { R=merge3_(u.st, u.after, cur); } catch(e){ if(!e || !e.conflict) throw e; S.ihClash=i; S.ihAsk=null; ihOpen_(); return; }
  UNDO.splice(i, 1); UNDO.push({ msg:'Cancel the earlier undo (“'+u.msg+'”)', at:Date.now(), st:cur, open:true });
  ihApply_(R, u.msg); }
function ihWhen_(t){ var d=new Date(t); return d.toLocaleDateString('en-GB',{ day:'numeric', month:'short' })+', '+d.toLocaleTimeString('en-GB',{ hour:'2-digit', minute:'2-digit' }); }
function ihOpen_(){
  var h='<button class="x" id="sx" aria-label="Close">✕</button><h3>🕘 History of inputs</h3><p class="hint">Every input on this device, newest first. Undo any one of them — only what it changed is taken back, and everything done since stays.</p>';
  if(!UNDO.length) h+='<p class="hint">Nothing entered yet.</p>';
  if(S.ihClash!=null && UNDO[S.ihClash]){ var c=UNDO[S.ihClash], n=UNDO.length-1-S.ihClash;
    h+='<div class="ihWarn" role="alert"><b>“'+esc(c.msg)+'” can’t be undone on its own.</b> '+(c.after ? 'Something entered after it changed the same thing.' : 'It was entered before this history began.')+
      ' You can go back to before it instead — that also undoes the '+n+' input'+(n>1?'s':'')+' after it.<br><button class="ihBtn ask" data-ihback="'+S.ihClash+'">↩ Go back to before it ('+(n+1)+' inputs)</button> <button class="ihBtn" data-ihcancel="1">Keep everything</button></div>'; }
  h+='<ul class="ihList">'+UNDO.map(function(u, i){ return { u:u, i:i }; }).reverse().map(function(o){ var u=o.u, i=o.i, part=ihPart_(u), ask=S.ihAsk===i;
    return '<li><div><span class="ihTag">'+(part||'Input')+'</span><span class="dsub">'+ihWhen_(u.at)+(i===UNDO.length-1?' · latest':'')+'</span><div class="ihMsg">Undo: '+esc(u.msg)+'</div></div>'+
      '<button class="ihBtn'+(ask?' ask':'')+'" data-ihundo="'+i+'">'+(ask?'Tap again':'↩ Undo')+'</button></li>'; }).join('')+'</ul>';
  if(UNDO.length>=UNDO_MAX) h+='<p class="hint" style="margin-top:10px">The last '+UNDO_MAX+' inputs are kept.</p>';
  var el=document.getElementById('sheet'); el.innerHTML=h; document.body.classList.add('sheetOn');
  document.getElementById('sx').onclick=closeSheet;
}
function undoLast_(){ var u=UNDO.pop(); if(!u) return; try { localStorage.setItem(UNDO_KEY, JSON.stringify(UNDO)); } catch(e){}
  resetState_(); loadState_(u.st); refreshBal_(); keep_();
  S.inBal=null; S.inAl=null; S.ruleDrafts={}; S.xfer=null; S.fl1=null; S.flUp=null; S.debtUp=null; S.undoAsk=false;
  render(); if(document.body.classList.contains('sheetOn')) closeSheet(); toast('↩ '+u.msg); }
/* ---- In Impact: load from the server, save to it (fin2Get / fin2Save in api.js) ----
   The whole document is saved a moment after each change; `rev` stops two people overwriting each
   other — a save from an older copy is refused, and the newer copy is shown instead. */
var FIN={ rev:0, campus:'', canEdit:false, saving:false, dirty:false, again:false, err:'', t:0 };
function finAuth_(){ try { var a=JSON.parse(localStorage.getItem('gp-staff')||'null'); return a && a.user ? a : null; } catch(e){ return null; } }
function api_(fn, args){ return fetch('/.netlify/functions/api', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ fn:fn, args:args }) }).then(function(r){ return r.json(); }); }
function finMsg_(html){ document.getElementById('pane').innerHTML='<div class="finMsg">'+html+'</div>'; }
function finStatus_(){ var el=document.getElementById('finSave'); if(!el){ el=document.createElement('div'); el.id='finSave'; el.className='finSave'; el.onclick=function(){ if(FIN.err) finSaveNow_(); }; document.body.appendChild(el); }
  if(!FIN.canEdit){ el.textContent=''; return; }
  el.className='finSave'+(FIN.err?' bad':'');
  el.textContent = FIN.err ? '⚠️ Not saved — tap to try again' : (FIN.saving || FIN.dirty) ? 'Saving…' : FIN.rev ? '✓ Saved' : '';
  /* “Saved” shows for a moment, then goes — left up for good it sat over the cards (Nov 2026) */
  clearTimeout(FIN.savedT); if(el.textContent==='✓ Saved') FIN.savedT=setTimeout(function(){ if(el.textContent==='✓ Saved') el.textContent=''; }, 2500); }
function finSaveSoon_(){ if(!FIN.canEdit) return; FIN.dirty=true; clearTimeout(FIN.t); FIN.t=setTimeout(finSaveNow_, 600); finStatus_(); }
function finSaveNow_(){ if(FIN.saving){ FIN.again=true; return; }
  var a=finAuth_(); if(!a){ FIN.err='auth'; finStatus_(); return; }
  FIN.saving=true; FIN.dirty=false; finStatus_();
  api_('fin2Save', [a.user, a.pin, FIN.campus, stateObj_(), FIN.rev]).then(function(d){
    FIN.saving=false;
    if(d && d.ok){ FIN.rev=d.rev; FIN.err=''; }
    else if(d && d.err==='conflict'){ FIN.rev=d.rev; FIN.err=''; resetState_(); if(d.state) loadState_(d.state); refreshBal_(); render();
      toast('Someone else saved first — this is their copy now. Your last change wasn’t saved: please enter it again.'); }
    else { FIN.err=(d && d.err) || 'error'; FIN.dirty=true; }
    finStatus_(); if(FIN.again){ FIN.again=false; finSaveNow_(); }
  }).catch(function(){ FIN.saving=false; FIN.dirty=true; FIN.err='offline'; finStatus_(); }); }
window.addEventListener('beforeunload', function(e){ if(APP && (FIN.dirty || FIN.saving)){ e.preventDefault(); e.returnValue=''; } });
function finBoot_(){
  var a=finAuth_(); if(!a){ finMsg_('Sign in to the YWAM GP app first, then open Finances from My Ministry.<br><br><a href="teams.html">Open the YWAM GP app</a>'); return; }
  finMsg_('Loading…');
  api_('fin2Get', [a.user, a.pin, QS.get('campus')||'']).then(function(d){
    if(!d || !d.ok){ finMsg_(d && d.err==='not_authorized' ? 'Only the Finances office and Campus Leadership can open this.' : 'This couldn’t be opened — sign in to the YWAM GP app again.'); return; }
    FIN.rev=d.rev||0; FIN.campus=d.campus; FIN.canEdit=!!d.canEdit;
    SAMPLE_STAFF.length=0; (d.staff||[]).forEach(function(x){ SAMPLE_STAFF.push(x); });
    resetState_(); if(d.state) loadState_(d.state); refreshBal_();
    if(!FIN.canEdit){ document.body.classList.add('ro'); S.tab='dash'; }
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===S.tab); });
    render(); finStatus_();
  }).catch(function(){ finMsg_('No connection — try again when you are online.'); }); }
/* ---- Bringing the demo's entries into Impact ----
   The demo (a page on claude.ai) and Impact are different websites, so the demo can't hand its
   entries over by itself: it copies them as text (📤 in its top bar), and Impact's Input takes
   that text (📥 Bring in entries from the demo). */
function demoCopyOut_(){ var txt=JSON.stringify({ gpFinDemo:1, at:new Date().toISOString(), state:stateObj_() });
  var done=function(){ toast('Copied — now open Finances in Impact → Input → “Bring in entries from the demo” and paste'); };
  var show=function(){ var h='<button class="x" id="sx" aria-label="Close">✕</button><h3>📤 Your entries, for Impact</h3><p class="hint">Copy all of this text, then in Impact open My Ministry → Finances → Input → “Bring in entries from the demo” and paste it there.</p><textarea id="demoOut" readonly style="width:100%;height:240px;font:12px monospace">'+esc(txt)+'</textarea><div class="inBtns"><button class="btn" id="demoOutCopy">Copy</button></div>';
    var el=document.getElementById('sheet'); el.innerHTML=h; document.body.classList.add('sheetOn'); document.getElementById('sx').onclick=closeSheet;
    document.getElementById('demoOutCopy').onclick=function(){ var ta=document.getElementById('demoOut'); ta.select(); try { document.execCommand('copy'); done(); } catch(e){} }; };
  try { if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ done(); show(); }, show); else show(); } catch(e){ show(); } }
function inImportHtml_(){
  if(!APP || !FIN.canEdit) return '';
  var open=S.foldOpen&&S.foldOpen.imp;
  return '<details class="inCard fold" id="inImport" data-fold="imp"'+(open?' open':'')+'><summary class="foldHead"><span><b>📥 Bring in entries from the demo</b><span class="dsub">Everything entered in the preview, in one go</span></span><span class="foldR"><span class="chev">▾</span></span></summary>'+
    '<p class="inLast">In the demo, tap <b>📤 Copy my entries for Impact</b> at the top, then paste it here. It <b>replaces</b> what is in Impact for this campus now — Undo puts it back.</p>'+
    '<textarea id="impText" style="width:100%;height:120px;font:12px monospace" placeholder="Paste here">'+esc(S.impTxt||'')+'</textarea>'+
    (S.impErr ? '<p class="inErr" role="alert">⚠️ '+esc(S.impErr)+'</p>' : '')+
    '<div class="inBtns"><button class="btn'+(S.impAsk?' warn':'')+'" id="impGo">'+(S.impAsk?'Tap again — this replaces what is here':'Bring them in')+'</button></div></details>'; }
function importDemo_(){ var ta=document.getElementById('impText'), txt=ta?ta.value.trim():'', o=null;
  try { o=JSON.parse(txt); } catch(e){}
  if(!o || o.gpFinDemo!==1 || !o.state || typeof o.state!=='object'){ S.impErr='That isn’t the text the demo copies — tap 📤 in the demo again and paste all of it.'; S.impAsk=false; S.impTxt=txt; render(); return; }
  var has=BAL_DAYS.length || INCOMES.length || EXPENSES.length || TRANSFERS.length || MANUAL_ALLOCS.length;
  if(has && !S.impAsk){ S.impAsk=true; S.impErr=''; S.impTxt=txt; render(); return; }
  snap_('Put back what was in Impact before the demo’s entries');
  resetState_(); loadState_(o.state); refreshBal_(); keep_();
  S.impAsk=false; S.impErr=''; S.impTxt=''; (S.foldOpen=S.foldOpen||{}).imp=false; render(); toast('Brought in — saving to Impact'); }
document.addEventListener('click', function(e){ if(e.target.id==='impGo') importDemo_(); });
document.addEventListener('click', function(e){ var pa=e.target.closest && e.target.closest('[data-bulkprealloc]'); if(pa && S.bulkPre){ S.bulkPre.alloc=pa.dataset.bulkprealloc; render(); } var pl=e.target.closest && e.target.closest('[data-bulkpreliq]'); if(pl && S.bulkPre){ S.bulkPre.liq=pl.dataset.bulkpreliq; render(); } var pf=e.target.closest && e.target.closest('[data-bulkprefix]'); if(pf && S.bulkPre){ S.bulkPre.fix=pf.dataset.bulkprefix; render(); } });
document.addEventListener('click', function(e){ if(e.target.id!=='bulkNoteApply' || !S.bulk) return; S.bulk.note=String(S.bulkNote||'').trim(); var n=bulkNoteApply_(S.bulk.rows, bulkNoteRead_(S.bulk.note)); S.bulkNoteMsg=n ? 'Changed '+n+' line'+(n>1?'s':'')+' — tick the ones that are right.' : 'Every line already matched it.'; render(); });
/* ---- Inside My Ministry (?embed=1): one page with the app ----
   The page tells the app how tall it is (the app makes the frame that tall, so nothing scrolls on its
   own), and the app tells the page which part of it is on screen as it scrolls. */
var EMBED=APP && !!QS.get('embed'), FV={ top:0, h:0 };
function finTell_(){ if(!EMBED || window.parent===window) return; try { window.parent.postMessage({ gpFin:'h', h:Math.ceil(document.body.scrollHeight) }, location.origin); } catch(e){} }
function finStick_(){ if(!EMBED) return; var b=document.querySelector('.inDay'); if(!b) return;
  var cur=parseFloat(b.dataset.ty||'0'), r=b.getBoundingClientRect(), natural=r.top+window.scrollY-cur, box=b.parentElement.getBoundingClientRect();
  var end=box.bottom+window.scrollY-natural-r.height, ty=Math.max(0, Math.min(FV.top-natural, end));
  b.dataset.ty=ty; b.style.transform=ty ? 'translateY('+ty+'px)' : ''; }
if(EMBED){
  window.addEventListener('message', function(e){ if(e.origin!==location.origin || !e.data || e.data.gpFin!=='view') return;
    FV.top=Math.max(0, +e.data.top||0); FV.h=Math.max(200, +e.data.h||0);
    var r=document.documentElement.style; r.setProperty('--vt', FV.top+'px'); r.setProperty('--vh', FV.h+'px');
    if(+e.data.sh>0) r.setProperty('--sh', Math.max(300, +e.data.sh)+'px'); finStick_(); });
  try { new ResizeObserver(function(){ finTell_(); finStick_(); }).observe(document.body); } catch(e){ setInterval(finTell_, 1000); }

     which on a computer left a dark strip down the middle), and a tap on the app's dim closes it */
  var finSheetWas=false;
  try { new MutationObserver(function(){ var on=document.body.classList.contains('sheetOn'); if(on===finSheetWas) return; finSheetWas=on;
    try { window.parent.postMessage({ gpFin:'sheet', on:on }, location.origin); } catch(e){} }).observe(document.body, { attributes:true, attributeFilter:['class'] }); } catch(e){}
  window.addEventListener('message', function(e){ if(e.origin===location.origin && e.data && e.data.gpFin==='close') closeSheet(); });
  window.addEventListener('load', finTell_);
}
refreshBal_();
if(APP) finBoot_(); else render();
