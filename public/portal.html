  document.querySelectorAll('[data-pick]').forEach(function(b){ b.onclick=function(){ keepReg_(); P.apply=b.getAttribute('data-pick'); render(); }; });
  document.querySelectorAll('[data-msgr]').forEach(function(b){ b.onclick=function(){ keepReg_(); P.reg.messenger=b.getAttribute('data-msgr'); render(); }; });
  on_('regBtn', register_);
  on_('loginBtn', login_);
  on_('pinLoginBtn', pinLogin_);
  on_('toPinLogin', function(){ P.pinLogin=!P.pinLogin; render(); });
  var lp=document.getElementById('l_pin'); if(lp) lp.onkeydown=function(e){ if(e.key==='Enter') pinLogin_(); };
  var lpw=document.getElementById('l_pw'); if(lpw) lpw.onkeydown=function(e){ if(e.key==='Enter') login_(); };
  var lem=document.getElementById('l_email'); if(lem) lem.oninput=function(){ P.reg.email=lem.value; };
  on_('googleBtn', googleGo_);
  on_('goGpApp', function(){ if(P.view==='preview') return; lsSet('gp-student', JSON.stringify(P.auth)); location.href='teams.html?student=1'; });
  on_('installBtn', function(){ var ev=P.installEvt; if(!ev) return; P.installEvt=null; try { ev.prompt(); } catch(e){} render(); });
  on_('installLater', function(){ lsSet('gp-portal-a2hs','1'); P.a2hsOff=true; render(); });
  on_('changePw', function(){ P.changePw=true; render(); });
  on_('cancelPw', function(){ P.changePw=false; render(); });
  on_('savePw', savePassword_);
  // applicant
  on_('saveTeamNums', function(){
    var n=readTeamNumbers_('t');
    P.busy=true; render();
    run('portalSaveTeamNumbers', [P.auth.user, P.auth.pin, n.metrics, n.reached], function(d){ P.busy=false; if(d && d.ok){ P.boot=d; showMsg(t('Saved')); } else showMsg(t('Could not save — try again.')); render(); }, function(){ P.busy=false; showMsg(t('Connection problem — try again.')); render(); });
  });
  on_('editContact', function(){ P.editContact=true; P.contact={ phone:P.boot.me.phone, messenger:P.boot.me.messenger, country:P.boot.me.country }; render(); });
  on_('cancelContact', function(){ P.editContact=false; P.contact=null; render(); });
  document.querySelectorAll('[data-cmsgr]').forEach(function(b){ b.onclick=function(){ keepContact_(); P.contact.messenger=b.getAttribute('data-cmsgr'); render(); }; });
  on_('saveContact', saveContact_);
  // staff
  var q=document.getElementById('q'); if(q){ q.oninput=function(){ P.q=q.value; renderList_(); }; }
  document.querySelectorAll('[data-filter]').forEach(function(b){ b.onclick=function(){ P.filter=b.getAttribute('data-filter'); render(); }; });
  document.querySelectorAll('[data-open]').forEach(function(b){ b.onclick=function(e){ if(e.target.closest('[data-chat]')) return; P.sel=b.getAttribute('data-open'); P.note=''; P.editAnswers=false; render(); var p=document.getElementById('panel'); if(p && window.innerWidth<900) p.scrollIntoView({ behavior:'smooth', block:'start' }); }; });
  on_('closePanel', function(){ P.sel=null; render(); });
  on_('saveCand', saveCand_);
  on_('addNote', addNote_);
  bindCalls_();
  on_('archiveCand', archiveCand_);
  on_('deleteCand', deleteCand_);
  on_('viewAsCand', function(){ var c=selected_(); if(!c) return; P.pv.mode='record'; P.pv.candId=c.id; P.pv.boot=null; P.pv.screen='me'; P.pv.sec=0; P.view='preview'; render(); window.scrollTo(0,0); });
  on_('openForm', openForm_);
  on_('openFormTop', openForm_);
  on_('viewAnswers', function(){ P.showAnswers=!P.showAnswers; render(); });
  on_('refNew', function(){ makeRefLink_(null, function(link, d){ P.refLink=link; if(P.boot.application) P.boot.application.reference=d.reference; render(); }); });
  var goRef=function(){ gpTapSafe_(); P.refNext=false; if(!P.refLink){ var r=(P.boot.application && P.boot.application.reference)||{}; if(r.status!=='received'){ makeRefLink_(null, function(link, d){ P.refLink=link; if(P.boot.application) P.boot.application.reference=d.reference; render(); scrollToRef_(); }); return; } } render(); scrollToRef_(); };
  on_('refGo', goRef);
  document.querySelectorAll('[data-refgo]').forEach(function(b){ b.onclick=goRef; });
  on_('refCopy', function(){ copyText_(P.refLink); });
  on_('editAnswersMine', function(){ P.answers=JSON.parse(JSON.stringify((P.boot.application && P.boot.application.answers)||{})); P.editMine=true; P.view='form'; P.formSec=0; P.formMissing=null; render(); window.scrollTo(0,0); });
  on_('navMenu', function(){ P.menuOpen=!P.menuOpen; render(); if(P.menuOpen){ var f=document.querySelector('#staffMenu .menuItem'); if(f) f.focus(); } });
  on_('menuClose', function(){ P.menuOpen=false; render(); var b=document.getElementById('navMenu'); if(b) b.focus(); });
  on_('menuScrim', function(){ P.menuOpen=false; render(); });
  on_('toForms', function(){ P.menuOpen=false; if(P.view==='forms') return; P.view='forms'; render(); });
  on_('toVisaInfo', function(){ P.menuOpen=false; if(P.view==='visa') return; P.view='visa'; P.viDraft=null; render(); });
  on_('toResources', function(){ P.menuOpen=false; if(P.view==='resources') return; P.view='resources'; P.resDraft=null; render(); });
  on_('toTeam', function(){ P.menuOpen=false; if(P.view==='team') return; P.view='team'; P.teamEdit=null; render(); });
  on_('toLegal', function(){ P.menuOpen=false; if(P.view==='legal') return; P.view='legal'; P.legalDocs=null; P.legalPreview=null; render(); });
  on_('toAccess', function(){ P.menuOpen=false; if(P.view==='access') return; P.view='access'; P.access=null; P.accessQ=''; render(); });
  bindAccess_();
  bindTeamAdmin_();
  bindTabs_();
  on_('navCrm', function(){ P.menuOpen=false; if(P.view==='crm') return; P.view='crm'; render(); });
  on_('toLink', function(){ P.menuOpen=false; P.linkOpen=!P.linkOpen; render(); });
  on_('closeLink', function(){ P.linkOpen=false; render(); });
  on_('copyApplyLink', function(){ var el=document.getElementById('applyLinkBox'); if(el) copyText_(el.value); });
  document.querySelectorAll('[data-linkkind]').forEach(function(b){ b.onclick=function(){ P.linkKind=b.getAttribute('data-linkkind'); render(); copyText_(applyLinkUrl_(P.linkKind)); }; });
  on_('toPreview', function(){ P.menuOpen=false; if(P.view==='preview') return; P.view='preview'; P.pv.boot=null; P.pv.screen='me'; P.pv.sec=0; render(); });
  on_('toAccounts', function(){ P.menuOpen=false; if(P.view==='accounts') return; P.view='accounts'; P.accSel=null; P.accNew=false; P.accounts=null; render(); });
  bindForm_(); bindForms_(); bindAccounts_(); bindRef_(); bindStay_(); bindSign_(); bindLegalAdmin_(); bindPreview_(); bindStays_(); bindPeople_(); bindDocs_(); bindVisaHow_(); bindVisaAdmin_(); if(P.view==='crm') bindPanelExtras_();
}
/* Typing in the search box re-draws only the list, so the box keeps focus. */
function renderList_(){
  var wrap=document.querySelector('.crm'); if(!wrap) return;
  var tmp=document.createElement('div'); tmp.innerHTML=crmHtml_();
  var fresh=tmp.querySelector('.tbl'), cur=document.querySelector('.crm .tbl');
  if(fresh && cur){ cur.replaceWith(fresh); document.querySelectorAll('[data-open]').forEach(function(b){ b.onclick=function(e){ if(e.target.closest('[data-chat]')) return; P.sel=b.getAttribute('data-open'); P.note=''; render(); }; }); }
}
function keepContact_(){
  P.contact=P.contact||{};
  var ph=document.getElementById('c_phone'), co=document.getElementById('c_country');
  if(ph) P.contact.phone=ph.value; if(co) P.contact.country=co.value;
}
function saveContact_(){
  keepContact_();
  var c=P.contact||{};
  if(String(c.phone||'').replace(/\D/g,'').length<6){ showMsg(t('Add a phone number with the country code.')); return; }
  if(!c.messenger){ showMsg(t('Choose WhatsApp or Telegram.')); return; }
  P.busy=true; render();
  run('portalUpdateContact', [P.auth.user, P.auth.pin, { phone:c.phone, messenger:c.messenger, country:c.country }], function(d){
    P.busy=false;
    if(d && d.ok){ P.boot=d; P.editContact=false; P.contact=null; showMsg(t('Saved')); }
    else showMsg(d && d.err==='phone_required' ? t('Add a phone number with the country code.') : t('Could not save'));
    render();
  });
}
function selected_(){ return (P.boot.applicants||[]).filter(function(x){ return x.id===P.sel; })[0] || null; }
function putCand_(d){
  if(!(d && d.ok && d.candidate)){ showMsg(d && d.err==='not_authorized' ? t('No portal access') : t('Could not save')); return false; }
  var found=false;
  P.boot.applicants=P.boot.applicants.map(function(x){ if(x.id===d.candidate.id){ found=true; return Object.assign({}, x, d.candidate, { status:d.candidate.status||x.status }); } return x; });
  if(!found) P.boot.applicants.push(d.candidate);
  return true;
}
/* The CRM rebuilds the record from what is sent, so send the whole record
   with the changed fields — the server keeps the portal's own fields and
   the log regardless. After a save the status the applicant sees may have
   moved, so the list is refreshed from the server. */
function saveCand_(){
  var c=selected_(); if(!c) return;
  var rec=Object.assign({}, c, { stage:document.getElementById('p_stage').value, assignedTo:document.getElementById('p_owner').value,
    nextStep:document.getElementById('p_next').value.trim(), nextDate:document.getElementById('p_date').value });
  P.busy=true; render();
  run('hrSaveCandidate', [P.auth.user, P.auth.pin, rec], function(d){
    P.busy=false;
    if(putCand_(d)){ showMsg(t('Saved')); boot_(); return; }
    render();
  });
}
function addNote_(){
  var c=selected_(); if(!c) return;
  var txt=String((document.getElementById('p_note')||{}).value||'').trim();
  if(!txt){ showMsg(t('Write the note first.')); return; }
  P.busy=true; render();
  run('hrCandidateNote', [P.auth.user, P.auth.pin, c.id, txt], function(d){
    P.busy=false; P.note='';
    if(putCand_(d)) showMsg(t('Note added'));
    render();
  });
}
/* Permanent, admins only: the application and, when there is one, the
   applicant's account. Asks twice in one breath — the name has to be typed
   back — because there is no undo. */
function deleteCand_(){
  var c=selected_(); if(!c) return;
  var typed=prompt(gpT('This deletes {name}’s application{account} for good. Type their name to confirm.', {name:candName_(c), account: c.hasAccount ? t(' and their account') : ''}));
  if(typed===null) return;
  if(String(typed).trim().toLowerCase()!==String(candName_(c)).trim().toLowerCase()){ showMsg(t('The name did not match — nothing was deleted.')); return; }
  P.busy=true; render();
  run('portalDeleteApplicant', [P.auth.user, P.auth.pin, c.id], function(d){
    P.busy=false;
    if(d && d.ok){ P.boot=d; P.sel=null; showMsg(t('Deleted')); render(); return; }
    showMsg(d && d.err==='not_authorized' ? t('Only a portal admin can delete') : t('Could not delete'));
    render();
  });
}
function archiveCand_(){
  var c=selected_(); if(!c) return;
  var info = c.archived ? null : { reason: prompt(t('Why is this application closing? (optional)')) || '' };
  if(!c.archived && info.reason===null) return;
  run('hrArchiveCandidate', [P.auth.user, P.auth.pin, c.id, info], function(d){
    if(putCand_(d)){ showMsg(c.archived ? t('Reopened') : t('Closed')); boot_(); return; }
    render();
  });
}
render();
function keepReg_(){
  var g=function(id){ var el=document.getElementById(id); return el ? el.value : undefined; };
  ['name','email','phone','country','team'].forEach(function(k){ var v=g('r_'+k); if(v!==undefined) P.reg[k]=v; });
}
/* The applicant's form, from the dashboard or straight after sign-up. */
function openForm_(){
  var go=function(){ P.view='form'; P.formSec=0; P.formMissing=null; render(); window.scrollTo(0,0); };
  if(P.boot.form) return go();
  // an older sign-up reply had no form — fetch the dashboard again, then open
  P.busy=true; render();
  run('portalBoot', [P.auth.user, P.auth.pin], function(d){ P.busy=false; if(d && d.ok && d.form){ P.boot=d; go(); return; } P.view='me'; showMsg(t('Could not load the form — try again.')); render(); }, function(){ P.busy=false; P.view='me'; showMsg(t('Connection problem — try again.')); render(); });
}
function register_(){
  keepReg_();
  var a=applyByKey_(P.apply);
  var pw=(document.getElementById('r_pw')||{}).value||'', pw2=(document.getElementById('r_pw2')||{}).value||'';
  var r=P.reg;
  if(!a){ showMsg(t('Pick what you are applying for.')); return; }
  if(!offeredAt_(a, P.campus||DEFAULT_CAMPUS)){ showMsg(t('That school is not run at this campus — pick another.')); return; }
  if(a.type==='team' && !String(r.team||'').trim()){ showMsg(t('Add your sending church, base or organization.')); return; }
  if(!String(r.name||'').trim()){ showMsg(t('Add your full name.')); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(r.email||'').trim())){ showMsg(t('Add a real email address.')); return; }
  if(String(r.phone||'').replace(/\D/g,'').length<6){ showMsg(t('Add a phone number with the country code.')); return; }
  if(!r.messenger){ showMsg(t('Choose WhatsApp or Telegram.')); return; }
  if(!P.gtoken){
    if(pw.length<8){ showMsg(t('The password needs at least 8 characters.')); return; }
    if(pw!==pw2){ showMsg(t('The two passwords don’t match.')); return; }
  }
  P.busy=true; render();
  var email=String(r.email).trim().toLowerCase();
  var payload={ name:String(r.name).trim(), email:email, phone:String(r.phone).trim(), messenger:r.messenger, country:r.country||'', type:a.type, school:a.school, campus:P.campus||DEFAULT_CAMPUS };
  if(P.gtoken) payload.googleToken=P.gtoken; else payload.password=pw;
  if(a.type==='team') payload.teamName=String(r.team||'').trim();
  run('portalRegister', [payload], function(d){
    P.busy=false;
    // straight into the application: people made the account and then forgot to apply
    if(d && d.ok){ P.auth={ user:d.user||email, pin:(P.gtoken ? d.token : pw) }; lsSet('gp-portal', JSON.stringify(P.auth)); P.boot=d; P.answers=JSON.parse(JSON.stringify((d.application && d.application.answers)||{})); P.reg={}; P.gtoken='';
      P.view='me'; showMsg(t('Your account is ready — now your application.')); openForm_(); return; }
    var e=d && d.err;
    showMsg(e==='email_taken' || e==='taken' ? t('There is already an account with that email. Sign in instead.')
      : e==='google' ? t('Google sign-in ran out — go back and tap Continue with Google again.')
      : e==='bad_password' ? t('The password needs at least 8 characters.')
      : e==='bad_email' ? t('Add a real email address.') : e==='phone_required' ? t('Add a phone number with the country code.') : t('Check your details and try again.'));
    render();
  });
}
function login_(){
  var u=String((document.getElementById('l_email')||{}).value||'').trim().toLowerCase(), pw=String((document.getElementById('l_pw')||{}).value||'');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u) || !pw){ showMsg(t('Enter your email and password.')); return; }
  P.reg.email=u;
  signIn_(u, pw, t('Wrong email or password.'));
}
function pinLogin_(){
  var u=String((document.getElementById('l_user')||{}).value||'').trim().toLowerCase(), pin=String((document.getElementById('l_pin')||{}).value||'');
  if(!u || !/^\d{4}$/.test(pin)){ showMsg(t('Enter your username and 4-digit PIN.')); return; }
  P.reg.username=u;
  signIn_(u, pin, t('Wrong username or PIN.'));
}
function signIn_(u, secret, wrongMsg){
  P.busy=true; render();
  P.auth={ user:u, pin:secret };
  run('portalBoot', [u, secret], function(d){
    P.busy=false;
    if(d && d.ok){ P.boot=d; if(d.role==='applicant') P.answers=(d.application && d.application.answers)||{}; P.view = d.role==='applicant' ? 'me' : 'crm'; openFromLink_(d); lsSet('gp-portal', JSON.stringify(P.auth)); render(); return; }
    if(d && d.err==='not_authorized'){ P.view='noaccess'; render(); return; }
    if(d && d.err==='no_application'){ P.view='noaccess'; P.err='no_application'; render(); return; }
    P.auth=null; showMsg(wrongMsg); render();
  });
}
/* An applicant with a password changes it from their dashboard. */
function savePassword_(){
  var a=String((document.getElementById('cp_new')||{}).value||''), b=String((document.getElementById('cp_new2')||{}).value||'');
  if(a.length<8){ showMsg(t('The password needs at least 8 characters.')); return; }
  if(a!==b){ showMsg(t('The two passwords don’t match.')); return; }
  P.busy=true; render();
  run('portalSetPassword', [P.auth.user, P.auth.pin, a], function(d){
    P.busy=false;
    if(d && d.ok){
      var switched = P.boot && P.boot.me && P.boot.me.authKind==='pin';
      P.auth.pin=a; if(d.user) P.auth.user=d.user; lsSet('gp-portal', JSON.stringify(P.auth)); P.changePw=false;
      if(P.boot && P.boot.me){ P.boot.me.authKind='password'; if(d.user) P.boot.me.username=d.user; }
      showMsg(switched ? t('Done — you now sign in with your email and password.') : t('Password changed'));
    }
    else showMsg(t('Could not change the password — try again.'));
    render();
  });
}
