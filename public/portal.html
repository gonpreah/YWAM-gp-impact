<style>
/* ==================== YWAM GP PORTAL — its own look ====================
   Deliberately NOT the GP app's theme (that block lives in index / teams /
   help and test-theme keeps those three identical — this page is outside
   it). Black, white type, one card in the middle of the screen, the way an
   application portal reads: the logo and the portal's name on top, then
   exactly one thing to do. Status colours are the only colour on the page. */
:root {
  --bg:#000000; --surface:#111111; --surface2:#1A1A1A; --border:#2A2A2A; --border2:#3A3A3A;
  --ink:#FFFFFF; --muted:#A3A3A3; --faint:#737373; --onDark:#FFFFFF; --onDarkFaint:#A3A3A3;
  --accent:#FFFFFF; --accentInk:#000000; --link:#FFFFFF;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; --info:#60A5FA;
  --r:14px; --rSm:10px;
  color-scheme:dark;
}
* { box-sizing:border-box; }
html, body { margin:0; padding:0; overflow-x:hidden; }
body { background:var(--bg); color:var(--ink); font-family:'Inter','Kantumruy Pro',system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom); -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; }
button, select, input, textarea { font-family:inherit; font-size:inherit; color:inherit; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
a { color:var(--link); }
/* ---- header: a slim bar when signed in, a centred hero on the gate ---- */
header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top)) 20px 14px; border-bottom:1px solid var(--border); }
.brandRow { display:flex; align-items:center; gap:12px; min-width:0; }
.logoImg { height:34px; width:auto; display:block; }
.brandTitle { font-weight:600; font-size:16px; letter-spacing:.2px; white-space:nowrap; }
.brandSub { display:none; }
.hbtns { display:flex; gap:8px; align-items:center; }
.hbtn { border:1px solid var(--border2); background:transparent; color:var(--ink); border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; white-space:nowrap; }
/* on a phone the title gives way to the buttons — never under them */
.hbtns { flex:0 0 auto; } .brandRow > div { min-width:0; } .brandTitle { overflow:hidden; text-overflow:ellipsis; }
@media (max-width:420px) { header { padding-left:14px; padding-right:14px; gap:8px; } .brandRow { gap:8px; } .logoImg { height:28px; } .brandTitle { font-size:15px; white-space:normal; line-height:1.15; } .hbtns { gap:6px; } .hbtn { padding:6px 10px; } }
.hbtn:hover { border-color:var(--ink); }
body.gate header { flex-direction:column; justify-content:center; gap:14px; border-bottom:0; padding:calc(48px + env(safe-area-inset-top)) 20px 8px; text-align:center; }
body.gate .brandRow { flex-direction:column; gap:14px; }
body.gate .logoImg { height:72px; }
body.gate .brandTitle { font-size:30px; font-weight:700; letter-spacing:-.3px; line-height:1.1; }
body.gate .brandSub { display:block; font-size:13px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:6px; }
body.gate .hbtns { position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px; }
body.gate main { padding-top:12px; }
/* ---- type & layout ---- */
main { padding:20px 16px 48px; max-width:1100px; margin:0 auto; }
@media (min-width:1200px) { body.wideStaff main { max-width:1400px; } }
h1 { font-size:28px; font-weight:700; letter-spacing:-.3px; margin:0 0 4px; line-height:1.15; }
h2 { font-size:20px; font-weight:600; margin:0 0 4px; }
h3 { font-size:13px; font-weight:600; letter-spacing:1.4px; text-transform:uppercase; color:var(--muted); margin:18px 0 10px; }
.sub { font-size:14px; color:var(--muted); margin:0 0 14px; line-height:1.5; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; margin-bottom:14px; }
.card.hero { background:transparent; border-color:var(--border2); }
.center { max-width:440px; margin:0 auto; }
.wide { max-width:680px; margin:0 auto; }
.gateTitle { text-align:center; margin:0 0 18px; }
.gateTitle h2 { font-size:22px; }
.eyebrow { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:6px; }
.btn { width:100%; margin-top:14px; padding:13px 16px; font-weight:600; font-size:15px; background:var(--accent); color:var(--accentInk); border:none; border-radius:var(--rSm); cursor:pointer; transition:opacity .12s, transform .08s; }
.btn:hover { opacity:.9; } .btn:active { transform:scale(.99); } .btn:disabled { opacity:.5; cursor:default; }
.btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--border2); }
.btn.ghost:hover { border-color:var(--ink); opacity:1; }
.btn.small { width:auto; margin:0; padding:9px 14px; font-size:14px; }
.linkbtn { background:none; border:none; color:var(--link); font-size:14px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:10px; width:100%; margin-top:6px; }
.linkbtn.inline { width:auto; padding:0; margin:0; }
.linkbtn.danger { color:var(--bad); }
.gsiWrap { display:flex; justify-content:center; min-height:44px; margin:4px 0 2px; }
.gsiWrap .gsiFallback { font-size:13px; opacity:.8; }
.googleBtn { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 16px; border-radius:999px; border:1px solid var(--border2); background:var(--surface2); color:var(--ink); font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
.googleBtn:hover { border-color:var(--ink); } .googleBtn:disabled { opacity:.6; cursor:default; } .googleBtn svg { flex:0 0 auto; }
.orRow { display:flex; align-items:center; gap:10px; color:var(--faint); font-size:12.5px; margin:12px 0 2px; }
.orRow:before, .orRow:after { content:''; flex:1; border-top:1px solid var(--border); }
.installCard { margin-bottom:14px; }
.pwBox { margin-top:10px; padding-top:6px; border-top:1px solid var(--border); }
label.f { display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
input[type=text], input[type=tel], input[type=email], input[type=number], input[type=password], input[type=date], select, textarea {
  width:100%; padding:12px 14px; border:1px solid var(--border2); border-radius:var(--rSm); background:var(--bg); color:var(--ink); font-size:16px; }
input::placeholder, textarea::placeholder { color:var(--faint); }
input:focus, select:focus, textarea:focus { border-color:var(--ink); outline:none; }
select { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size:6px 6px; background-repeat:no-repeat; padding-right:38px; }
textarea { min-height:80px; resize:vertical; }
.hint { font-size:12.5px; color:var(--faint); margin-top:6px; line-height:1.45; }
.seg { display:flex; gap:8px; }
.seg button { flex:1; padding:11px; border-radius:var(--rSm); border:1px solid var(--border2); background:var(--bg); font-size:15px; cursor:pointer; }
.seg button.on { background:var(--ink); border-color:var(--ink); color:var(--accentInk); font-weight:600; }
.row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
.row:last-child { border-bottom:0; }
.rowName { font-size:14.5px; } .rowSub { display:block; font-size:12.5px; color:var(--muted); margin-top:2px; }
.banner { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--rSm); padding:11px 13px; font-size:13.5px; line-height:1.45; margin-bottom:14px; }
.msg { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--accentInk);
  padding:10px 16px; border-radius:999px; font-size:13.5px; font-weight:500; opacity:0; transition:opacity .2s; pointer-events:none; z-index:80; max-width:92vw; text-align:center; }
.msg.show { opacity:1; }
.chips { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
.chip { border:1px solid var(--border2); background:transparent; border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer; color:var(--muted); }
.chip:hover { border-color:var(--ink); color:var(--ink); }
.chip.on { background:var(--ink); border-color:var(--ink); color:var(--accentInk); font-weight:600; }
.chip:disabled { opacity:.5; cursor:default; }
.memberList { margin:0 0 8px; padding-left:22px; line-height:1.6; }
/* the applicant's tabs, meet our team, strengths, resources */
.anav { display:grid; gap:4px; }
.anav .staffNavBtn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-width:0; padding:8px 2px 7px; font-size:11.5px; line-height:1.15; white-space:normal; text-align:center; }
.anav .aIcon { font-size:18px; line-height:1; } .anav .aLabel { overflow:hidden; text-overflow:ellipsis; max-width:100%; }
@media (min-width:600px) { .anav .staffNavBtn { flex-direction:row; gap:7px; font-size:13.5px; padding:9px 10px; } }
.meetGrid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
@media (min-width:600px) { .meetGrid { grid-template-columns:repeat(3, minmax(0,1fr)); } }
@media (min-width:900px) { .meetGrid { grid-template-columns:repeat(4, minmax(0,1fr)); } }
.meetCard { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px; text-align:center; }
.meetPhoto { width:96px; height:96px; border-radius:50%; margin:0 auto 10px; overflow:hidden; background:var(--surface2); display:flex; align-items:center; justify-content:center; }
.meetPhoto img { width:100%; height:100%; object-fit:cover; }
.meetInitials { font-size:28px; font-weight:700; color:var(--muted); }
.meetName { font-weight:600; font-size:14.5px; }
.meetRole { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.35; }
.meetCard.editing { text-align:left; grid-column:1 / -1; }
.meetCard.meetHidden { opacity:.55; border-style:dashed; }
.docAll { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 8px; } .docAll .btn { margin:0; width:auto; }
.docGallery { position:fixed; inset:0; z-index:70; background:var(--bg, #000); display:flex; flex-direction:column; }
.docGalHead { display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; border-bottom:1px solid var(--border); background:var(--surface); }
.docGalHead b { flex:1; min-width:0; } .docGalHead .btn { margin:0; width:auto; }
.docGalBody { flex:1; overflow-y:auto; padding:14px; display:grid; grid-template-columns:minmax(0,1fr); gap:16px; max-width:900px; width:100%; margin:0 auto; }
@media (min-width:900px) { .docGalBody { grid-template-columns:repeat(2, minmax(0,1fr)); max-width:1300px; } }
.docGalItem { margin:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
.docGalItem img { display:block; width:100%; height:auto; background:#fff; }
.docGalPdf { padding:28px 14px; text-align:center; font-weight:600; }
.docGalItem figcaption { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; font-size:13px; color:var(--muted); }
.docGalItem figcaption span { min-width:0; overflow-wrap:anywhere; }
.meetCard.editing .meetPhoto { margin-bottom:8px; }
.meetBtns { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
.meetCard.editing input[type=text] { width:100%; }
.upRow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:6px 0; border-top:1px solid var(--border); }
.upRow .docName { flex:1 1 140px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.upRow select { flex:1 1 150px; min-width:0; margin:0; }
.upRow.busy { opacity:.6; pointer-events:none; }
.pAv svg { display:block; } .pAv { flex:0 0 auto; }
.pResultHead { display:flex; gap:12px; align-items:center; margin-bottom:8px; }
.pAxes { display:flex; flex-direction:column; gap:8px; margin:10px 0; }
.pAxis { display:grid; grid-template-columns:1fr 2fr 1fr; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
.pAxA { text-align:right; } .pAxB { text-align:left; }
.pAxBar { height:8px; border-radius:99px; background:var(--surface2); overflow:hidden; } .pAxBar div { height:100%; background:var(--ink); }
.pAxBar.split { background:var(--border2); } .pAxBar.split div { background:#fff; }
.pCols { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:8px 0; } .pCols ul, .pResult ul { margin:4px 0 8px; padding-left:18px; font-size:13.5px; line-height:1.5; }
@media (max-width:520px) { .pCols { grid-template-columns:1fr; } }
.pGroups { display:grid; grid-template-columns:1fr 1fr; gap:10px; } @media (max-width:520px) { .pGroups { grid-template-columns:1fr; } }
.pGroup { border:1px solid var(--border2); border-left-width:4px; border-radius:var(--rSm); padding:10px 12px; }
.pGroupHead { display:flex; justify-content:space-between; align-items:center; } .pGroupN { font-weight:700; font-size:18px; }
.pGroupPeople { display:flex; flex-wrap:wrap; gap:6px; } .pChip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border2); border-radius:999px; padding:3px 9px 3px 4px; font-size:12.5px; }
.pChip svg { display:block; border-radius:50%; }
.pPick { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-bottom:10px; } @media (min-width:600px) { .pPick { grid-template-columns:repeat(4, minmax(0,1fr)); } }
.pPickBtn { display:flex; flex-direction:column; align-items:center; gap:2px; border:1px solid var(--border2); background:transparent; color:var(--ink); border-radius:var(--rSm); padding:10px 6px; cursor:pointer; font:inherit; } .pPickBtn span { font-size:11px; color:var(--muted); } .pPickBtn:hover { border-color:var(--ink); }
.pStmt { padding:16px 4px 18px; border-bottom:1px solid var(--border); } .pStmt:last-child { border-bottom:0; } .pStmt.done { opacity:.6; }
.pStmt .pText { font-size:15.5px; font-weight:600; text-align:center; line-height:1.4; margin-bottom:12px; }
.pScale { display:flex; align-items:center; justify-content:space-between; max-width:300px; margin:0 auto; }
.pScaleEnds { display:flex; justify-content:space-between; max-width:300px; margin:8px auto 0; font-size:11.5px; color:var(--muted); }
.pDot { border-radius:50%; background:transparent; cursor:pointer; padding:0; flex:0 0 auto; border:2px solid var(--border2); }
.pDot.s3 { width:38px; height:38px; } .pDot.s2 { width:32px; height:32px; } .pDot.s1 { width:26px; height:26px; } .pDot.s0 { width:22px; height:22px; }
.pDot.ag { border-color:#4ADE80; } .pDot.dis { border-color:#60A5FA; } .pDot.on.ag { background:#4ADE80; } .pDot.on.dis { background:#60A5FA; } .pDot.on.mid { background:var(--muted); }
.resRow { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); color:var(--ink); text-decoration:none; }
.resRow:last-child { border-bottom:0; } .resRow.dim { opacity:.6; }
.resIcon { font-size:22px; flex:0 0 auto; } .resBody { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; font-size:14.5px; } .resBody .hint { margin:0; }
.resPhone { font-weight:700; font-size:18px; letter-spacing:1px; } .resGo { color:var(--muted); } .resNote { font-size:13.5px; white-space:pre-line; }
.resLogo { width:40px; height:40px; border-radius:10px; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:20px; }
.resLogo img { width:28px; height:28px; object-fit:contain; } .resGet { color:var(--accent, var(--ink)); font-weight:600; font-size:13.5px; white-space:nowrap; }
.resEdit { padding:10px 0 12px; border-bottom:1px solid var(--border); }
.memberRow { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.memberRow input { flex:1; min-width:0; margin:0; }
.memberSeg { flex:0 0 auto; margin:0; }
.memberSeg button { padding:8px 10px; font-size:13px; }
.roster { display:flex; flex-direction:column; gap:8px; margin:6px 0 4px; }
.rosterRow { display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); }
.rosterRow:last-child { border-bottom:0; }
.rosterRow.busy { opacity:.5; }
.rosterName { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; font-size:14px; }
.rosterName b { font-weight:600; overflow-wrap:anywhere; }   /* a full name wraps, never cut off */
.rosterTally { font-size:12.5px; color:var(--muted); margin:0 0 4px; }
.avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; flex:0 0 44px; background:var(--surface2); }
.avatar.ph { display:inline-flex; align-items:center; justify-content:center; color:var(--muted); font-weight:700; font-size:14px; border:1px dashed var(--border2); }
.avatar.big { width:64px; height:64px; flex-basis:64px; }
.camBtn { border:1px solid var(--border2); background:transparent; color:var(--ink); border-radius:999px; padding:7px 11px; font-size:13px; cursor:pointer; white-space:nowrap; }
.camBtn:hover { border-color:var(--ink); }
.countryQ { margin-bottom:6px; }
.secIcon { font-size:40px; line-height:1; margin-bottom:6px; }
.confettiWrap { position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
.confettiBit { position:absolute; width:9px; height:9px; border-radius:2px; will-change:transform, opacity; }
.pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600; border:1px solid var(--border2); background:var(--surface2); color:var(--muted); white-space:nowrap; }
.pill.pending, .pill.in_review, .pill.interview { color:var(--warn); border-color:var(--warn); background:transparent; }
.pill.accepted, .pill.practical, .pill.arrived, .pill.completed { color:var(--good); border-color:var(--good); background:transparent; }

.archYear > summary { cursor:pointer; padding:11px 14px; font-weight:700; font-size:15px; list-style:none; display:flex; justify-content:space-between; align-items:center; }

.pill.closed { color:var(--bad); border-color:var(--bad); background:transparent; }
.pill.big { font-size:15px; padding:9px 16px; }
/* the choices */
.choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
.choice { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px; cursor:pointer; min-height:96px; display:flex; flex-direction:column; gap:4px; color:var(--ink); transition:border-color .12s; }
.choice:hover, .choice:focus-visible { border-color:var(--ink); }
.choiceKey { font-size:20px; font-weight:700; letter-spacing:-.2px; }
.choiceSub { font-size:12.5px; color:var(--muted); line-height:1.35; }
.prereq { display:inline-block; margin-top:6px; font-size:11.5px; color:var(--warn); }
.campusSeg button { font-size:14px; }
/* the applicant's dashboard */
.two { display:grid; grid-template-columns:1fr; gap:0; }

/* ==================== YWAM GP Portal ====================
   Two sides of one page. An applicant signs up (or arrives from the public
   website with ?apply=dts), sees their application's status and timeline,
   and keeps their contact details current. Portal staff — only people an
   admin has ticked on Admin → Portal access — see every applicant, move
   them along, assign an owner and keep notes, on the same CRM records HR's
   Candidates page uses. Everything is one portalBoot call per open, same as
   the staff app; the session is kept under its own key ('gp-portal') so a
   staff member can be signed into both.
   See docs/portal-plan.md for the milestones; this is milestone 1. */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
var LANG = (function(){ return lsGet('gp-lang') || 'en'; })();
var KM = (typeof BUILTIN_KM==='object' && BUILTIN_KM) ? BUILTIN_KM : {};
function t(s){ return LANG==='km' ? (KM[s] || s) : s; }
function gpT(s, vars){ var out=t(s); Object.keys(vars||{}).forEach(function(k){ out=out.split('{'+k+'}').join(String(vars[k])); }); return out; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function showMsg(txt){ var m=document.getElementById('msg'); m.textContent=txt; m.classList.add('show'); clearTimeout(m._t); m._t=setTimeout(function(){ m.classList.remove('show'); }, 2600); }
var REQUEST_TIMEOUT_MS = 20000;
function run(fn, args, onOk, onErr){
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null, settled=false;
  var timer = setTimeout(function(){ if(!settled && ctl) ctl.abort(); }, REQUEST_TIMEOUT_MS);
  fetch('/.netlify/functions/api', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ fn:fn, args:args }), signal: ctl ? ctl.signal : undefined })
    .then(function(res){
      if(!res.ok) return res.text().then(function(txt){ var msg='HTTP '+res.status; try { var j=JSON.parse(txt); if(j && j.error) msg+=' — '+j.error; } catch(e2){} throw new Error(msg); });
      return res.json();
    })
    .then(function(d){ settled=true; clearTimeout(timer); onOk(d); })
    .catch(function(e){ settled=true; clearTimeout(timer); if(onErr) onErr(e); else { P.busy=false; showMsg(t('Connection problem — try again.')); render(); } });
}

var CAMPUS_SCHOOLS = { poipet:['dts','dbs'], siemreap:['dts','dbs','bcs','sms'] };
var CAMPUS_LIST = [['siemreap','YWAM Siem Reap','Siem Reap'],['poipet','YWAM Poipet','Poipet']];

/* Which campuses take applications right now. Poipet is set up (schools,
   forms, the staff side all know it) but hidden until the base says go —
   add it here and every picker, chip and deep link comes back. */
var PORTAL_OPEN = ['siemreap'];
function openCampuses_(){ return CAMPUS_LIST.filter(function(c){ return PORTAL_OPEN.indexOf(c[0])>-1; }); }
function isOpenCampus_(id){ return PORTAL_OPEN.indexOf(id)>-1; }
function campusName_(id){ for(var i=0;i<CAMPUS_LIST.length;i++) if(CAMPUS_LIST[i][0]===id) return t(CAMPUS_LIST[i][1]); return id||''; }
function campusShort_(id){ for(var i=0;i<CAMPUS_LIST.length;i++) if(CAMPUS_LIST[i][0]===id) return t(CAMPUS_LIST[i][2]); return id||''; }
var APPLY = [
  { key:'dts', type:'student', school:'dts', label:'DTS', blurb:'Discipleship Training School' },
  { key:'dbs', type:'student', school:'dbs', label:'DBS', blurb:'Discipleship Bible School', secondary:true },
  { key:'bcs', type:'student', school:'bcs', label:'BCS', blurb:'Biblical Counseling School', secondary:true },
  { key:'sms', type:'student', school:'sms', label:'SMS', blurb:'Social Media School', secondary:true },
  { key:'staff', type:'staff', school:'', label:'Staff', blurb:'Join the staff team' },
  { key:'volunteer', type:'volunteer', school:'', label:'Volunteer', blurb:'Serve with us for a season' },
  { key:'team', type:'team', school:'', label:'Team', blurb:'Bring a short-term team' }
];
function applyByKey_(k){ for(var i=0;i<APPLY.length;i++) if(APPLY[i].key===k) return APPLY[i]; return null; }
function offeredAt_(a, campus){ return !a.school || (CAMPUS_SCHOOLS[campus]||[]).indexOf(a.school)>-1; }
function applyLabel_(type, school){

  return type||'—';
}
var STATUS_LABEL = { call1:'1st call', docs:'Awaiting documents', call2:'2nd call — cultural orientation', draft:'Not submitted yet', pending:'Application pending', in_review:'In review — we’ll be in touch', interview:'Interview stage', accepted:'Accepted!', practical:'Getting ready', arrived:'Arrived', completed:'Outreach complete', closed:'Closed' };
var STATUS_NOTE = {
  draft:'Fill out your application when you are ready — it saves as you go.',
  pending:'We have your application. One of our team will message you on {app} soon.',
  in_review:'Our team has reached out. Keep an eye on {app} and send anything we ask for.',
  interview:'We will arrange a video call with you — watch for a message on {app}.',

  arrived:'You are here. Welcome to {campus}!',

};
var STEP_LABEL = { account:'Create your account', form:'Fill out the application', reference:'Send your leader reference', received:'Application received', received2:'Application & reference received', contact:'We get in touch', docs:'Documents', interview:'Video interview', accepted:'Accepted', practical:'Getting ready — fees, packing, visa, travel', arrived:'Arrival at the base' };
var STEP_NOTE = { form:'Your answers save as a draft — come back any time.', reference:'Make a link below and send it to your pastor or a leader who knows you well — you can do this before or after you apply.', received:'Once both are in, we get in touch.', contact:'On WhatsApp or Telegram, whichever you chose.', docs:'What to send depends on what you are applying for.', interview:'A video call with someone from the school or the team.' };
var SUBITEM_LABEL = { documents:'Documents', reference:'Leader reference' };
/* A team's own journey (teamSteps_ in api.js): what each step is called, a
   line on what it means while it is still ahead, and who does it. */
var TEAM_STEP_LABEL = { account:'Create your account', form:'Send your application', call1:'1st call — getting to know each other',
  passports:'Passport copies for the whole team', photo:'Your team’s names and photos', flights:'Flight itineraries',
  invitation:'Letter of invitation & supporting documents', evisa:'E-visas approved', rooms:'Rooms booked', call2:'2nd call — cultural orientation with your team',
  practical:'Getting ready to travel', arrived:'Arrival at the base' };
var TEAM_STEP_NOTE = {
  form:'Your answers save as a draft — come back any time.',
  call1:'A video call to get to know each other and go over the logistics. We message you to find a time.',
  passports:'A copy of the photo page of every team member’s passport. Upload them under Documents.',

  flights:'Important — we need them to start your visa process, and we arrange your airport pick-up from them.',
  invitation:'We send these once your passports, your team’s names and photos, and flights are in. They appear under Documents for you to download.',
  evisa:'Once we upload your letter of invitation, “How to apply for your e-visa online” opens right here, with everything you need. Then upload each approved e-visa under Documents.',
  rooms:'Our hospitality team books your beds for your dates. It ticks here once they have.',
  call2:'A call with your whole team to prepare for Cambodian culture and serving here.',
  practical:'Pack, pray and get ready. Message us with any last questions.'
};
var TEAM_GROUP_LABEL = { docs:'Awaiting documents', visa:'Visa' };
var TEAM_STATUS_NOTE = {
  call1:'We will set up a first video call to get to know each other and go over the logistics — watch for a message on {app}.',
  docs:'Next: passport copies, a team photo and your flight itineraries. Once they are in, the visa steps open.',
  call2:'Your documents and visas are in. Next is a call with your whole team for cultural orientation.',
  practical:'Nearly there — get ready to travel. Add your team’s numbers below as you go.',
  completed:'Thank you for serving with us! Everything from your trip is kept safe with us. If you have not yet, add your final numbers under Metrics.'
};
var STAGE_LABEL = { call1:'1st call', docs:'Awaiting documents', call2:'2nd call — orientation', 'new':'New', contacted:'Contacted', applied:'Applied', interview:'Interview', accepted:'Accepted', practical:'Getting ready', arrived:'Arrived' };
var MESSENGER_LABEL = { whatsapp:'WhatsApp', telegram:'Telegram' };

  var digits=String(phone||'').replace(/\D/g,''); if(!digits) return '';

function fmtDate_(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10); return d.toLocaleDateString(LANG==='km'?'km-KH':'en-GB', { day:'numeric', month:'short', year:'numeric' }); }

/* ---- state ---- */
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && P.menuOpen){ P.menuOpen=false; render(); var b=document.getElementById('navMenu'); if(b) b.focus(); } });
var P = { aview:'status', meet:null, teamEdit:null, menuOpen:false, access:null, accessQ:'', staffPhotos:{}, strengths:null, ptest:null, pview:null, ppickFor:null, resources:null, resDraft:null, authCfg:null, pinLogin:false, gtoken:'', changePw:false, pw:{}, installEvt:null, a2hsOff:!!lsGet('gp-portal-a2hs'), auth:null, boot:null, view:'landing', apply:null, campus:DEFAULT_CAMPUS, reg:{}, busy:false, err:'', sel:null, filter:'', campusFilter:null, what:null, q:'', formSec:0, answers:{}, formMissing:null, draftSaved:'', formKey:null, formDraft:null, formDirty:false, editAnswers:false, staffAnswers:{}, feAud:'all', audFilter:'', editContact:false, note:'', accounts:null, accSel:null, accNew:false, accForm:{}, accQ:'', editMine:false, cal:null, pv:{ mode:'sample', key:'dts', aud:'international', stage:'new', candId:null, q:'', screen:'me', aview:'status', sec:0, boot:null, busy:false }, refToken:'', refData:null, refAnswers:{}, refMissing:null, refDone:false, refLink:null, showRef:false };
(function(){
  var qs={}; try { String(location.search||'').replace(/^\?/,'').split('&').forEach(function(kv){ if(!kv) return; var p=kv.split('='); qs[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||''); }); } catch(e){}
  if(qs.lang==='km' || qs.lang==='en'){ LANG=qs.lang; lsSet('gp-lang', LANG); }
  if(qs.campus && CAMPUS_SCHOOLS[qs.campus] && isOpenCampus_(qs.campus)) P.campus=qs.campus;

    var gp=null; try { gp=JSON.parse(lsGet('gp-staff')||'null'); } catch(e){}
    /* ?staff=1&hr=<staffId>: HR fills out the staff contract with that person on HR's own phone */
    var hrId=qs.hr ? String(qs.hr) : '';
    { P.view='sign'; P.sign={ only:qs.doc ? String(qs.doc) : '', staff:gp, hr:hrId, token:null, openFn:hrId ? 'hrContractOpen' : 'staffSignOpen', openArgs:gp ? [gp.user, gp.pin].concat(hrId ? [hrId] : []) : null, submitFn:hrId ? 'hrContractSign' : 'staffSignSubmit',
      back:hrId ? 'teams.html?view=hr&hr='+encodeURIComponent(hrId) : 'teams.html?view=mycontract', data:gp ? null : { ok:false, err:'nostaff' }, who:null, under18:null, idx:0, form:{}, pads:{}, done:false }; }
  }
  if(qs.sign){ P.view='sign'; P.sign={ token:String(qs.sign), data:null, who:null, under18:null, idx:0, form:{}, pads:{}, done:false }; }
  /* portal.html?contract=<token>: the one-time link HR sends — the staff contract, filled out and signed on the person's own phone, no sign-in */
  if(qs.contract){ var ctk=String(qs.contract).replace(/[^a-f0-9]/g,''); P.view='sign'; P.sign={ only:'', staff:null, hr:'', link:ctk, token:null, openFn:'contractLinkOpen', openArgs:[ctk], submitFn:'contractLinkSign', back:'', data:null, who:null, under18:null, idx:0, form:{}, pads:{}, done:false }; }
  if(qs.open) P.openCand=String(qs.open);   // portal.html?open=<candidateId> — the GP app's Teams Database links here
  /* portal.html?stay=<campus>: a guest or speaker asks for a room — no account (SR Hospitality sends the link) */
  /* portal.html?join=<token>: a student staying with us opens their invite and signs up with Google */
  if(qs.join){ P.view='join'; P.join={ token:String(qs.join).replace(/[^a-f0-9]/g,''), info:null }; run('portalJoinInfo', [P.join.token], function(d){ P.join.info=d||{ ok:false }; render(); }, function(){ P.join.info={ ok:false, err:'net' }; render(); }); }
  if(qs.stay && CAMPUS_SCHOOLS[qs.stay]){ P.view='stay'; P.stay={ campus:String(qs.stay), f:{ category:'guest' }, busy:false, done:false, miss:{} }; }
  var saved=null; try { saved=JSON.parse(lsGet('gp-portal')||'null'); } catch(e){}
  if(saved && saved.user && saved.pin && !P.sign && !P.stay && !P.join){ P.auth=saved; P.view='booting'; boot_(); }
})();
/* Is Google sign-in on? (GP_GOOGLE_CLIENT_ID on the server.) Asked once; the
   sign-in redraws when the answer lands. */
run('portalAuthConfig', [], function(d){ if(d && d.ok){ P.authCfg=d; if(d.google) gsiLoad_(); if(!P.auth && P.view!=='booting' && P.view!=='ref' && P.view!=='sign' && P.view!=='stay') render(); } }, function(){});
/* The portal installs like the staff app: same service worker (network first,
   the last copy when offline), its own manifest. */
(function(){
  if(!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); P.installEvt=e; if(P.view==='me') render(); });
  window.addEventListener('appinstalled', function(){ P.installEvt=null; lsSet('gp-portal-a2hs','1'); P.a2hsOff=true; if(P.view==='me') render(); });
})();
function isStandalone_(){ try { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; } catch(e){ return false; } }
function isIosSafari_(){ var ua=navigator.userAgent||''; return /iPhone|iPad|iPod/.test(ua) && /Safari/.test(ua) && !/CriOS|FxiOS/.test(ua); }
/* "Add to your phone" on the applicant's dashboard: a real install button
   where the browser offers one (Android, desktop Chrome), the Share → Add to
   Home Screen hint on iPhone, nothing once installed or dismissed. */
function installCardHtml_(){
  if(isStandalone_() || P.a2hsOff) return '';
  if(P.installEvt) return '<div class="banner installCard" id="installCard"><b>📲 '+esc(t('Add the portal to your phone'))+'</b><br>'+esc(t('Install it like an app — your application, documents and, once you are here, everything else in one tap.'))+

  if(isIosSafari_()) return '<div class="banner installCard" id="installCard"><b>📲 '+esc(t('Add the portal to your phone'))+'</b><br>'+esc(t('Tap Share, then “Add to Home Screen” — it opens like an app.'))+
    ' <button class="linkbtn inline" id="installLater">'+esc(t('Not now'))+'</button></div>';
  return '';

/* Opened from a link to one record (?open=<id>): once the staff boot is in,
   show that record — on its own tab and campus, nothing filtered away. */

function boot_(){
  run('portalBoot', [P.auth.user, P.auth.pin], function(d){
    if(d && d.ok){ P.boot=d; if(d.role==='applicant') P.answers=(d.application && d.application.answers)||{}; P.view = d.role==='applicant' ? 'me' : 'crm'; openFromLink_(d); lsSet('gp-portal', JSON.stringify(P.auth)); render(); return; }
    if(d && d.err==='auth'){ lsDel('gp-portal'); P.auth=null; P.view='login'; showMsg(t('Your sign-in didn’t work — please sign in again.')); render(); return; }
    if(d && d.err==='not_authorized'){ P.view='noaccess'; render(); return; }
    if(d && d.err==='no_application'){ P.view='noaccess'; P.err='no_application'; render(); return; }
    P.view='login'; P.err='boot'; render();
  }, function(e){ P.view='login'; P.err='boot'; render(); showMsg(t('Connection problem — try again.')); });
}
function signOut_(){ lsDel('gp-portal'); P.auth=null; P.boot=null; P.sel=null; P.view='login'; P.aview='status'; P.meet=null; P.staffPhotos={}; P.strengths=null; P.ptest=null; P.resources=null; P.resDraft=null; render(); }

/* ---- the logo ----
   PORTAL_LOGO is the YWAM mark for the top of the page — drop the file into
   public/ (white on transparent, for the black page) and name it here, e.g.
   'ywam-logo.png'. Left empty, the GP mark from logo.js stands in, and no
   request is made for a file that is not there. */
var PORTAL_LOGO = 'ywam-logo.png';
(function(){
  var img=document.getElementById('brandLogo'); if(!img) return;
  img.onerror=function(){ img.onerror=null; if(typeof GP_LOGO==='string') img.src=GP_LOGO; else img.style.display='none'; };
  if(PORTAL_LOGO) img.src=PORTAL_LOGO; else if(typeof GP_LOGO==='string') img.src=GP_LOGO; else img.style.display='none';
})();
/* ---- render ---- */
function render(){
  var hb=document.getElementById('hbtns');
  hb.innerHTML='<button class="hbtn" id="langBtn">'+(LANG==='km'?'EN':'ខ្មែរ')+'</button>'+

    (P.auth && P.boot ? '<button class="hbtn" id="outBtn">'+esc(t('Sign out'))+'</button>' : '');
  var m=document.getElementById('main');
  var v=P.view;
  /* The gate — everything before you are signed in — is the portal's name
     and logo on top and one card underneath; signed in, the bar goes slim. */
  document.body.classList.toggle('gate', v!=='me' && v!=='crm' && v!=='form' && v!=='forms' && v!=='accounts' && v!=='preview' && v!=='resources' && v!=='team' && v!=='access' && v!=='legal' && v!=='visa');
  var staffView = P.auth && P.boot && P.boot.role!=='applicant' && (v==='crm'||v==='forms'||v==='accounts'||v==='preview'||v==='resources'||v==='team'||v==='access'||v==='legal'||v==='visa');
  var applicantTabs = P.auth && P.boot && P.boot.role==='applicant' && v==='me';
  document.body.classList.toggle('wideStaff', !!(staffView && v==='crm'));   // the list and a record side by side want the room
  try { m.innerHTML = (staffView ? staffNavHtml_(v) : applicantTabs ? applicantNavHtml_() : '') + (v==='booting' ? '<p class="sub" style="text-align:center;padding:40px 0">'+esc(t('Loading…'))+'</p>'
    : v==='register' ? registerHtml_() : v==='choose' ? chooseHtml_() : v==='me' ? meTabHtml_() : v==='crm' ? crmHtml_() : v==='form' ? formHtml_() : v==='forms' ? formsHtml_() : v==='resources' ? resourcesAdminHtml_() : v==='team' ? teamAdminHtml_() : v==='access' ? accessHtml_() : v==='accounts' ? accountsHtml_() : v==='preview' ? previewHtml_()
    : v==='noaccess' ? noAccessHtml_() : v==='ref' ? refHtml_() : v==='stay' ? stayHtml_() : v==='join' ? joinHtml_() : v==='sign' ? signHtml_() : v==='legal' ? legalAdminHtml_() : v==='visa' ? visaAdminHtml_() : loginHtml_())
    + (P.guideOpen && P.boot && typeof outreachGuideHtml==='function' ? guideOverlayHtml_() : '')
    + (staffView && P.docGallery ? docGalleryHtml_() : '');
  document.body.classList.toggle('guideOn', !!(P.guideOpen && P.boot));
  document.body.classList.toggle('menuOn', !!P.menuOpen);
  bind_();
  } catch (e) {
    /* A dead screen where nothing responds is the worst outcome — show what
       broke and a way out, and keep the error in the console for the report. */
    console.error(e);
    m.innerHTML='<div class="center"><div class="card"><h2>'+esc(t('Something went wrong on this screen'))+'</h2><p class="sub">'+esc(String(e && e.message || e))+'</p>'+
      '<button class="btn small" id="errBack">'+esc(t('Back'))+'</button> <button class="linkbtn inline" id="errOut">'+esc(t('Sign out'))+'</button></div></div>';
    on_('errBack', function(){ P.view = (P.boot && P.boot.role==='applicant') ? 'me' : (P.boot ? 'crm' : 'login'); P.sel=null; P.formDraft=null; P.accSel=null; P.accNew=false; render(); });
    on_('errOut', signOut_);
  }
}
/* The staff side's tools, as a bar under the header rather than buttons in
   it — a phone's header has room for the name, the language and Sign out,
   not four more. Forms and Accounts are portal-admin only. */
function staffNavHtml_(v){
  var admin=P.boot.role==='portal-admin';
  /* The bar keeps the two everyone uses — home and Applications — and a ☰ menu
     for the rest, in two groups: what staff access has, what admin access adds. */
  var staffItems=[['preview','toPreview','👁 '+t('View as applicant')],['link','toLink','🔗 '+t('Link for applicants')]];
  var adminItems=[['forms','toForms','📝 '+t('Forms')],['accounts','toAccounts','👤 '+t('Accounts')],['team','toTeam','👥 '+t('Our team')],['resources','toResources','📚 '+t('Resources')],['legal','toLegal','✍️ '+t('Legal documents')],['visa','toVisaInfo','🛂 '+t('E-visa info')],['access','toAccess','🔑 '+t('Who has access')]];
  var crmItem=['crm','navCrm','📋 '+t('Applications')];
  var here=[crmItem].concat(staffItems, admin ? adminItems : []).filter(function(x){ return x[0]===v; })[0];
  var item=function(x){ return '<button class="menuItem'+(v===x[0] || (x[0]==='link' && P.linkOpen)?' on':'')+'" id="'+x[1]+'">'+esc(x[2])+'</button>'; };
  /* Uriah, Oct 2026: the way back to the GP app is a small line of text on
     its own (no more tapping it by mistake), the bar is one ☰ button that says
     where you are, and Applications sits first in the menu. */
  return '<a class="gpHomeLink" id="toGpApp" href="teams.html">← '+esc(t('Go back to GP Home'))+'</a>'+
    '<nav class="staffNav" id="staffNav"><button class="staffNavBtn menuBtn'+(P.menuOpen ? ' on':'')+'" id="navMenu" aria-expanded="'+(P.menuOpen?'true':'false')+'" aria-controls="staffMenu">'+
    '<span class="menuIc" aria-hidden="true">☰</span><span class="menuHere">'+esc(here ? here[2] : t('Menu'))+'</span><span class="menuHint">'+esc(t('Menu'))+' ▾</span></button></nav>'+
    /* the menu slides in from the side, over the page; tap outside, ✕ or Esc closes it */
    (P.menuOpen ? '<div class="menuScrim" id="menuScrim"></div><aside class="staffMenu" id="staffMenu" role="dialog" aria-modal="true" aria-label="'+esc(t('Menu'))+'">'+
      '<div class="menuHead"><b>'+esc(t('Menu'))+'</b><button type="button" class="hbtn" id="menuClose" aria-label="'+esc(t('Close'))+'">✕</button></div>'+
      '<div class="menuGroup">'+item(crmItem)+'</div>'+
      '<div class="menuGroup"><div class="eyebrow">'+esc(t('Staff access'))+'</div>'+staffItems.map(item).join('')+'</div>'+
      (admin ? '<div class="menuGroup"><div class="eyebrow">'+esc(t('Admin access'))+'</div>'+adminItems.map(item).join('')+'</div>' : '')+
      '<a class="menuItem menuHome" href="teams.html">🏠 '+esc(t('GP app home'))+'</a></aside>' : '')+
    (P.linkOpen ? applyLinkHtml_() : '');
}
/* The link staff send to someone who should apply: the portal itself, or —
   picked from the chips — the portal opened straight on one kind of
   application (portal.html?apply=<key>, which opens sign-up for it). A
   scoped staff member (Outreach Teams) gets the kinds they work. */
function applyLinkUrl_(key){ return location.origin + location.pathname + (key ? '?apply='+encodeURIComponent(key) : ''); }
function applyLinkHtml_(){
  var scope=Array.isArray(P.boot.scope) ? P.boot.scope : null;
  var kinds=APPLY.filter(function(a){ return (!scope || scope.indexOf(a.type)>-1) && openCampuses_().some(function(c){ return offeredAt_(a, c[0]); }); });
  var key=P.linkKind||'';
  if(key && !kinds.some(function(a){ return a.key===key; })) key='';
  return '<div class="card linkCard" id="applyLinkCard"><div class="panelHead"><b>🔗 '+esc(t('Send someone the portal'))+'</b><button class="hbtn" id="closeLink" aria-label="'+esc(t('Close'))+'">✕</button></div>'+
    '<p class="sub" style="margin:4px 0 8px">'+esc(t('Copy the link and send it on WhatsApp, Telegram or email. Pick a kind to open the portal straight on that application.'))+'</p>'+
    '<div class="chips" style="margin-bottom:8px">'+[{ key:'', label:t('Any application') }].concat(kinds.map(function(a){ return { key:a.key, label:a.key==='team' ? t('Teams') : t(a.label) }; })).map(function(a){
      return '<button class="chip'+(key===a.key?' on':'')+'" data-linkkind="'+esc(a.key)+'">'+esc(a.label)+'</button>'; }).join('')+'</div>'+
    '<div class="linkRow"><input type="text" id="applyLinkBox" readonly value="'+esc(applyLinkUrl_(key))+'" onclick="this.select()">'+
    '<button class="btn small" id="copyApplyLink">'+esc(t('Copy link'))+'</button></div></div>';
}
function langRowHtml_(){
  return '<div class="langRow"><button id="langBtn2">'+(LANG==='km' ? 'English' : 'ភាសាខ្មែរ')+'</button></div>';
}
function campusSegHtml_(attr, current){
  var open=openCampuses_(); if(open.length<2) return '';
  return '<div class="seg campusSeg">'+open.map(function(c){ return '<button '+attr+'="'+c[0]+'" class="'+(current===c[0]?'on':'')+'">'+esc(t(c[1]))+'</button>'; }).join('')+'</div>';
}
function chooseHtml_(){
  var here=P.campus||DEFAULT_CAMPUS;
  return '<div class="wide"><div class="gateTitle"><h2>'+esc(t('I want to apply'))+'</h2><p class="sub">'+esc(t('Pick where, then what you are applying for. You will create a small account so you can come back to it on your phone.'))+'</p></div>'+
    (openCampuses_().length>1 ? '<div class="center" style="margin-bottom:14px"><label class="f" style="text-align:center">'+esc(t('Where'))+'</label>'+campusSegHtml_('data-campus', here)+'</div>' : '')+
    '<div class="choices">'+APPLY.filter(function(a){ return offeredAt_(a, here); }).map(function(a){ return '<button class="choice" data-apply="'+a.key+'"><span class="choiceKey">'+esc(a.label)+'</span><span class="choiceSub">'+esc(t(a.blurb))+(a.secondary?'<br><span class="prereq">'+esc(t('Requires a completed DTS'))+'</span>':'')+'</span></button>'; }).join('')+'</div>'+
    '<button class="linkbtn" id="toLogin">'+esc(t('I already have an account'))+'</button>'+langRowHtml_()+'</div>';
}
/* ==================== the leader reference (no account) ====================
   A pastor or leader opens portal.html?ref=<token>. The server answers with
   the applicant's name and the reference form, or why the link no longer
   works; the whole form is one page with Submit at the bottom. */
/* ==================== legal documents, signed on a phone ====================
   portal.html?sign=<token>: no account. Pick your name from the team, say if
   you are under 18 (a parent or guardian then signs the forms that ask for
   it), then each document in turn: read it, tick the boxes, fill in the
   lines, initial where the paper form has initials, and sign in the box with
   a finger. Signed ones are skipped; at the end, the next person picks their
   name. The server keeps what was signed and makes the PDF for staff. */
/* on the applicant's dashboard once they are getting ready to come: sign here, signed in */
function legalCardHtml_(app){
  if(!app || !app.submittedAt || app.status==='closed' || ['practical','arrived'].indexOf(app.stage)===-1) return '';
  var team=app.type==='team';
  return '<div class="card" id="legalCard"><h3 style="margin-top:0">✍️ '+esc(t('Legal documents'))+'</h3><p class="sub" style="margin:0 0 8px">'+
    esc(team ? t('Everyone on your team signs YWAM Siem Reap’s forms on their phone — YWAM sends your team the link. You can sign yours here.') : t('Before you start, read and sign YWAM Siem Reap’s forms here on your phone.'))+'</p>'+
    '<button class="btn small" id="openSign">'+esc(t('Read and sign'))+'</button></div>';
}
function signDocDone_(d, key){ var p=(d.people||[]).filter(function(x){ return x.key===key; })[0]; return p ? p.done||{} : {}; }
function signNeedsAge_(d){ return (d.docs||[]).some(function(x){ return x.sign && (x.sign.guardian || x.sign.age); }); }
function sigPadHtml_(id, label, small){
  return '<div class="sigWrap'+(small?' small':'')+'"><div class="sigLabel">'+esc(label)+'</div><canvas class="sigPad" data-sigpad="'+esc(id)+'" aria-label="'+esc(label)+'"></canvas>'+
    '<div class="sigFoot"><span class="hint">✍️ '+esc(small ? t('Initial with your finger') : t('Sign with your finger'))+'</span><button type="button" class="linkbtn inline" data-sigclear="'+esc(id)+'">'+esc(t('Clear'))+'</button></div></div>';
}
function signHtml_(){
  var S=P.sign, d=S.data;
  var h='<div class="center signPage"><div class="gateTitle"><h2>✍️ '+esc(S.hr || S.link ? t('Staff contract') : t('Legal documents'))+'</h2>';
  if(d===null) return h+'</div><div class="card"><p class="sub" style="margin:0">'+esc(t('Loading…'))+'</p></div></div>';
  if(!d.ok) return h+'</div><div class="card"><p class="sub" style="margin:0">'+esc(d.err==='nostaff' || (S.staff && d.err==='invalid') ? t('Open this from the GP app, signed in.') : d.err==='closed' ? t('This team’s documents are closed.') : d.err==='used' ? t('This link has already been used — the contract is signed. Ask HR if you need anything changed.') : t('This link doesn’t work any more — ask YWAM Siem Reap for a new one.'))+'</p>'+(S.openFn ? '<a class="btn small" href="teams.html" style="margin-top:10px">'+esc(t('Open the GP app'))+'</a>' : '')+'</div>'+langRowHtml_()+'</div>';
  var docs=(d.docs||[]).filter(function(x){ return !S.only || x.id===S.only; });
  if(!S.who && (d.people||[]).length===1) S.who=d.people[0].key;
  /* once it's all signed, the "All signed" card has the one way back — not a second link up here */
  var finished=!!S.who && (S.done || !docs.filter(function(x){ return !signDocDone_(d, S.who)[x.id]; }).length);
  h+='<p class="sub">'+esc(d.isTeam===false ? gpT('For {team}. Read each one and sign it here on your phone.',{team:d.team}) : gpT('For {team}. Everyone signs their own — pick your name to start.',{team:d.team}))+'</p>'+(S.inApp ? '<button type="button" class="linkbtn inline" id="signHome">← '+esc(t('Back to my application'))+'</button>' : '')+(S.staff && !finished ? '<a class="linkbtn inline" href="'+esc(S.back)+'">← '+esc(S.hr ? t('Back to HR') : t('Back to My contract'))+'</a>' : '')+'</div>';
  /* who are you */
  if(!S.who){
    h+='<div class="card"><h3 style="margin-top:0">'+esc(t('Who are you?'))+'</h3><div class="signWho">'+(d.people||[]).map(function(p){
      var n=docs.filter(function(x){ return p.done && p.done[x.id]; }).length, all=n===docs.length;
      return '<button type="button" class="signWhoBtn'+(all?' done':'')+'" data-signwho="'+esc(p.key)+'"><b>'+esc(p.name)+'</b><span class="hint">'+esc(all ? '✓ '+t('All signed') : gpT('{n} of {total} signed',{n:n, total:docs.length}))+'</span></button>'; }).join('')+'</div>'+
      '<p class="hint" style="margin:10px 0 0">'+esc(t('Not on the list? Ask your team leader to add you under Your team members.'))+'</p></div>';
    return h+langRowHtml_()+'</div>';
  }
  var me=(d.people||[]).filter(function(p){ return p.key===S.who; })[0]||{};
  if(signNeedsAge_(d) && S.under18===null){
    h+='<div class="card"><h3 style="margin-top:0">'+esc(gpT('Hi {name}!',{name:me.name}))+'</h3><p class="sub">'+esc(t('Are you under 18? If so, a parent or guardian signs two of the forms with you.'))+'</p>'+
      '<div class="seg"><button type="button" data-signu18="no">'+esc(t('18 or older'))+'</button><button type="button" data-signu18="yes">'+esc(t('Under 18'))+'</button></div>'+
      ((d.people||[]).length>1 ? '<button type="button" class="linkbtn" id="signBack" style="margin-top:12px">← '+esc(t('Not me'))+'</button>' : '')+'</div>';
    return h+'</div>';
  }
  var done=signDocDone_(d, S.who), left=docs.filter(function(x){ return !done[x.id]; });
  d.shown=docs;
  if(!left.length || S.done){
    h+='<div class="card signDone"><div class="signBig">🎉</div><h3 style="margin:4px 0">'+esc(gpT('All signed — thank you, {name}!',{name:(me.name||'').split(' ')[0]}))+'</h3><p class="sub">'+esc(S.link ? t('YWAM Siem Reap has your signed contract. HR will add their approval and it becomes your contract — you can close this page.') : t('YWAM Siem Reap has your signed forms. Nothing more to do.'))+'</p>'+
      (S.staff ? '<a class="btn" href="'+esc(S.back)+'">'+esc(S.hr ? t('Back to HR') : t('Back to My contract'))+'</a>' : '')+
      ((d.people||[]).length>1 ? '<button type="button" class="btn" id="signNext">'+esc(t('Someone else on the team? Pick your name'))+'</button>' : '')+(S.inApp ? '<button type="button" class="btn ghost" id="signHome" style="margin-left:6px">'+esc(t('Back to my application'))+'</button>' : '')+'</div>';
    return h+'</div>';
  }
  var doc=left[0], k=docs.indexOf(doc), sign=doc.sign||{}, F=S.form, nm=F.name!=null ? F.name : me.name;
  if(doc.approveOnly){   // signed through their link already: only HR's approval is left
    h+='<div class="card signDoc" data-signdoc="'+esc(doc.id)+'" data-approveonly="1">'+legalHeadHtml_(doc.title)+
      '<div class="signPeriod"><div class="kv"><b>'+esc(t('Volunteer name'))+'</b><span>'+esc(doc.staffName||me.name||'')+'</span></div><div class="kv"><b>'+esc(t('Period of contract'))+'</b><span>'+esc(lkPeriod_(doc.period))+'</span></div></div>'+
      '<p class="sub">✓ '+esc(gpT('{name} read, filled in and signed it on {date} through the link you sent.',{name:doc.staffName||me.name, date:fmtDate_(doc.staffSignedAt||new Date().toISOString())}))+'</p>'+
      '<div class="signHere"><div class="signGuard signLeader"><div class="eyebrow">'+esc(t('Approved by'))+'</div>'+
      '<label class="f">'+esc(t('Your full name'))+'</label><input type="text" id="sign_lname" maxlength="120" value="'+esc(F.leaderName!=null ? F.leaderName : (d.approver||''))+'"'+(S.miss && S.miss.leaderName?' class="miss"':'')+'>'+sigPadHtml_('leaderSig', t('Your signature'))+'</div></div>'+
      '<button type="button" class="btn" id="signSubmit"'+(S.busy?' disabled':'')+' style="margin-top:14px;width:100%">'+esc(S.busy ? t('Saving…') : t('Sign to approve'))+'</button></div>';
    return h+'</div>';
  }
  h+='<div class="signProg">'+docs.map(function(x, i){ return '<span class="signDot'+(done[x.id]?' done':(x===doc?' on':''))+'" title="'+esc(lk_(x.title))+'">'+(done[x.id]?'✓':(i+1))+'</span>'; }).join('')+'</div>';
  h+='<div class="card signDoc" data-signdoc="'+esc(doc.id)+'"><div class="eyebrow">'+esc(gpT('Document {n} of {total}',{n:k+1, total:docs.length}))+'</div>'+legalHeadHtml_(doc.title);
  (doc.blocks||[]).forEach(function(b){
    if(b.t==='period') h+='<div class="signPeriod"><div class="kv"><b>'+esc(t('Volunteer name'))+'</b><span>'+esc(nm||'')+'</span></div><div class="kv"><b>'+esc(t('Period of contract'))+'</b><span>'+esc(lkPeriod_(doc.period))+'</span></div></div>';
    else if(b.t==='h') h+=legalHHtml_(b.text);
    else if(b.t==='list') h+=legalListHtml_(b.items);
    else if(b.t==='choice') h+='<div class="signChoice'+(S.miss && S.miss[b.id]?' miss':'')+'" data-signchoicebox="'+esc(b.id)+'">'+(b.options||[]).map(function(o){ return '<label class="signCheck"><input type="radio" name="sc_'+esc(b.id)+'" data-signchoice="'+esc(b.id)+'" value="'+esc(o.id)+'"'+(F.choices && F.choices[b.id]===o.id?' checked':'')+'><span>'+esc(lk_(o.text))+'</span></label>'; }).join('')+'</div>';
    else if(b.t==='contacts') h+='<div class="signContacts">'+(d.contacts||[]).map(function(c){ return '<div class="kv"><b>'+esc(c.role)+'</b><span>'+esc([c.name, c.phone].filter(Boolean).join(' · ') || t('Your leader will tell you on arrival.'))+'</span></div>'; }).join('')+'</div>';
    else if(b.t==='p') h+='<p class="signP'+(b.style?' '+esc(b.style):'')+'">'+esc(String(lk_(b.text)||'').split('{name}').join(nm||'________'))+'</p>';
    else if(b.t==='check') h+='<label class="signCheck'+(S.miss && S.miss[b.id]?' miss':'')+'"><input type="checkbox" data-signcheck="'+esc(b.id)+'"'+(F.checks && F.checks[b.id]?' checked':'')+'><span>'+esc(String(lk_(b.text)||'').split('{name}').join(nm||'________'))+'</span></label>';
    else if(b.t==='group') h+='<div class="signGroup'+(S.miss && S.miss[b.id]?' miss':'')+'"><label class="signCheck"><input type="checkbox" data-signcheck="'+esc(b.id)+'"'+(F.checks && F.checks[b.id]?' checked':'')+'><b>'+esc(lk_(b.title))+'</b></label><ul>'+(b.items||[]).map(function(it){ return '<li>'+esc(lk_(it))+'</li>'; }).join('')+'</ul></div>';
    else if(b.t==='field'){ var fv=F.fields && F.fields[b.id]!=null ? F.fields[b.id] : ((b.prefill && d.prefill && d.prefill[b.prefill])||''); h+='<label class="f">'+esc(lk_(b.label))+(b.optional?' <span class="hint">('+esc(t('optional'))+')</span>':'')+'</label><input type="text" data-signfield="'+esc(b.id)+'" maxlength="120" value="'+esc(fv)+'"'+(S.miss && S.miss[b.id]?' class="miss"':'')+'>'; }
    else if(b.t==='initial') h+=sigPadHtml_('init:'+b.id, lk_(b.label), true);
  });
  h+='<div class="signHere"><div class="eyebrow">'+esc(t('Sign here'))+'</div>'+
    '<label class="f">'+esc(t('Full name'))+'</label><input type="text" id="sign_name" maxlength="120" value="'+esc(nm||'')+'">'+
    (sign.age ? '<label class="f">'+esc(t('Age'))+'</label><input type="number" id="sign_age" min="1" max="120" inputmode="numeric" value="'+esc(F.age||'')+'" style="max-width:120px">' : '')+

function bindSigPads_(){
  var S=P.sign;
  document.querySelectorAll('[data-sigpad]').forEach(function(cv){
    var id=cv.getAttribute('data-sigpad'), small=!!cv.closest('.sigWrap.small'), dpr=window.devicePixelRatio||1;
    var w=cv.clientWidth||300, hgt=small?90:150;
    cv.width=Math.round(w*dpr); cv.height=Math.round(hgt*dpr); cv.style.height=hgt+'px';
    var ctx=cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=2.4; ctx.strokeStyle='#111';
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,hgt);
    var saved=S.pads[id];
    if(saved){ var im=new Image(); im.onload=function(){ ctx.drawImage(im, 0, 0, w, hgt); }; im.src='data:image/jpeg;base64,'+saved; }
    var drawing=false, last=null, inked=0;
    var pt=function(e){ var r=cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };
    cv.onpointerdown=function(e){ drawing=true; last=pt(e); try{ cv.setPointerCapture(e.pointerId); }catch(x){} e.preventDefault(); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI*2); ctx.fillStyle='#111'; ctx.fill(); };
    cv.onpointermove=function(e){ if(!drawing) return; var p=pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); inked+=Math.abs(p.x-last.x)+Math.abs(p.y-last.y); last=p; e.preventDefault(); };
    var end=function(){ if(!drawing) return; drawing=false;
      if(inked<12 && !saved) return;   // a tap is not a signature
      var out=document.createElement('canvas'); out.width=small?240:600; out.height=small?90:200;
      var o=out.getContext('2d'); o.fillStyle='#fff'; o.fillRect(0,0,out.width,out.height); o.drawImage(cv, 0, 0, out.width, out.height);
      S.pads[id]=out.toDataURL('image/jpeg', 0.7).split(',')[1]; saved=S.pads[id];
      var wrap=cv.closest('.sigWrap'); if(wrap) wrap.classList.add('signed'), wrap.classList.remove('miss');
    };
    cv.onpointerup=end; cv.onpointercancel=end; cv.onpointerleave=end;
    if(saved){ var wrap=cv.closest('.sigWrap'); if(wrap) wrap.classList.add('signed'); }
    if(S.miss && S.miss[id]){ var wr=cv.closest('.sigWrap'); if(wr) wr.classList.add('miss'); }
  });
  document.querySelectorAll('[data-sigclear]').forEach(function(b){ b.onclick=function(){ delete S.pads[b.getAttribute('data-sigclear')]; keepSignForm_(); render(); }; });
}

function bindSign_(){

    S.loading=true;
    run(S.openFn||'portalSignOpen', S.openArgs||[S.token], function(d){ S.loading=false; S.data=d||{ ok:false }; render(); }, function(){ S.loading=false; S.data={ ok:false, err:'network' }; render(); showMsg(t('Connection problem — try again.')); });
    return;
  }
  document.querySelectorAll('[data-signwho]').forEach(function(b){ b.onclick=function(){ S.who=b.getAttribute('data-signwho'); S.under18=null; S.form={}; S.pads={}; S.done=false; S.miss=null; render(); window.scrollTo(0,0); }; });

    keepSignForm_();
    var d=S.data, done=signDocDone_(d, S.who), doc=(d.shown||d.docs||[]).filter(function(x){ return !done[x.id]; })[0]; if(!doc) return;
    var F=S.form, sign=doc.sign||{}, miss={}, n=0;
    if(doc.approveOnly){   // HR: name and signature, nothing else
      if(F.leaderName==null && d.approver) F.leaderName=d.approver;
      if(!String(F.leaderName||'').trim()) miss.leaderName=1; if(!S.pads.leaderSig) miss.leaderSig=1;
      if(miss.leaderName || miss.leaderSig){ S.miss=miss; render(); showMsg(t('You need to add your name and sign to approve it.')); return; }
      S.busy=true; render();
      run(S.submitFn||'portalSignSubmit', (S.openArgs||[S.token]).concat([S.who, doc.id, { leaderName:String(F.leaderName).trim(), leaderSig:S.pads.leaderSig, approveOnly:true }]), function(r){
        S.busy=false;
        if(r && r.ok){ (d.people||[]).forEach(function(p){ if(p.key===S.who) p.done=r.done; }); S.miss=null; S.pads={}; if(typeof portalConfetti_==='function') portalConfetti_(); showMsg(t('Approved')); render(); window.scrollTo(0,0); return; }
        showMsg(r && r.err==='leader_required' ? t('You need to add your name and sign to approve it.') : t('Could not save — try again.')); render();
      }, function(){ S.busy=false; showMsg(t('Connection problem — try again.')); render(); });
      return;
    }
    (doc.blocks||[]).forEach(function(b){
      if((b.t==='check'||b.t==='group') && !(F.checks && F.checks[b.id])){ miss[b.id]=1; n++; }
      if(b.t==='field' && !b.optional && !String((F.fields||{})[b.id]||'').trim()){ miss[b.id]=1; n++; }
      if(b.t==='choice' && !(F.choices && F.choices[b.id])){ miss[b.id]=1; n++; }

    });
    if(!String(F.name||'').trim()){ miss.name=1; n++; }
    if(sign.age && !(Number(F.age)>0)){ miss.age=1; n++; }
    if(!S.pads.sig){ miss.sig=1; n++; }
    if(sign.leader && F.leaderName==null && d.approver) F.leaderName=d.approver;
    if(sign.leader && (!String(F.leaderName||'').trim() || !S.pads.leaderSig)){ if(!String(F.leaderName||'').trim()) miss.leaderName=1; if(!S.pads.leaderSig) miss.leaderSig=1; n++; }

    if(n){ S.miss=miss; render(); showMsg(n===1 ? t('One thing still to do — it is marked in red.') : gpT('{n} things still to do — they are marked in red.',{n:n})); var first=document.querySelector('.miss'); if(first) first.scrollIntoView({ behavior:'smooth', block:'center' }); return; }

    (doc.blocks||[]).forEach(function(b){ if(b.t==='initial') pay.initials[b.id]=S.pads['init:'+b.id]; });
    if(sign.age) pay.age=Number(F.age);

    if(sign.witness && (String(F.witnessName||'').trim() || S.pads.witnessSig)){ pay.witnessName=String(F.witnessName||'').trim(); pay.witnessSig=S.pads.witnessSig||''; }
    S.busy=true; render();
    run(S.submitFn||'portalSignSubmit', (S.openArgs||[S.token]).concat([S.who, doc.id, pay]), function(r){
      S.busy=false;
      if(r && r.ok){
        (d.people||[]).forEach(function(p){ if(p.key===S.who) p.done=r.done; });
        S.miss=null; S.pads={}; S.form={ name:F.name, age:F.age, guardianName:F.guardianName };
        if(typeof portalConfetti_==='function' && !(d.docs||[]).some(function(x){ return !r.done[x.id]; })) portalConfetti_();
        showMsg(t('Signed')); render(); window.scrollTo(0,0); return;
      }
      var e=r && r.err;
      showMsg(e==='leader_required' ? t('You need to add your name and sign to approve it.') : e==='witness_incomplete' ? t('A witness needs their name and signature — or leave the witness out.') : e==='guardian_required' ? t('A parent or guardian needs to add their name and sign.') : e==='invalid' ? t('This link doesn’t work any more — ask YWAM Siem Reap for a new one.') : t('Could not save — try again.'));
      render();
    }, function(){ S.busy=false; showMsg(t('Connection problem — try again.')); render(); });
  });
}

function gsiLoad_(after){
  if(!(P.authCfg && P.authCfg.google)) return;
  if(_gsi.ready){ if(after) after(); return; }
  _gsi.after = after || _gsi.after;
  if(_gsi.loading) return;
  _gsi.loading=true;
  var sc=document.createElement('script'); sc.src='https://accounts.google.com/gsi/client'; sc.async=true; sc.defer=true;
  sc.onload=function(){
    try {
      _gsi.client=google.accounts.oauth2.initTokenClient({ client_id:P.authCfg.google, scope:'openid email profile', callback:onGoogleCred_,
        error_callback:function(){ P.gBusy=false; render(); } });
      _gsi.ready=true; _gsi.loading=false;
      if(_gsi.after){ var f=_gsi.after; _gsi.after=null; f(); }
    } catch(e){ _gsi.loading=false; gsiFail_(); }
  };
  sc.onerror=function(){ _gsi.loading=false; gsiFail_(); };
  document.head.appendChild(sc);
}
function gsiFail_(){ P.gBusy=false; render(); showMsg(t('Google sign-in could not load — use your email, or try again later.')); }
function gsiRender_(){}
function googleGo_(){
  if(P.gBusy) return;
  P.gBusy=true; render();
  gsiLoad_(function(){ try { _gsi.client.requestAccessToken({ prompt:'select_account' }); } catch(e){ gsiFail_(); } });
  /* if Google's script never answers, let go of the button */
  setTimeout(function(){ if(P.gBusy && !_gsi.ready){ P.gBusy=false; render(); } }, 12000);
}
function onGoogleCred_(resp){
  var tok=resp && (resp.access_token || resp.credential); P.gBusy=false; if(!tok){ render(); return; }
  P.busy=true; render();
  if(P.view==='join'){ joinWithGoogle_(tok); return; }
  run('portalLoginGoogle', [tok], function(d){
    P.busy=false;
    if(d && d.ok){ P.auth={ user:d.user, pin:d.token }; lsSet('gp-portal', JSON.stringify(P.auth)); P.boot=d; P.answers=(d.application && d.application.answers)||{}; P.gtoken=''; P.view='me'; render(); return; }
    if(d && d.err==='new'){
      /* No account for that Google email yet: on to sign-up, name and email filled in, no password to make. */
      P.gtoken=tok; P.reg.email=d.email||''; if(d.name && !P.reg.name) P.reg.name=d.name;
      P.view = P.apply ? 'register' : 'choose'; showMsg(t('Welcome! Tell us what you are applying for.')); render(); return;
    }

    render();
  });
}

function uploadVisaDocs_(files){
  var campus=visaAdminCampus_(), i=0;
  var finish=function(){ P.viUp=''; render(); };
  var one=function(){
    if(i>=files.length){ finish(); showMsg(t('Uploaded')); return; }
    var f=files[i];
    if(f.size>VISA_FILE_MAX){ showMsg(gpT('{name} is over 15 MB',{name:f.name})); i++; one(); return; }
    var r=new FileReader();
    r.onerror=function(){ i++; one(); };
    r.onload=function(){
      var m=/^data:([^;]+);base64,(.*)$/.exec(String(r.result||'')); if(!m){ i++; one(); return; }
      var mime=m[1], b64=m[2], parts=[];
      for(var k=0;k<b64.length;k+=VISA_PART_CHARS) parts.push(b64.slice(k, k+VISA_PART_CHARS));
      var id='';
      var send=function(n){
        P.viUp=gpT('Uploading {name} ({n} of {total})…',{name:f.name, n:n+1, total:parts.length}); render();
        run('portalVisaDocPart', [P.auth.user, P.auth.pin, campus, id, f.name, mime, n, parts.length, parts[n]], function(res){
          if(!(res && res.ok)){ showMsg(res && res.err==='bad_type' ? t('Only PDF or pictures') : res && res.err==='too_many' ? t('That is the most documents there can be') : t('Could not upload it')); finish(); return; }
          id=res.id;
          if(!res.done){ send(n+1); return; }
          P.visaInfo=P.visaInfo||{}; P.visaInfo[campus]=res; i++; one();
        }, function(){ showMsg(t('Could not upload it')); finish(); });
      };
      send(0);
    };
    r.readAsDataURL(f);
  };
  one();
}

function teamOrder_(a,b){

  var grp=function(c){ var tr=teamTrip_(c); if(!tr || !tr.start) return [2, '']; if(tr.end && tr.end<today) return [3, tr.start]; if(tr.start<=today) return [0, tr.start]; return [1, tr.start]; };
  var ga=grp(a), gb=grp(b);

function readAnswers_(root){
  root=root||document;
  root.querySelectorAll('[data-ans]').forEach(function(el){
    var id=el.getAttribute('data-ans');
    if(el.type==='radio'){ if(el.checked) P.answers[id]=el.value; return; }
    if(el.type==='checkbox'){ var arr=Array.isArray(P.answers[id])?P.answers[id].slice():[]; var i=arr.indexOf(el.value); if(el.checked && i===-1) arr.push(el.value); if(!el.checked && i>-1) arr.splice(i,1); P.answers[id]=arr; return; }
    P.answers[id]=el.value;
  });
}
var draftTimer_=null;
function saveDraft_(now){
  if(!P.boot || P.boot.role!=='applicant' || P.boot.application.submittedAt) return;
  clearTimeout(draftTimer_);
  var go=function(){ run('portalSaveDraft', [P.auth.user, P.auth.pin, P.answers], function(d){ if(d && d.ok){ P.draftSaved=fmtTime_(d.savedAt); var el=document.querySelector('.formNav + .hint'); if(el) el.firstChild.textContent=gpT('Draft saved {when}',{when:P.draftSaved})+' · '; } }, function(){}); };
  if(now) go(); else draftTimer_=setTimeout(go, 800);
}
function fmtTime_(iso){ var d=new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString(LANG==='km'?'km-KH':'en-GB', { hour:'2-digit', minute:'2-digit' }); }
function sectionMissing_(sec, aud){ return askedIn_(sec, aud).filter(function(q){ return q.required && !answered_(q, P.answers[q.id]); }).map(function(q){ return q.id; }); }
function bindForm_(){
  if(P.view!=='form') return;
  var app=P.boot.application, form=P.boot.form;
  if(!form){ on_('formClose2', function(){ P.view='me'; render(); }); return; }
  var secs=(form.sections||[]).filter(function(s){ return askedIn_(s, app.audience).length; });
  document.querySelectorAll('[data-ans]').forEach(function(el){ el.oninput=el.onchange=function(){ readAnswers_(); P.formMissing=null; saveDraft_(false); if(el.hasAttribute('data-attachq')){ var y=window.scrollY; render(); window.scrollTo(0, y); } }; });
  var close=function(){ readAnswers_(); saveDraft_(true); if(app.submittedAt){ P.answers=JSON.parse(JSON.stringify(app.answers||{})); P.editMine=false; } P.view='me'; render(); };
  on_('formClose', close); on_('formClose2', close);
  on_('formBack', function(){ readAnswers_(); saveDraft_(true); P.formSec--; P.formMissing=null; render(); window.scrollTo(0,0); });
  on_('formNext', function(){
    readAnswers_();
    var miss=sectionMissing_(secs[P.formSec], app.audience);
    if(miss.length){ P.formMissing=miss; render(); showMsg(t('Please answer the questions marked *')); var first=document.querySelector('.qBlock.missing'); if(first) first.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    saveDraft_(true); P.formSec++; if(secs[P.formSec]) showMsg((SECTION_ICON[secs[P.formSec].id]||'👉')+' '+gpT('Nice — next: {step}',{step:lt_(secs[P.formSec].title)})); P.formMissing=null; render(); window.scrollTo(0,0);
  });
  on_('formSubmit', function(){
    readAnswers_();
    var miss=sectionMissing_(secs[P.formSec], app.audience);
    if(miss.length){ P.formMissing=miss; render(); showMsg(t('Please answer the questions marked *')); return; }
    clearTimeout(draftTimer_); P.busy=true; render();
    var updating=!!app.submittedAt;
    run(updating ? 'portalUpdateAnswers' : 'portalSubmit', [P.auth.user, P.auth.pin, P.answers], function(d){
      P.busy=false;
      if(d && d.ok){
        P.boot=d; P.answers=d.application.answers||{}; P.editMine=false; P.view='me'; P.formSec=0; showMsg(updating ? t('Your changes are saved.') : t('Your application is in. We will be in touch!'));
        if(!updating) portalConfetti_();
        /* The application is in — the next thing is the leader reference, so the
           link is made now and the dashboard opens on "send it to your leader". */
        var ra=d.application, rs=(ra.reference||{}).status||'none';
        if(!updating && ra.refNeeded && rs!=='received' && rs!=='pending'){ P.refNext=true; makeRefLink_(null, function(link, rd){ P.refLink=link; if(P.boot.application) P.boot.application.reference=rd.reference; render(); scrollToRef_(); }); return; }
        render(); return; }
      if(d && d.err==='missing' && d.missing){
        P.formMissing=d.missing;
        for(var i=0;i<secs.length;i++){ if(askedIn_(secs[i], app.audience).some(function(q){ return d.missing.indexOf(q.id)>-1; })){ P.formSec=i; break; } }
        showMsg(t('A few required answers are still missing.')); render(); return;
      }
      showMsg(d && d.err==='submitted' ? t('This application was already submitted.') : t('Could not send — try again.')); render();
    });
  });
}

/* ==================== trips: dates like booking a flight ====================
   A team's stay is a list of places with dates, our base first. Tap the
   dates to open a two-month calendar: tap the day you arrive, then the day
   you leave. "Add another location" adds a place in Cambodia with its own
   dates. The total in Cambodia runs from the first arrival to the last
   departure. Old applications (arrival / departure fields) read the same. */
function ymd_(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function parseYmd_(v){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function daysIncl_(from, to){ var a=parseYmd_(from), b=parseYmd_(to); if(!a||!b||b<a) return 0; return Math.round((b-a)/86400000)+1; }
function fmtDay_(v, weekday){ var d=parseYmd_(v); if(!d) return ''; return d.toLocaleDateString(LANG==='km'?'km-KH':'en-GB', weekday ? { weekday:'short', day:'numeric', month:'short', year:'numeric' } : { day:'numeric', month:'short', year:'numeric' }); }
function rangeLabel_(from, to, weekday){ return from && to ? fmtDay_(from, weekday)+' – '+fmtDay_(to, weekday) : from ? fmtDay_(from, weekday)+' – …' : t('no dates yet'); }
function daysLabel_(n){ return n===1 ? t('1 day') : gpT('{n} days',{n:n}); }
function nightsLabel_(n){ return n===1 ? t('1 night') : gpT('{n} nights',{n:n}); }
function addMonths_(ym, k){ var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+k; var d=new Date(y, m, 1); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
function basePlace_(){
  var c = (P.view==='crm' && typeof selected_==='function' && P.boot && P.boot.applicants) ? selected_() : (P.boot && P.boot.application);
  return campusName_((c && c.campus) || DEFAULT_CAMPUS);
}
function staysOf_(v, base){
  var a=Array.isArray(v) ? v.map(function(r){ return { place:(r && r.place)||'', from:(r && r.from)||'', to:(r && r.to)||'' }; }) : [];
  if(!a.length) a=[{ place:base, from:'', to:'' }];
  a[0].place=base; a[0].base=true;
  return a;
}
function tripOf_(ans, base){
  ans=ans||{};
  var stays=null, note='';
  if(Array.isArray(ans.itinerary) && ans.itinerary.length) stays=staysOf_(ans.itinerary, base);
  else if(ans.arrival || ans.departure){ stays=[{ place:base, from:ans.arrival||'', to:ans.departure||'', base:true }]; note=ans.otherLocations||''; }
  if(!stays) return null;
  var dated=stays.filter(function(r){ return r.from && r.to; });
  var start='', end='';
  dated.forEach(function(r){ if(!start || r.from<start) start=r.from; if(!end || r.to>end) end=r.to; });
  if(!Array.isArray(ans.itinerary) && ans.arrivalKh && ans.departureKh){ start=ans.arrivalKh; end=ans.departureKh; }
  var first=dated.slice().sort(function(a,b){ return a.from<b.from?-1:a.from>b.from?1:(a.base?-1:1); })[0]||null;
  return { stays:stays, start:start, end:end, days:daysIncl_(start, end), first:first, note:note };
}
function ansStore_(prefix){ return prefix==='s_' ? P.staffAnswers : prefix==='r_' ? P.refAnswers : P.answers; }
function flushAnswers_(prefix){
  if(prefix==='s_'){ var saved=P.answers; P.answers=P.staffAnswers; readAnswers_(document.getElementById('panel')); P.staffAnswers=P.answers; P.answers=saved; }

  else readAnswers_();
}

function calendarHtml_(r){
  var today=ymd_(new Date()), wk=[];
  for(var i=0;i<7;i++) wk.push(new Date(2024,0,1+i).toLocaleDateString(LANG==='km'?'km-KH':'en-GB',{ weekday:'narrow' }));

    for(var b=0;b<lead;b++) g+='<span></span>';

      var iso=ymd_(new Date(y, mo, d)), cls='calDay';
      if(iso===r.from) cls+=' from'; if(iso===r.to) cls+=' to';

      if(iso===today) cls+=' today'; if(iso<today) cls+=' past';

    }
