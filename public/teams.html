<!-- Fonts load OUT of the render path, on purpose.

     As an @import inside <style> this was render-blocking, and a pending
     stylesheet also blocks script execution — so on a slow or unreachable font
     CDN the app's JavaScript did not run until the request resolved or timed
     out. Measured at 8.1 seconds of dead app on a hanging font request, which
     is exactly the connection this thing is built for.

     media="print" makes the browser fetch it without blocking; onload promotes
     it to all. Text renders immediately in the fallback face and swaps when the
     webfont lands (the URL already carries display=swap). The <noscript> copy
     keeps fonts working if scripts are off. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Koulen&family=Kantumruy+Pro:wght@400;500;700&display=swap"></noscript>
<script>
/* Apply a saved theme BEFORE anything paints. Same class of problem as the splash:
   read it late and the reader watches the app flash the wrong colours on every
   open. No attribute means "follow the system", which is the default. */
(function(){
  try {
    var t = localStorage.getItem('gp-theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>

/* ---- progress rings, shared ----
   Driven by gpRingHtml()/gpRingVars() in rollup.js. One element, no SVG: the

.gRing { flex:0 0 auto; width:42px; height:42px; border-radius:50%; position:relative;
  background:conic-gradient(var(--gc) calc(var(--p) * 1%), var(--surface2) 0);

.gRing.lg { width:58px; height:58px; }

<!-- The page's own styles are in teams/teams.css and its code in teams/01-core.js …
     teams/10-bind-boot.js (Oct 2026: split out of this file, which had grown to 18,000
     lines). The theme tokens above and the splash below stay inline: they must paint on
     the first frame, and tests check they match index.html's — as do the page edges
     and html/body backgrounds just below, for the same first frame. -->
<style>
* { box-sizing:border-box; margin:0; }
/* ---- locked to the edges of the phone ----
   The page asks for viewport-fit=cover and a black-translucent status bar, which
   together hand it the whole screen INCLUDING the notch and the home-indicator
   strip. Nothing then padded for them, so the header sat under the notch and the
   tab bar under the indicator — and because iOS reports those insets late and
   re-reports them on rotation, on keyboard open/close and when the URL bar
   collapses, the content shifted each time. That is the wiggle. Pad by the insets
   and the chrome stops moving.
   overflow-x is on html as well as body on purpose: on iOS, body alone still lets
   the document itself rubber-band sideways.

   overscroll-behavior was `none` on both html and body — meant only to stop
   the rubber-band bounce and any scroll chaining past the edges — and that
   was reported, confirmed live in a real user's DevTools, as disabling
   scrolling ENTIRELY on their desktop Chrome: wheel events fired, arrived
   with real deltas, were never preventDefault()'d by anything, and the page
   still would not move — until `overscroll-behavior` was set back to `auto`
   from the console, at which point it scrolled immediately. Switching to
   `contain` was tried next and turned out to trip the very same Chromium
   bug — same live symptom (wheel deltas arriving, nothing scrolling) on a
   fresh live check. So: no overscroll-behavior at all on html/body, which
   is exactly the `auto` the user's own console test proved fixes it. The
   scroll-chaining it would have suppressed (native pull-to-refresh,
   trackpad back/forward swipe) is instead kept off by the touch-gesture
   guards in rollup.js (gpPullToRefresh, gpSlideGuard), which don't rely on
   this CSS property.

   html gets its own background too, matching the splash — reported as a
   sliver of slightly-lighter grey at the very bottom of the splash screen,
   on a real iPhone with a home indicator. The splash is `inset:0` and
   correctly covers nav.bottom (it isn't even on screen yet at that point),
   so the gap isn't from anything z-index can fix — some iOS Safari builds
   compute a position:fixed element's extent against a viewport that
   hasn't yet grown to include the safe area, right at first paint. Without
   this, whatever showed through that gap was body's --bg, a shade darker
   than the splash's --headerBg but not identical to it; with html carrying
   the same colour as the splash, there is nothing left for that gap to
   reveal that reads as a different tone. */
html { overflow-x:hidden; background:var(--headerBg); }
/* body clips sideways overflow with `clip`, not `hidden`, where the browser
   knows it (`hidden` stays as the fallback). `hidden` on body as well as html
   turns body into a scroll container of its own, and iOS WebKit mishandles
   position:fixed children of one: nav.bottom was reported "stuck on the page,
   blocking the middle of it at different parts" — left behind mid-screen after
   momentum scrolling. `clip` cuts the overflow without the scroll container. */
body { background:var(--bg); color:var(--ink); font-family:'Kantumruy Pro',system-ui,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  overflow-x:hidden; overflow-x:clip; -webkit-text-size-adjust:100%; }
</style>

<!-- ==================== SPLASH ====================
     THIS BLOCK IS DUPLICATED VERBATIM IN index.html AND teams.html.
     tests/test-splash.mjs asserts the two copies are byte-identical — edit one,
     edit both. It is inlined rather than pulled from a file because it has to
     paint on the very first frame: an external stylesheet is another round trip,
     and a round trip is the whole problem this solves.

     Why it exists: the PWA's start_url is index.html, so every launch loads the
     dashboard and then navigates to the staff page. That second navigation is a
     real network fetch, so for as long as it takes you saw the dashboard. Script
     timing cannot fix that — the splash is in the markup from the first byte and
     covers the viewport, so there is nothing to see underneath at any point.

     background is the manifest's background_color, so the iOS launch screen and
     this are the same colour and the hand-off has no flash of white or paper.

     The ring spins immediately, from CSS alone, because logo.js is 77KB and must
     not block the head. The real GP mark fades into the middle the moment it
     lands — normally within a few tens of ms, and instantly once cached. -->
<style>
#splash { position:fixed; inset:0; z-index:9999; background:var(--headerBg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  opacity:1; transition:opacity .34s ease; }
#splash.gone { opacity:0; pointer-events:none; }
.spCoin { width:104px; height:104px; border-radius:50%; position:relative;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px rgba(31,68,255,.16), 0 14px 40px rgba(31,68,255,.34); }
/* The comet ring: visible from frame one, no image needed. Masked to a 3px band
   so it reads as a ring rather than a filled disc. */
.spCoin::before { content:''; position:absolute; inset:-9px; border-radius:50%;
  background:conic-gradient(from 0deg, rgba(31,68,255,0) 0deg, rgba(31,68,255,.15) 200deg, var(--accent) 340deg, var(--accent2) 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  animation:spSpin 1s linear infinite; }
/* The mark is white, drawn for the black header, so it reads on this background
   with no coin behind it. Hidden until it has a src, so it is never a blank gap. */
.spCoin img { width:74px; height:auto; opacity:0; transition:opacity .3s ease;
  animation:spSpin 1.4s linear infinite; }
.spCoin img[src] { opacity:1; }
.spWord { font-family:'Koulen',system-ui,sans-serif; font-size:20px; letter-spacing:2.5px;
  color:var(--onDark); text-transform:uppercase; }
.spWord::after { content:''; animation:spDots 1.4s steps(1,end) infinite; }
@keyframes spSpin { to { transform:rotate(360deg) } }
@keyframes spDots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%,100%{content:'...'} }
@media (prefers-reduced-motion: reduce){
  .spCoin::before, .spCoin img { animation:none }
  .spWord::after { content:'...' }
}
</style>
<div id="splash"><div class="spCoin"><img id="splashLogo" alt=""></div><div class="spWord">Impact Loading</div></div>
<script>
/* Two calls, so nothing else needs to know how the splash is built:
   gpSplashLogo(src) drops the real mark in once logo.js has landed, and
   gpSplashDone() takes the splash down when there is finally something behind it
   worth looking at. Both are safe to call more than once, and safe to call before
   the element exists.

   The timeout is the important part: if any path forgets to call gpSplashDone —
   an error boundary, a branch added later — the splash would sit there covering a
   working app forever. Better to reveal a half-drawn page than to trap it. */
(function(){
  var TIMEOUT = 8000;
  window.gpSplashLogo = function(src){
    var i = document.getElementById('splashLogo');
    if(i && typeof src === 'string' && src && !i.getAttribute('src')) i.src = src;
  };
  window.gpSplashDone = function(){
    var s = document.getElementById('splash');
    if(!s || s.className.indexOf('gone') > -1) return;
    s.className = 'gone';
    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 420);
  };
  setTimeout(function(){ window.gpSplashDone(); }, TIMEOUT);
})();
</script>

<script>
/*  Error boundary — must come first, before any other script.

    This page is the app's front door for signed-in staff, so a failure here
    used to be inescapable: index.html redirects here, and a blank screen gave
    no way back to the dashboard. The fallback always offers that way out. */
(function(){
  var shown = false;
  function fallback(what){
    if(shown) return; shown = true;
    // Latch it so a later render() can't paint over the message.
    window.gpDead = true;
    // And lift the splash, or the message sits behind it and the app looks hung.
    if(window.gpSplashDone) window.gpSplashDone();
    var html =
      '<div style="max-width:420px;margin:12vh auto;padding:0 22px;text-align:center;'+
      'font-family:system-ui,sans-serif;color:var(--ink)">'+
      '<div style="font-size:40px;line-height:1">✦</div>'+
      '<h2 style="font-size:19px;margin:14px 0 8px">This didn’t load properly</h2>'+
      '<p style="font-size:14.5px;line-height:1.5;color:var(--muted);margin:0 0 18px">'+
      'Usually a connection hiccup. Nothing you’ve logged was lost.</p>'+
      '<button id="gpReload" style="width:100%;padding:14px;border:0;border-radius:12px;'+
      'background:var(--accent);color:var(--accentInk);font-size:16px;font-weight:700;cursor:pointer">Try again</button>'+
      '<button id="gpDash" style="width:100%;padding:13px;margin-top:9px;border:1.5px solid var(--border2);'+
      'border-radius:12px;background:transparent;color:var(--ink);font-size:15px;cursor:pointer">Clear this phone’s copy and try again</button>'+
      '<div style="font-size:11px;color:var(--faint);margin-top:20px">'+String(what||'').slice(0,140)+'</div>'+
      '</div>';
    function paint(){
      var host = document.getElementById('main') || document.body;
      if(!host) return;
      host.innerHTML = html;
      var nav = document.getElementById('bottomNav');
      if(nav) nav.classList.add('hidden');
      var r = document.getElementById('gpReload');
      if(r) r.onclick = function(){ location.reload(); };
      var d = document.getElementById('gpDash');
      /* The dashboard is a view of this page now, so "open the dashboard" would open
         this same page. What can help instead: forget the kept copy of the last boot
         and the offline files, then load fresh. The sign-in stays. */
      if(d) d.onclick = function(){
        try { localStorage.removeItem('gp-boot-cache'); } catch(e){}
        try {
          caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
            .then(function(){ location.reload(); }, function(){ location.reload(); });
        } catch(e){ location.reload(); }
      };
    }
    if(document.body) paint();
    else document.addEventListener('DOMContentLoaded', paint);
  }
  window.addEventListener('error', function(e){
  /* A failed <script src> fires an error event on the element itself.

     Only some scripts are load-bearing. logo.js and km.js are marked
     data-optional because the page works without them — a missing logo is a
     missing image, and a missing dictionary just leaves the text in English.
     Killing the whole app for either is far worse than the thing it prevents,
     and on the patchy phone connections this is built for, a third request is a
     third chance to fail. taxonomy.js has no fallback and stays fatal. */
    if(e && e.target && e.target.tagName === 'SCRIPT'){
      if(e.target.hasAttribute('data-optional')) return;
      fallback('could not load ' + (e.target.src || 'a script'));
      return;
    }
    if(e && e.message) fallback(e.message);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    fallback((e && e.reason && e.reason.message) || 'unexpected error');
  });
  window.gpBootFailed = fallback;
})();
</script>
<script src="logo.js" data-optional></script>
<script>
/* Paint the header mark and build the boot coin as soon as logo.js is in.

   The coin is written here rather than sitting in the body markup, because as
   markup it was an <img> with no src until this script ran: on a slow connection
   you watched an empty black ring spin with a hole in the middle. The dashboard
   never had that problem — it builds its loading box in render(), after the
   scripts are in — so this now matches it. An empty <main> for the few ms before
   logo.js lands looks like nothing; a hollow coin looks broken. */
(function(){
  var b=document.getElementById('brandLogo');
  if(b && typeof GP_LOGO_WIDE==='string') b.src=GP_LOGO_WIDE;
  if(typeof GP_LOGO!=='string') return;
  window.gpSplashLogo(GP_LOGO);
  var p=document.getElementById('ptrLogo'); if(p) p.src=GP_LOGO;
  var m=document.getElementById('main');
  if(m && !m.firstChild){
    m.innerHTML='<div class="loadingBox"><div class="loadCoin">'+
      '<img class="loadLogo" src="'+GP_LOGO+'" alt=""></div>'+
      '<div class="loadText">Impact Loading<span class="ldots"></span></div></div>';
  }
})();
</script>
