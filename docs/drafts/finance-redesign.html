<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finances Redesign Draft</title>
<!-- DRAFT (Nov 2026) — a preview of the redesigned Finances page on My Ministry.
     Not part of the app: it lives in docs/, Netlify only publishes public/.
     Every number on it is made up. -->
<style>
@font-face { font-family:'Koulen'; src:url(../../public/fonts/koulen-latin.woff2) format('woff2'); font-display:swap; }
@font-face { font-family:'Kantumruy Pro'; font-weight:400 700; src:url(../../public/fonts/kantumruy-latin.woff2) format('woff2'); font-display:swap; }
:root{
  --bg:#FAF6F0; --surface:#fff; --surface2:#F0EADF; --ink:#17150F; --muted:#6B6557; --line:#F0EADF;
  --accent:#1F44FF; --accentInk:#fff; --accentSoft:#E8ECFF; --good:#0A7D3C; --bad:#B3261E; --amberDeep:#96650A;
  --headerBg:#17150F; --onDark:#FAF6F0; --onDarkFaint:#9A9384;
  /* allocation categories — checked with the dataviz validator, light on #fff, dark on #1C1A17 */
  --al1:#2a78d6; --al2:#eb6834; --al3:#1baf7a; --al4:#eda100; --al5:#e87ba4; --al6:#008300;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1C1A17; --surface2:#26231D; --ink:#F2EDE4; --muted:#A8A192; --line:#2A261F;
  --accent:#6C86FF; --accentInk:#0B0A08; --accentSoft:#1B2145; --good:#4CC27E; --bad:#F2867E; --amberDeep:#E0B25A;
  --headerBg:#0C0B09; --onDark:#F2EDE4;
  --al1:#3987e5; --al2:#d95926; --al3:#199e70; --al4:#c98500; --al5:#d55181; --al6:#0ca30c;
  color-scheme:dark;
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); overflow-x:hidden; }
body{ font-family:'Kantumruy Pro','Hanken Grotesk',system-ui,sans-serif; font-size:15px; line-height:1.45; }
button{ font:inherit; color:inherit; }
.draftBar{ background:#FFF1D6; color:#5C4A1E; border-bottom:1px solid #FFD98A; padding:8px 16px; font-size:13px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.draftBar b{ font-weight:700; }
.draftBar .sp{ flex:1; }
.draftBar button{ background:#fff; border:1px solid #FFD98A; border-radius:999px; padding:3px 10px; cursor:pointer; color:#5C4A1E; }
header.app{ background:var(--headerBg); color:var(--onDark); padding:14px 16px; display:flex; align-items:center; gap:10px; }
header.app .logo{ font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:.5px; }
header.app .spark{ color:#FFB323; }
main{ max-width:560px; margin:0 auto; padding:0 16px 40px; }

/* the ministry header — flat, as My Ministry is now */
.mmHead{ padding:18px 0 6px; }
.eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.mmTitle{ font-family:'Koulen',sans-serif; font-size:30px; line-height:1.1; margin:2px 0; font-weight:400; }
.mmSub{ color:var(--muted); font-size:13px; }

/* the four tabs */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:10px 0 4px; position:sticky; top:0; background:var(--bg); z-index:5; }
.tab{ flex:1; background:none; border:0; padding:11px 4px 10px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; cursor:pointer; font-size:14px; }
.tab.on{ color:var(--ink); border-bottom-color:var(--accent); }

/* sections, flat under hairlines */
section.sec{ padding:18px 0; border-bottom:1px solid var(--line); }
.secHead{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
.secHead h2{ margin:0; font-size:17px; font-weight:700; flex:1; }
.more{ background:none; border:0; color:var(--accent); font-weight:600; font-size:13px; cursor:pointer; padding:4px 0; }
.hint{ color:var(--muted); font-size:12.5px; margin:0 0 12px; }

/* Balances */
.liquid{ background:var(--headerBg); color:var(--onDark); border-radius:16px; padding:16px 18px; }
.liquid .lbl{ font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--onDarkFaint); font-weight:600; }
.liquid .num{ font-size:44px; font-weight:700; line-height:1.05; margin:4px 0 2px; letter-spacing:-.5px; }
.liquid .num .c{ font-size:24px; opacity:.75; }
.liquid .delta{ font-size:13px; color:#7FD9A2; }
.accts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:12px; }
.acct{ padding:4px 10px; border-left:1px solid var(--line); min-width:0; }
.acct:first-child{ border-left:0; padding-left:0; }
.acct .an{ font-size:12px; color:var(--muted); font-weight:600; }
.acct .av{ font-size:18px; font-weight:700; margin-top:2px; overflow-wrap:anywhere; }
.acct .as{ font-size:11.5px; color:var(--muted); }
.rec{ font-size:13px; margin:12px 0 0; }
.rec.ok{ color:var(--good); }
.rec.late{ color:var(--amberDeep); }

/* Allocation report */
.alBar{ display:flex; gap:2px; height:28px; margin:6px 0 4px; }
.alSeg{ border-radius:4px; display:flex; align-items:center; padding-left:6px; color:#fff; font-size:12px; font-weight:700; cursor:pointer; min-width:0; overflow:hidden; white-space:nowrap; border:0; outline-offset:2px; transition:opacity .15s; }
.alSeg.dark{ color:#17150F; }
.alBar.focus .alSeg:not(.on){ opacity:.35; }
.alCheck{ font-size:12.5px; color:var(--muted); margin:2px 0 10px; }
.alCheck.ok{ color:var(--good); }
.alCheck.off{ color:var(--amberDeep); }
.alList{ list-style:none; margin:0; padding:0; }
.alRow{ border-top:1px solid var(--line); }
.alRow > button{ width:100%; background:none; border:0; display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 0; text-align:left; cursor:pointer; }
.sw{ width:14px; height:14px; border-radius:4px; }
.alName{ font-weight:600; }
.alEg{ font-size:12px; color:var(--muted); }
.alDelta{ font-size:12px; font-weight:600; color:var(--muted); }
.alDelta.up{ color:var(--good); }
.alDelta.down{ color:var(--bad); }
.alAmt{ text-align:right; font-weight:700; white-space:nowrap; }
.alPct{ display:block; font-size:12px; color:var(--muted); font-weight:600; }
.alRow.on > button .alName{ color:var(--accent); }
.alSub{ display:none; padding:0 0 12px 24px; }
.alRow.on .alSub{ display:block; }
.alSub table{ width:100%; border-collapse:collapse; font-size:13.5px; }
.alSub td{ padding:5px 0; border-bottom:1px dashed var(--line); }
.alSub td:last-child{ text-align:right; font-variant-numeric:tabular-nums; }
.alSub .note{ font-size:12px; color:var(--muted); margin:8px 0 0; }

/* Staff debt */
.dTiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.dTile{ background:var(--surface); border-radius:14px; padding:12px 14px; min-width:0; }
.dTile .dl{ font-size:12px; color:var(--muted); font-weight:600; }
.dTile .dv{ font-size:24px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
.dTile .ds{ font-size:12px; color:var(--muted); }
.dTile.late .dv{ color:var(--bad); }
.dMeter{ height:8px; border-radius:999px; background:var(--surface2); margin:12px 0 4px; overflow:hidden; }
.dMeter span{ display:block; height:100%; background:var(--bad); border-radius:999px; }
.dMeterL{ font-size:12px; color:var(--muted); }
.dListHead{ font-size:13px; font-weight:700; margin:16px 0 4px; }
.dList{ list-style:none; margin:0; padding:0; }
.dList li{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:10px 0; border-top:1px solid var(--line); align-items:center; }
.dList .dn{ font-weight:600; }
.dList .dd{ font-size:12px; color:var(--muted); }
.dList .da{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.dBreak{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 6px; margin-top:-2px; }
.dBreak span{ font-size:11.5px; background:var(--surface2); border-radius:6px; padding:2px 7px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
.dBreak span.late{ color:var(--bad); }
.dList .da small{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; }
.sheet .chips{ display:flex; gap:6px; margin:10px 0 0; flex-wrap:wrap; }
.sheet .chip{ border:1px solid var(--line); background:var(--surface2); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:13px; font-weight:600; }
.sheet .chip.on{ background:var(--accent); color:var(--accentInk); border-color:var(--accent); }
.sheet .tblWrap{ overflow-x:auto; }
.sheet .tblWrap td.r, .sheet .tblWrap th.r{ padding-left:14px; white-space:nowrap; }
.rep{ margin-top:8px; --repBg:var(--surface); }
.sec .rep{ --repBg:var(--bg); }
.tblWrap{ overflow-x:auto; }
.repTitle{ text-align:center; font-weight:700; font-size:17px; }
.repSub{ text-align:center; font-weight:600; font-size:12.5px; color:var(--muted); margin:2px 0 10px; }
.repTbl{ min-width:560px; border-collapse:collapse; font-size:12.5px; margin:0; font-variant-numeric:tabular-nums; }
.repTbl th{ font-size:11.5px; font-weight:700; color:var(--ink); text-align:center; padding:6px 8px; border-bottom:1px solid var(--ink); white-space:nowrap; }
.repTbl td{ padding:5px 8px; border:0; text-align:right; white-space:nowrap; }
.repTbl tbody tr:nth-child(even) td{ background:color-mix(in srgb, var(--surface2) 45%, var(--repBg)); }
.repTbl .nm{ text-align:left; position:sticky; left:0; background:var(--repBg); z-index:1; min-width:130px; white-space:normal; }
.repTbl tbody tr:nth-child(even) .nm{ background:color-mix(in srgb, var(--surface2) 45%, var(--repBg)); }
.repTbl .old{ color:var(--bad); }
.repTbl th.old{ color:var(--bad); }
.repTbl td.tot{ font-weight:600; }
.repTbl tfoot td{ font-weight:700; border-top:1px solid var(--ink); padding-top:7px; }
.repTbl tfoot .nm{ background:var(--repBg); }
.repTbl{ width:100%; }
.gridWrap{ border:1px solid var(--line2, var(--muted)); border-radius:8px; max-height:60vh; overflow:auto; }
.sheet .gridTbl{ table-layout:fixed; border-collapse:separate; border-spacing:0; font-size:12.5px; font-variant-numeric:tabular-nums; --gl:color-mix(in srgb, var(--muted) 30%, transparent); }
.sheet .gridTbl th, .sheet .gridTbl td{ border-right:1px solid var(--gl); border-bottom:1px solid var(--gl); padding:6px 8px; text-align:right; overflow:hidden; text-overflow:ellipsis; background:var(--surface); }
.sheet .gridTbl th:last-child, .sheet .gridTbl td:last-child{ border-right:0; }
.sheet .gridTbl thead th{ position:sticky; top:0; z-index:2; background:var(--surface2); font-weight:700; font-size:11.5px; vertical-align:bottom; white-space:normal; line-height:1.25; color:var(--ink); }
.sheet .gridTbl .nm{ text-align:left; position:sticky; left:0; z-index:1; white-space:normal; line-height:1.3; }
.sheet .gridTbl thead .nm{ z-index:3; }
.sheet .gridTbl tbody tr:nth-child(even) td{ background:color-mix(in srgb, var(--surface2) 45%, var(--surface)); }
.sheet .gridTbl .tot{ font-weight:700; background:color-mix(in srgb, var(--surface2) 70%, var(--surface)); }
.sheet .gridTbl tfoot td{ font-weight:700; background:var(--surface2); border-top:2px solid var(--ink); border-bottom:0; }
.repTbl.wrapH th{ white-space:normal; line-height:1.2; vertical-align:bottom; min-width:78px; }
.repTbl.wrapH th.nm{ min-width:130px; }
.rep.compact .repTbl{ min-width:0; font-size:12px; table-layout:auto; }
.rep.compact .repTbl th{ padding:6px 3px; font-size:11px; white-space:normal; line-height:1.2; }
.rep.compact .repTbl td{ padding:5px 3px; }
.rep.compact .repTbl .nm{ position:static; min-width:0; padding-left:0; }
.sheet td.late, .sheet th.late{ color:var(--bad); font-weight:700; }
.sheet .dsub{ display:block; font-size:11.5px; color:var(--muted); }
/* Income allocation */
.incHead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:2px 0 6px; }
.incTot{ font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
.incTotL{ font-size:12.5px; color:var(--muted); }
.incSrc{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
.incSrc:last-child{ border-bottom:0; }
.incSrc .sv{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
.incSrc .sb{ grid-column:1 / -1; height:6px; border-radius:999px; background:var(--surface2); overflow:hidden; }
.incSrc .sb span{ display:block; height:100%; border-radius:999px; }
.incSrc .sp{ color:var(--muted); font-weight:600; font-size:12px; margin-left:4px; }
.flowDrop{ width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-top:10px; font-weight:600; font-size:14px; cursor:pointer; }
.flowDrop .chev{ transition:transform .2s; color:var(--muted); }
.flowDrop.on{ border-radius:12px 12px 0 0; border-bottom-color:transparent; }
.flowDrop.on .chev{ transform:rotate(180deg); }
.flowDrop.on + .alList{ background:var(--surface); border:1px solid var(--line); border-top:0; border-radius:0 0 12px 12px; padding:0 14px; }
.incPer{ display:flex; gap:6px; margin:0 0 10px; }
.incPer button{ border:1px solid var(--line); background:var(--surface2); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:13px; font-weight:600; }
.incPer button.on{ background:var(--accent); color:var(--accentInk); border-color:var(--accent); }
/* Input tab */
.inCard{ background:var(--surface); border-radius:16px; padding:16px; margin:16px 0; }
.inCard h2{ margin:0 0 2px; font-size:17px; }
.inLast{ font-size:12.5px; color:var(--muted); margin:0 0 14px; }
.inRow{ display:grid; grid-template-columns:minmax(0,1fr) 150px; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.inRow:first-of-type{ border-top:0; }
.inRow label{ font-weight:600; }
.inRow .ls{ display:block; font-size:12px; color:var(--muted); font-weight:400; }
.money{ position:relative; }
.money span{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; pointer-events:none; }
.money input{ width:100%; padding:10px 10px 10px 22px; text-align:right; font:inherit; font-weight:700; font-variant-numeric:tabular-nums; border:1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius:10px; background:var(--bg); color:var(--ink); }
.money input::placeholder{ font-weight:400; color:color-mix(in srgb, var(--muted) 70%, transparent); }
.money input::-webkit-outer-spin-button, .money input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.money input{ -moz-appearance:textfield; }
.inCard input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
.inCard input.bad{ border-color:var(--bad); }
.money .calcPrev{ position:absolute; right:6px; left:auto; top:-12px; transform:none; font-size:11.5px; font-weight:700; color:var(--accentInk); background:var(--accent); border-radius:999px; padding:2px 9px; z-index:3; box-shadow:0 2px 6px rgba(0,0,0,.18); white-space:nowrap; }
.money .calcPrev.bad{ background:var(--bad); color:#fff; }
.inTip{ font-size:12px; color:var(--muted); margin:-8px 0 10px; }
.inWas{ grid-column:1 / -1; font-size:12px; color:var(--muted); margin-top:-4px; text-align:right; }
.inTotal{ display:flex; justify-content:space-between; align-items:baseline; background:var(--headerBg); color:var(--onDark); border-radius:12px; padding:12px 14px; margin:12px 0 4px; }
.inTotal b{ font-size:22px; font-variant-numeric:tabular-nums; }
.inTotal small{ display:block; color:var(--onDarkFaint); font-size:12px; }
.inTotal .dd{ font-size:12px; text-align:right; }
.inDates{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
.inDates label{ font-size:12.5px; font-weight:600; display:block; margin-bottom:4px; }
.inDates input{ width:100%; padding:9px 10px; font:inherit; border:1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius:10px; background:var(--bg); color:var(--ink); }
.inDates .ls{ font-size:11.5px; color:var(--muted); margin-top:3px; }
.inErr{ color:var(--bad); font-size:13px; margin:10px 0 0; }
.inBtns{ display:flex; gap:8px; margin-top:14px; }
.btn{ border:0; border-radius:12px; padding:11px 18px; font-weight:700; cursor:pointer; background:var(--accent); color:var(--accentInk); }
.btn.ghost{ background:var(--surface2); color:var(--ink); }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--headerBg); color:var(--onDark); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; z-index:30; }
.inHist{ margin-top:14px; }
.inHist summary{ cursor:pointer; font-weight:600; font-size:13.5px; color:var(--accent); }
.inHist table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px; font-variant-numeric:tabular-nums; }
.inHist th{ text-align:right; color:var(--muted); font-weight:600; padding:5px 4px; border-bottom:1px solid var(--line); }
.inHist td{ text-align:right; padding:6px 4px; border-bottom:1px solid var(--line); }
.inHist th:first-child, .inHist td:first-child{ text-align:left; }
.inAlSum{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 12px; background:var(--headerBg); color:var(--onDark); border-radius:12px; padding:12px 14px; margin:0 0 12px; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 46px); z-index:4; }
.inAlSum small{ display:block; color:var(--onDarkFaint); font-size:12px; }
.inAlSum b{ font-size:18px; font-variant-numeric:tabular-nums; }
.inAlSum .st{ grid-column:1 / -1; font-size:13px; font-weight:600; }
.inAlSum .ok{ color:#7FD9A2; }
.inAlSum .off{ color:#FFC56B; }
.inAlGrp{ border-top:1px solid var(--line); }
.inAlHead{ display:grid; grid-template-columns:14px minmax(0,1fr) auto 16px; gap:10px; align-items:center; padding:12px 0; cursor:pointer; list-style:none; }
.inAlHead::-webkit-details-marker{ display:none; }
.inAlGrp.single .inAlHead{ grid-template-columns:14px minmax(0,1fr) 150px; cursor:default; }
.inAlHead .gn{ font-weight:700; }
.inAlHead .gs{ display:block; font-size:12px; color:var(--muted); font-weight:400; }
.inAlHead .chg{ color:var(--accent); font-weight:600; }
.inAlHead .gt{ font-weight:700; font-variant-numeric:tabular-nums; }
.inAlHead .chev{ color:var(--muted); transition:transform .2s; }
.inAlGrp[open] .chev{ transform:rotate(180deg); }
.inAlBody{ padding:0 0 10px 24px; }
.inAlRow{ display:grid; grid-template-columns:minmax(0,1fr) 140px; gap:10px; align-items:center; padding:5px 0; }
.inAlRow label{ font-size:14px; }
.inNext{ border:1px dashed color-mix(in srgb, var(--muted) 45%, transparent); border-radius:14px; padding:12px 14px; margin:10px 0; color:var(--muted); font-size:13.5px; display:flex; gap:10px; align-items:center; }
.inNext b{ color:var(--ink); }
.soon{ text-align:center; color:var(--muted); padding:40px 10px; }
.soon .big{ font-size:36px; }
.soon h3{ color:var(--ink); margin:8px 0 4px; }

/* details sheet */
.scrim{ position:fixed; inset:0; background:rgba(23,21,15,.45); display:none; z-index:20; }
.sheet{ position:fixed; left:0; right:0; bottom:0; max-width:720px; margin:0 auto; background:var(--surface); border-radius:18px 18px 0 0; padding:18px 18px 28px; z-index:21; transform:translateY(105%); visibility:hidden; transition:transform .22s ease, visibility 0s .22s; max-height:85vh; overflow:auto; }
body.sheetOn .scrim{ display:block; }
body.sheetOn .sheet{ transform:none; visibility:visible; transition:transform .22s ease; }
.sheet h3{ margin:0 0 4px; }
.sheet .x{ float:right; background:var(--surface2); border:0; border-radius:999px; width:32px; height:32px; cursor:pointer; }
.sheet table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14px; }
.sheet th{ text-align:left; font-size:12px; color:var(--muted); font-weight:600; padding:6px 0; border-bottom:1px solid var(--line); }
.sheet td{ padding:8px 0; border-bottom:1px solid var(--line); }
.sheet td.r, .sheet th.r{ text-align:right; font-variant-numeric:tabular-nums; }
@media (prefers-reduced-motion:reduce){ .sheet,.alSeg{ transition:none; } }
</style>
</head>
<body>
<div class="draftBar"><b>Draft preview</b> · Finances on My Ministry · sample numbers only <span class="sp"></span><button id="themeBtn" type="button">🌙 Dark</button></div>
<header class="app"><span class="logo">YWAM GP <span class="spark">✦</span></span></header>
<main>
  <div class="mmHead">
    <div class="eyebrow">My Ministry</div>
    <h1 class="mmTitle">💰 Finances</h1>
    <div class="mmSub">Skills Training · Siem Reap · the Finances office</div>

/* ---- simple sums in the amount boxes: 500-30, 5*6, (120+80)/2, 1,250 + 40 ----
   A small parser of its own (never eval): numbers, + - * / ( ), x × for times, ÷ for divide.
   "$" and thousands commas are ignored; anything after "=" is dropped (5*6=30 → 30). */
function calc_(v){
  if(typeof v==='number') return v;
  var str=String(v==null?'':v).split('=')[0].replace(/[\s$,]/g,'').replace(/[x×]/gi,'*').replace(/÷/g,'/');
  if(!str) return NaN;
  if(/[^0-9.+\-*/()]/.test(str)) return NaN;
  var i=0;
  function num(){ var m=/^\d*\.?\d+|^\d+\./.exec(str.slice(i)); if(!m) throw 0; i+=m[0].length; return parseFloat(m[0]); }
  function atom(){ var c=str[i];
    if(c==='-'){ i++; return -atom(); } if(c==='+'){ i++; return atom(); }
    if(c==='('){ i++; var v2=expr(); if(str[i]!==')') throw 0; i++; return v2; }
    return num(); }
  function term(){ var v2=atom(); while(str[i]==='*'||str[i]==='/'){ var op=str[i++], r=atom(); if(op==='/'&&r===0) throw 0; v2= op==='*' ? v2*r : v2/r; } return v2; }
  function expr(){ var v2=term(); while(str[i]==='+'||str[i]==='-'){ var op=str[i++], r=term(); v2= op==='+' ? v2+r : v2-r; } return v2; }
  try { var out=expr(); if(i!==str.length || !isFinite(out)) return NaN; return Math.round(out*100)/100; } catch(e){ return NaN; }
}

}
function debtHtml(){
  var P=DEBT.people, tot=0, old=0;
  P.forEach(function(p){ tot+=p.tot; old+=p.old; });
  var owing=P.filter(function(p){ return p.tot>0; }), late=P.filter(function(p){ return p.old>0; }).sort(function(a,b){ return b.old-a.old; });
  var pct=tot ? Math.round(old/tot*100) : 0;
  var h='<section class="sec" id="debt"><div class="secHead"><h2>💳 Staff debt</h2><button class="more" data-sheet="debt">Details ›</button></div>'+
    '<p class="hint">From the '+esc(DEBT.src)+' · as of '+date(DEBT.asOf)+'</p>'+
    '<div class="dTiles"><div class="dTile"><div class="dl">Total outstanding</div><div class="dv">'+money(tot)+'</div><div class="ds">'+owing.length+' people owe money</div></div>'+
    '<div class="dTile late"><div class="dl">2 months or older</div><div class="dv">'+money(old)+'</div><div class="ds">'+late.length+' people · '+pct+'% of the total</div></div></div>'+
    '<div class="dMeter" role="img" aria-label="'+pct+'% of staff debt is 2 months or older"><span style="width:'+pct+'%"></span></div>'+
    '<div class="dMeterL">'+pct+'% of what staff owe is 2 months old or more</div>';
  h+= late.length ? debtReportHtml(DEBT.people.filter(function(p){ return p.old>0; }), 'Owing for 2 Months or more', true)
    : '<p class="hint">Nobody owes anything 2 months old or more. 🎉</p>';
  return h+'</section>';
}
/* income and expense allocation — SAMPLE numbers. Income: each kind of income is shared out
   to the allocations. Expenses: each kind of spending is paid from an allocation. by[category]
   is the amount for that allocation; prev = the month before. One report, two kinds. */
var FLOW = {
  inc: { id:'income', icon:'💵', title:'Income allocation', report:'SR Income Allocation', verb:'came in', upGood:true,
    hint:'Money that came in, and how it was shared out to the allocations. Tap a colour, or open the list, to see where each one’s money came from.',
    tHint:'Each column is one kind of income; each row is where it went.', none:'nothing came in', srcWord:'source',
    cats:['Teams','School fees','Staff contributions','Donations','Ministry rent','Other'],
    by:{ des:{ prev:2100, by:{ 'Donations':2400 } },
         min:{ prev:7900, by:{ 'School fees':6200, 'Teams':1500, 'Donations':800 } },
         war:{ prev:1400, by:{ 'Donations':1000 } },
         adm:{ prev:11800, by:{ 'Teams':3000, 'School fees':5000, 'Staff contributions':4000, 'Ministry rent':1200 } },
         sav:{ prev:750, by:{ 'Teams':500, 'Other':250 } },
         fund:{ prev:1000, by:{ 'Staff contributions':600, 'Donations':400 } } } },
  exp: { id:'expense', icon:'🧾', title:'Expense allocation', report:'SR Expense Allocation', verb:'went out', upGood:false,
    hint:'Money that went out, and which allocation paid for it. Tap a colour, or open the list, to see what each one spent it on.',
    tHint:'Each column is one kind of spending; each row is the allocation that paid for it.', none:'nothing spent', srcWord:'kind',
    cats:['Rent & utilities','Food','Transport','Ministry costs','Relief supplies','Maintenance','Staff care','Office','Other'],
    by:{ des:{ prev:1500, by:{ 'Ministry costs':1800 } },
         min:{ prev:7200, by:{ 'Ministry costs':4200, 'Food':1600, 'Transport':900 } },
         war:{ prev:900, by:{ 'Relief supplies':1200 } },
         adm:{ prev:9800, by:{ 'Rent & utilities':5200, 'Food':2400, 'Maintenance':1300, 'Staff care':800, 'Office':450 } },
         sav:{ prev:0, by:{} },
         fund:{ prev:0, by:{ 'Maintenance':700 } } } }
};
var FLOW_MONTH='November 2026', FLOW_PREV='October 2026';
/* year to date: the same shares, bigger — sample */
Object.keys(FLOW).forEach(function(kind){ var F=FLOW[kind]; F.ytd={};
  Object.keys(F.by).forEach(function(k){ var o={}; Object.keys(F.by[k].by).forEach(function(c){ o[c]=Math.round(F.by[k].by[c]*(9.4+(c.length%4)*0.6)); }); F.ytd[k]={ by:o }; }); });
S.flowPer={}; S.flowOpen={}; S.flowList={};
function flowOf_(kind, id){ var F=FLOW[kind], src=(S.flowPer[kind]==='ytd'?F.ytd:F.by)[id], by=src?src.by:{}, tot=0;
  Object.keys(by).forEach(function(k){ tot+=by[k]; }); return { by:by, tot:tot, prev:src&&src.prev }; }
function flowDelta_(kind, d, vs){
  if(Math.abs(d)<0.5) return '<span class="alDelta">Same as '+vs+'</span>';
  var good = FLOW[kind].upGood ? d>0 : d<0;
  return '<span class="alDelta '+(good?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+money(Math.abs(d))+' vs '+vs+'</span>';
}
function flowPerHtml_(kind){ var ytd=S.flowPer[kind]==='ytd';
  return '<div class="incPer"><button class="'+(ytd?'':'on')+'" data-flowper="'+kind+'|month">'+FLOW_MONTH+'</button><button class="'+(ytd?'on':'')+'" data-flowper="'+kind+'|ytd">2026 so far</button></div>'; }
function flowHtml(kind){
  var F=FLOW[kind], ytd=S.flowPer[kind]==='ytd', rows=ALLOC.map(function(a){ return { a:a, o:flowOf_(kind, a.id) }; }), T=0, PT=0;
  rows.forEach(function(r){ T+=r.o.tot; PT+=r.o.prev||0; });
  var h='<section class="sec" id="'+F.id+'"><div class="secHead"><h2>'+F.icon+' '+F.title+'</h2><button class="more" data-sheet="'+F.id+'">Details ›</button></div>'+
    '<p class="hint">'+F.hint+'</p>'+flowPerHtml_(kind)+
    '<div class="incHead"><span class="incTot">'+money(T)+'</span><span class="incTotL">'+F.verb+(ytd?' this year':' during '+FLOW_MONTH)+'</span>'+
    (!ytd ? flowDelta_(kind, T-PT, FLOW_PREV) : '')+'</div>';
  h+='<div class="alBar" role="img" aria-label="'+esc(rows.map(function(r){ return r.a.name+' '+money(r.o.tot); }).join(', '))+'">'+
    rows.filter(function(r){ return r.o.tot>0; }).map(function(r){ var p=r.o.tot/T*100;
      return '<button class="alSeg'+(r.a.dark?' dark':'')+'" data-flow="'+kind+'|'+r.a.id+'" style="flex:'+r.o.tot+' 1 0;background:var('+r.a.c+')" title="'+esc(r.a.name+' · '+money(r.o.tot)+' · '+Math.round(p)+'%')+'">'+(p>=9?Math.round(p)+'%':'')+'</button>'; }).join('')+'</div>';
  var listOn=!!S.flowList[kind];
  h+='<button class="flowDrop'+(listOn?' on':'')+'" data-flowlist="'+kind+'" aria-expanded="'+listOn+'"><span>'+(listOn?'Hide':'Show')+' the '+ALLOC.length+' allocations</span><span class="chev">▾</span></button>';
  if(!listOn) return h+'</section>';
  h+='<ul class="alList">'+rows.map(function(r){ var a=r.a, o=r.o, p=T?o.tot/T*100:0, on=S.flowOpen[kind]===a.id;
    var dl = (o.prev==null || ytd) ? '' : '<br>'+flowDelta_(kind, o.tot-o.prev, FLOW_PREV);
    var cs=Object.keys(o.by).sort(function(x,y){ return o.by[y]-o.by[x]; });
    return '<li class="alRow'+(on?' on':'')+'"><button data-flow="'+kind+'|'+a.id+'" aria-expanded="'+on+'">'+
      '<span class="sw" style="background:var('+a.c+')"></span>'+
      '<span><span class="alName">'+esc(a.name)+'</span><br><span class="alEg">'+(cs.length ? cs.length+' '+F.srcWord+(cs.length>1?'s':'')+' · '+esc(cs.slice(0,2).join(', '))+(cs.length>2?'…':'') : F.none)+'</span>'+dl+'</span>'+
      '<span class="alAmt">'+money(o.tot)+'<span class="alPct">'+Math.round(p)+'%</span></span></button>'+
      '<div class="alSub">'+(cs.length ? cs.map(function(k){ var sp=o.by[k]/o.tot*100;
        return '<div class="incSrc"><span>'+esc(k)+'<span class="sp">'+Math.round(sp)+'%</span></span><span class="sv">'+money(o.by[k])+'</span><span class="sb"><span style="width:'+sp.toFixed(1)+'%;background:var('+a.c+')"></span></span></div>'; }).join('')
        : '<p class="note" style="margin:0">'+esc(F.none.charAt(0).toUpperCase()+F.none.slice(1))+(ytd?' this year.':' in '+FLOW_MONTH+'.')+'</p>')+'</div></li>';
  }).join('')+'</ul>';
  return h+'</section>';
}
function flowSheetHtml_(kind){
  var F=FLOW[kind], ytd=S.flowPer[kind]==='ytd', cell=function(v){ return v ? v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : ''; };
  var used=F.cats.filter(function(k){ return ALLOC.some(function(a){ return flowOf_(kind, a.id).by[k]; }); });
  var colTot=function(k){ return ALLOC.reduce(function(s2,a){ return s2+(flowOf_(kind, a.id).by[k]||0); },0); };
  var all=ALLOC.reduce(function(s2,a){ return s2+flowOf_(kind, a.id).tot; },0);
  return flowPerHtml_(kind).replace('class="incPer"','class="incPer" style="margin:0 0 4px"')+
    '<div class="rep"><div class="repTitle">'+F.report+'</div><div class="repSub">'+(ytd?'January – November 2026':FLOW_MONTH)+'</div>'+
    '<div class="tblWrap gridWrap"><table class="gridTbl" style="width:'+(150+96*(used.length+1))+'px"><colgroup><col style="width:150px">'+used.map(function(){ return '<col style="width:96px">'; }).join('')+'<col style="width:96px"></colgroup>'+
    '<thead><tr><th class="nm">Allocation</th>'+used.map(function(k){ return '<th>'+esc(k)+'</th>'; }).join('')+'<th class="tot">Total</th></tr></thead><tbody>'+
    ALLOC.map(function(a){ var o=flowOf_(kind, a.id);
      return '<tr><td class="nm"><span class="sw" style="display:inline-block;width:10px;height:10px;vertical-align:0;margin-right:6px;background:var('+a.c+')"></span>'+esc(a.name)+'</td>'+used.map(function(k){ return '<td>'+cell(o.by[k])+'</td>'; }).join('')+'<td class="tot">'+cell(o.tot)+'</td></tr>'; }).join('')+
    '</tbody><tfoot><tr><td class="nm">TOTAL</td>'+used.map(function(k){ return '<td>'+cell(colTot(k))+'</td>'; }).join('')+'<td class="tot">'+cell(all)+'</td></tr></tfoot></table></div></div>'+
    '<p class="hint" style="margin-top:10px">US$. '+F.tHint+' On a phone, swipe the table sideways.</p>';
}
function nextHtml(){
  return '<section class="sec"><p class="hint" style="margin:0">Next on the dashboard: the other reports (Profit and Loss, Burn Rate…) — each a short summary here, with its details a tap away.</p></section>';
}
function soon(icon, title, line){ return '<div class="soon"><div class="big">'+icon+'</div><h3>'+title+'</h3><div>'+line+'</div></div>'; }
function render(){
  var p=document.getElementById('pane');
  if(S.tab==='dash') p.innerHTML=balancesHtml()+allocHtml()+debtHtml()+flowHtml('inc')+flowHtml('exp')+nextHtml();
  else if(S.tab==='input') p.innerHTML=inputHtml();
  else if(S.tab==='tasks') p.innerHTML=soon('✅','Tasks','The Finances office’s GP Tasks list — as on every ministry.');
  else p.innerHTML=soon('🎯','OKRs','The Finances office’s objectives for the quarter — as on every ministry.');
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===S.tab); });
}

/* ---- details sheets ---- */
function sheet(which){
  var T=total(), h='<button class="x" id="sx" aria-label="Close">✕</button>';
  if(which==='income' || which==='expense'){
    h+=flowSheetHtml_(which==='income'?'inc':'exp');
  } else if(which==='debt'){
    var all=S.debtAll!==false, P=DEBT.people.filter(function(p){ return all ? p.tot>0 : p.old>0; });
    var nAll=DEBT.people.filter(function(p){ return p.tot>0; }).length, nOld=DEBT.people.filter(function(p){ return p.old>0; }).length;
    h+='<div class="chips" style="margin:0 0 4px"><button class="chip'+(all?' on':'')+'" data-debtall="1">Everyone · '+nAll+'</button>'+
      '<button class="chip'+(all?'':' on')+'" data-debtall="0">2 Months or older · '+nOld+'</button></div>'+
      debtReportHtml(P, DEBT.title)+
      '<p class="hint" style="margin-top:10px">US$. The red columns are 2 months old or more. On a phone, swipe the table sideways.</p>';
  } else if(which==='balances'){
    h+='<h3>🏦 Balances — details</h3><p class="hint">As of '+date(BAL.asOf)+'. Later: the history of each account, month by month.</p>'+
      '<table><tr><th>Account</th><th class="r">Amount</th><th class="r">Share</th></tr>'+
      BAL.accts.map(function(a){ return '<tr><td>'+esc(a.name)+'</td><td class="r">'+money(a.amt,true)+'</td><td class="r">'+(a.amt/T*100).toFixed(1)+'%</td></tr>'; }).join('')+
      '<tr><td><b>Total liquid assets</b></td><td class="r"><b>'+money(T,true)+'</b></td><td class="r">100%</td></tr></table>';
  } else {
    h+='<h3>📊 Allocation report — details</h3><p class="hint">Every allocation, what it holds, and how it has moved since '+date(BAL.prevAsOf)+'.</p><table><tr><th>Allocation</th><th class="r">Amount</th><th class="r">Share</th><th class="r">Change</th></tr>';
    ALLOC.forEach(function(a){
      h+='<tr><td><span class="sw" style="display:inline-block;vertical-align:-2px;margin-right:6px;background:var('+a.c+')"></span><b>'+esc(a.name)+'</b></td><td class="r"><b>'+money(a.amt,true)+'</b></td><td class="r">'+(a.amt/T*100).toFixed(1)+'%</td><td class="r">'+(function(d){ return Math.abs(d)<0.005 ? '—' : '<span class="alDelta '+(d>0?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+money(Math.abs(d),true)+'</span>'; })(a.amt-a.prev)+'</td></tr>';
      a.items.forEach(function(i){ if(a.items.length>1) h+='<tr><td style="padding-left:22px;color:var(--muted)">'+esc(i[0])+'</td><td class="r" style="color:var(--muted)">'+money(i[1],true)+'</td><td></td><td></td></tr>'; });
    });
    h+='</table>';
  }
  var el=document.getElementById('sheet'); el.innerHTML=h; document.body.classList.add('sheetOn');
  document.getElementById('sx').onclick=closeSheet;
}
function closeSheet(){ document.body.classList.remove('sheetOn'); }
document.getElementById('scrim').onclick=closeSheet;
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });

document.addEventListener('toggle', function(e){ var g=e.target.dataset && e.target.dataset.inalgrp; if(g){ (S.inAlOpen=S.inAlOpen||{})[g]=e.target.open; } }, true);
function calcPreview_(inp){
  var box=inp.parentNode, pv=box.querySelector('.calcPrev'), v=inp.value;
  if(!isSum_(v)){ if(pv) pv.remove(); return; }
  if(!pv){ pv=document.createElement('span'); pv.className='calcPrev'; box.appendChild(pv); }
  var n=calc_(v); pv.classList.toggle('bad', isNaN(n)); pv.textContent = isNaN(n) ? 'not a sum I can work out' : '= '+n.toFixed(2);
}
function calcFinish_(inp){
  if(!inp.closest || !inp.closest('.money')) return;
  var v=inp.value; if(!isSum_(v)) return;
  var n=calc_(v); if(isNaN(n)){ inp.classList.add('bad'); return; }
  inp.value=n.toFixed(2); var pv=inp.parentNode.querySelector('.calcPrev'); if(pv) pv.remove();
  inp.dispatchEvent(new Event('input', { bubbles:true }));
}
document.addEventListener('focusout', function(e){ calcFinish_(e.target); });
document.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.closest && e.target.closest('.money')){ e.preventDefault(); calcFinish_(e.target); } });
document.addEventListener('input', function(e){
  if(e.target.closest && e.target.closest('.money')) calcPreview_(e.target);
  var ak=e.target.dataset && e.target.dataset.inal;
  if(ak){ (S.inAl=S.inAl||{})[ak]=e.target.value; var gid=ak.split('|')[0], g=ALLOC.filter(function(a){ return a.id===gid; })[0];
    var gt=document.getElementById('inAlT_'+gid); if(gt) gt.textContent=money(inAlGroupTot_(g),true);
    var sm=document.getElementById('inAlSum'); if(sm) sm.innerHTML=inAlSumHtml_(); return; }
  var k=e.target.dataset && e.target.dataset.inbal; if(!k) return;
  S.inBal[k]=e.target.value; e.target.classList.remove('bad');
  var el=document.getElementById('inTotal'); if(el) el.innerHTML=inTotalHtml_();   /* no re-render, so typing is never lost */
});
document.addEventListener('click', function(e){
  if(e.target.id==='inBalSave'){ inSave_(); return; }
  if(e.target.id==='inAlSave'){ inAlSave_(); return; }
  if(e.target.id==='inAlReset'){ S.inAl=null; S.inAlErr=''; render(); return; }
  if(e.target.id==='inBalCopy'){ BAL.accts.forEach(function(a){ S.inBal[a.id]=inMoney_(a.amt); }); S.inErr=''; render(); return; }
  var t=e.target.closest('[data-tab],[data-al],[data-sheet],[data-debtall],[data-flow],[data-flowper],[data-flowlist]'); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); }
  else if(t.dataset.flowlist){ var fk=t.dataset.flowlist; S.flowList[fk]=!S.flowList[fk]; render(); }
  else if(t.dataset.flow){ var fp=t.dataset.flow.split('|');
    if(t.classList.contains('alSeg')){ S.flowList[fp[0]]=true; S.flowOpen[fp[0]]=fp[1]; }   /* a colour opens the list on its own row */
    else S.flowOpen[fp[0]] = S.flowOpen[fp[0]]===fp[1] ? null : fp[1];
    render(); }
  else if(t.dataset.flowper){ var pp=t.dataset.flowper.split('|'); S.flowPer[pp[0]]=pp[1]; render(); if(document.body.classList.contains('sheetOn')) sheet(FLOW[pp[0]].id); }
  else if(t.dataset.al){ S.open = S.open===t.dataset.al ? null : t.dataset.al; render(); }
  else if(t.dataset.sheet) sheet(t.dataset.sheet);
  else if(t.dataset.debtall!=null){ S.debtAll = t.dataset.debtall==='1'; sheet('debt'); }
});
document.getElementById('themeBtn').onclick=function(){
  var r=document.documentElement, dark=r.dataset.theme==='dark';
  r.dataset.theme = dark ? 'light' : 'dark'; this.textContent = dark ? '🌙 Dark' : '☀️ Light';
};
render();
</script>
</body>
</html>
