<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finances Redesign Draft</title>
<!-- DRAFT (Nov 2026) — a preview of the redesigned Finances page on My Ministry.
     Not part of the app: it lives in docs/, Netlify only publishes public/.
     Every number on it is made up. -->
<style>
@font-face { font-family:'Koulen'; src:url(../../public/fonts/koulen-latin.woff2) format('woff2'); font-display:swap; }
@font-face { font-family:'Kantumruy Pro'; font-weight:400 700; src:url(../../public/fonts/kantumruy-latin.woff2) format('woff2'); font-display:swap; }
:root{
  --bg:#FAF6F0; --surface:#fff; --surface2:#F0EADF; --ink:#17150F; --muted:#6B6557; --line:#F0EADF;
  --accent:#1F44FF; --accentInk:#fff; --accentSoft:#E8ECFF; --good:#0A7D3C; --bad:#B3261E; --amberDeep:#96650A;
  --headerBg:#17150F; --onDark:#FAF6F0; --onDarkFaint:#9A9384;
  /* allocation categories — checked with the dataviz validator, light on #fff, dark on #1C1A17 */
  --al1:#2a78d6; --al2:#eb6834; --al3:#1baf7a; --al4:#eda100; --al5:#e87ba4; --al6:#008300; --al7:#6250d6; --al8:#e34948;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1C1A17; --surface2:#26231D; --ink:#F2EDE4; --muted:#A8A192; --line:#2A261F;
  --accent:#6C86FF; --accentInk:#0B0A08; --accentSoft:#1B2145; --good:#4CC27E; --bad:#F2867E; --amberDeep:#E0B25A;
  --headerBg:#0C0B09; --onDark:#F2EDE4;
  --al1:#3987e5; --al2:#d95926; --al3:#199e70; --al4:#c98500; --al5:#d55181; --al6:#0ca30c; --al7:#9085e9; --al8:#e66767;
  color-scheme:dark;
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); overflow-x:clip; }  /* clip, not hidden: hidden stops the sticky bars sticking */
body{ font-family:'Kantumruy Pro','Hanken Grotesk',system-ui,sans-serif; font-size:15px; line-height:1.45; }
button{ font:inherit; color:inherit; }
.draftBar{ background:#FFF1D6; color:#5C4A1E; border-bottom:1px solid #FFD98A; padding:8px 16px; font-size:13px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.draftBar b{ font-weight:700; }
.draftBar .sp{ flex:1; }
.draftBar button{ background:#fff; border:1px solid #FFD98A; border-radius:999px; padding:3px 10px; cursor:pointer; color:#5C4A1E; }
header.app{ background:var(--headerBg); color:var(--onDark); padding:14px 16px; display:flex; align-items:center; gap:10px; }
header.app .logo{ font-family:'Koulen',sans-serif; font-size:22px; letter-spacing:.5px; }
header.app .spark{ color:#FFB323; }
main{ max-width:560px; margin:0 auto; padding:0 16px 40px; }

/* the ministry header — flat, as My Ministry is now */
.mmHead{ padding:18px 0 6px; }
.eyebrow{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.mmTitle{ font-family:'Koulen',sans-serif; font-size:30px; line-height:1.1; margin:2px 0; font-weight:400; }
.mmSub{ color:var(--muted); font-size:13px; }

/* the four tabs */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:10px 0 4px; position:sticky; top:0; background:var(--bg); z-index:5; }
.tab{ flex:1; background:none; border:0; padding:11px 4px 10px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; cursor:pointer; font-size:14px; }
.tab.on{ color:var(--ink); border-bottom-color:var(--accent); }

/* sections, flat under hairlines */
section.sec{ padding:18px 0; border-bottom:1px solid var(--line); }
.secHead{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
.secHead h2{ margin:0; font-size:17px; font-weight:700; flex:1; }
.more{ background:none; border:0; color:var(--accent); font-weight:600; font-size:13px; cursor:pointer; padding:4px 0; }
.hint{ color:var(--muted); font-size:12.5px; margin:0 0 12px; }

/* Balances */
.liquid{ background:var(--headerBg); color:var(--onDark); border-radius:16px; padding:16px 18px; }
.liquid .lbl{ font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--onDarkFaint); font-weight:600; }
.liquid .num{ font-size:44px; font-weight:700; line-height:1.05; margin:4px 0 2px; letter-spacing:-.5px; }
.liquid .num .c{ font-size:24px; opacity:.75; }
.liquid .delta{ font-size:13px; color:#7FD9A2; }
.accts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:12px; }
.acct{ padding:4px 10px; border-left:1px solid var(--line); min-width:0; }
.acct:first-child{ border-left:0; padding-left:0; }
.acct .an{ font-size:12px; color:var(--muted); font-weight:600; }
.acct .av{ font-size:18px; font-weight:700; margin-top:2px; overflow-wrap:anywhere; }
.acct .as{ font-size:11.5px; color:var(--muted); }
.rec{ font-size:13px; margin:12px 0 0; }
.rec.ok{ color:var(--good); }
.rec.late{ color:var(--amberDeep); }

/* Allocation report */
.alBar{ display:flex; gap:2px; height:28px; margin:6px 0 4px; }
.alSeg{ border-radius:4px; display:flex; align-items:center; padding-left:6px; color:#fff; font-size:12px; font-weight:700; cursor:pointer; min-width:0; overflow:hidden; white-space:nowrap; border:0; outline-offset:2px; transition:opacity .15s; }
.alSeg.dark{ color:#17150F; }
.alBar.focus .alSeg:not(.on){ opacity:.35; }
.alCheck{ font-size:12.5px; color:var(--muted); margin:2px 0 10px; }
.alCheck.ok{ color:var(--good); }
.alCheck.off{ color:var(--amberDeep); }
.alList{ list-style:none; margin:0; padding:0; }
.alRow{ border-top:1px solid var(--line); }
.alRow > button{ width:100%; background:none; border:0; display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 0; text-align:left; cursor:pointer; }
.sw{ width:14px; height:14px; border-radius:4px; }
.alName{ font-weight:600; }
.alEg{ font-size:12px; color:var(--muted); }
.alDelta{ font-size:12px; font-weight:600; color:var(--muted); }
.alDelta.up{ color:var(--good); }
.alDelta.down{ color:var(--bad); }
.alAmt{ text-align:right; font-weight:700; white-space:nowrap; }
.alPct{ display:block; font-size:12px; color:var(--muted); font-weight:600; }
.alRow.on > button .alName{ color:var(--accent); }
.alSub{ display:none; padding:0 0 12px 24px; }
.alRow.on .alSub{ display:block; }
.alSub table{ width:100%; border-collapse:collapse; font-size:13.5px; }
.alSub td{ padding:5px 0; border-bottom:1px dashed var(--line); }
.alSub td:last-child{ text-align:right; font-variant-numeric:tabular-nums; }
.alSub .note{ font-size:12px; color:var(--muted); margin:8px 0 0; }

/* Staff debt */
.dTiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.dTile{ background:var(--surface); border-radius:14px; padding:12px 14px; min-width:0; }
.dTile .dl{ font-size:12px; color:var(--muted); font-weight:600; }
.dTile .dv{ font-size:24px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
.dTile .ds{ font-size:12px; color:var(--muted); }
.dTile.late .dv{ color:var(--bad); }
.dMeter{ height:8px; border-radius:999px; background:var(--surface2); margin:12px 0 4px; overflow:hidden; }
.dMeter span{ display:block; height:100%; background:var(--bad); border-radius:999px; }
.dMeterL{ font-size:12px; color:var(--muted); }
.dListHead{ font-size:13px; font-weight:700; margin:16px 0 4px; }
.dList{ list-style:none; margin:0; padding:0; }
.dList li{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; padding:10px 0; border-top:1px solid var(--line); align-items:center; }
.dList .dn{ font-weight:600; }
.dList .dd{ font-size:12px; color:var(--muted); }
.dList .da{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.dBreak{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 6px; margin-top:-2px; }
.dBreak span{ font-size:11.5px; background:var(--surface2); border-radius:6px; padding:2px 7px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
.dBreak span.late{ color:var(--bad); }
.dList .da small{ display:block; font-size:11.5px; color:var(--muted); font-weight:600; }
.sheet .chips{ display:flex; gap:6px; margin:10px 0 0; flex-wrap:wrap; }
.sheet .chip{ border:1px solid var(--line); background:var(--surface2); border-radius:999px; padding:5px 12px; cursor:pointer; font-size:13px; font-weight:600; }
.sheet .chip.on{ background:var(--accent); color:var(--accentInk); border-color:var(--accent); }
.sheet .tblWrap{ overflow-x:auto; }
.sheet .tblWrap td.r, .sheet .tblWrap th.r{ padding-left:14px; white-space:nowrap; }
.rep{ margin-top:8px; --repBg:var(--surface); }
.sec .rep{ --repBg:var(--bg); }
.tblWrap{ overflow-x:auto; }
.repTitle{ text-align:center; font-weight:700; font-size:17px; }
.repSub{ text-align:center; font-weight:600; font-size:12.5px; color:var(--muted); margin:2px 0 10px; }
.repTbl{ min-width:560px; border-collapse:collapse; font-size:12.5px; margin:0; font-variant-numeric:tabular-nums; }
.repTbl th{ font-size:11.5px; font-weight:700; color:var(--ink); text-align:center; padding:6px 8px; border-bottom:1px solid var(--ink); white-space:nowrap; }
.repTbl td{ padding:5px 8px; border:0; text-align:right; white-space:nowrap; }
.repTbl tbody tr:nth-child(even) td{ background:color-mix(in srgb, var(--surface2) 45%, var(--repBg)); }
.repTbl .nm{ text-align:left; position:sticky; left:0; background:var(--repBg); z-index:1; min-width:130px; white-space:normal; }
.repTbl tbody tr:nth-child(even) .nm{ background:color-mix(in srgb, var(--surface2) 45%, var(--repBg)); }
.repTbl .old{ color:var(--bad); }
.repTbl th.old{ color:var(--bad); }
.repTbl td.tot{ font-weight:600; }
.repTbl tfoot td{ font-weight:700; border-top:1px solid var(--ink); padding-top:7px; }
.repTbl tfoot .nm{ background:var(--repBg); }
.repTbl{ width:100%; }
.gridWrap{ border:1px solid var(--line2, var(--muted)); border-radius:8px; max-height:60vh; overflow:auto; }
.sheet .gridTbl{ table-layout:fixed; border-collapse:separate; border-spacing:0; font-size:12.5px; font-variant-numeric:tabular-nums; --gl:color-mix(in srgb, var(--muted) 30%, transparent); }
.sheet .gridTbl th, .sheet .gridTbl td{ border-right:1px solid var(--gl); border-bottom:1px solid var(--gl); padding:6px 8px; text-align:right; overflow:hidden; text-overflow:ellipsis; background:var(--surface); }
.sheet .gridTbl th:last-child, .sheet .gridTbl td:last-child{ border-right:0; }
.sheet .gridTbl thead th{ position:sticky; top:0; z-index:2; background:var(--surface2); font-weight:700; font-size:11.5px; vertical-align:bottom; white-space:normal; line-height:1.25; color:var(--ink); }
.sheet .gridTbl .nm{ text-align:left; position:sticky; left:0; z-index:1; white-space:normal; line-height:1.3; }
.sheet .gridTbl thead .nm{ z-index:3; }
.sheet .gridTbl tbody tr:nth-child(even) td{ background:color-mix(in srgb, var(--surface2) 45%, var(--surface)); }
.sheet .gridTbl .tot{ font-weight:700; background:color-mix(in srgb, var(--surface2) 70%, var(--surface)); }
.sheet .gridTbl tfoot td{ font-weight:700; background:var(--surface2); border-top:2px solid var(--ink); border-bottom:0; }
.repTbl.wrapH th{ white-space:normal; line-height:1.2; vertical-align:bottom; min-width:78px; }
.repTbl.wrapH th.nm{ min-width:130px; }
.rep.compact .repTbl{ min-width:0; font-size:12px; table-layout:auto; }
.rep.compact .repTbl th{ padding:6px 3px; font-size:11px; white-space:normal; line-height:1.2; }
.rep.compact .repTbl td{ padding:5px 3px; }
.rep.compact .repTbl .nm{ position:static; min-width:0; padding-left:0; }
.sheet td.late, .sheet th.late{ color:var(--bad); font-weight:700; }
.sheet .dsub{ display:block; font-size:11.5px; color:var(--muted); }
/* Income allocation */
.incHead{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:2px 0 6px; }
.incTot{ font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; }
.incTotL{ font-size:12.5px; color:var(--muted); }
.incSrc{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
.incSrc:last-child{ border-bottom:0; }
.incSrc .sv{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
.incSrc .sb{ grid-column:1 / -1; height:6px; border-radius:999px; background:var(--surface2); overflow:hidden; }
.incSrc .sb span{ display:block; height:100%; border-radius:999px; }
.incSrc .sp{ color:var(--muted); font-weight:600; font-size:12px; margin-left:4px; }
.alKey{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:4px 0 10px; }
.alKeyTile{ display:flex; gap:10px; align-items:flex-start; text-align:left; background:var(--surface); border:0; border-radius:14px; padding:10px 12px; cursor:pointer; color:var(--ink); }
.alKeyTile .sw{ margin-top:4px; flex:none; }
.alKeyTile small{ display:block; font-size:12px; color:var(--muted); font-weight:600; }
.alKeyTile b{ display:block; font-size:20px; font-variant-numeric:tabular-nums; }
.alKeyTile .alPct{ display:inline; }
.emptyBar{ background:var(--surface2); border-radius:6px; }
.emptyBar span{ flex:1; }
.flowDrop{ width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-top:10px; font-weight:600; font-size:14px; cursor:pointer; }
.flowDrop .chev{ transition:transform .2s; color:var(--muted); }
.flowDrop.on{ border-radius:12px 12px 0 0; border-bottom-color:transparent; background:var(--bg); }
.flowDrop.on .chev{ transform:rotate(180deg); }
.flowDrop.on + .alList{ background:var(--bg); border:1px solid var(--line); border-top:0; border-radius:0 0 12px 12px; padding:0 14px; }
.incPer{ display:flex; gap:6px; margin:0 0 10px; }
.incPer button{ border:1px solid var(--line); background:var(--surface2); border-radius:999px; padding:4px 12px; cursor:pointer; font-size:13px; font-weight:600; }
.incPer button.on{ background:var(--accent); color:var(--accentInk); border-color:var(--accent); }
/* Input tab */
.inCard{ background:var(--surface); border-radius:16px; padding:16px; margin:16px 0; }
.inCard h2{ margin:0 0 2px; font-size:17px; }
.inLast{ font-size:12.5px; color:var(--muted); margin:0 0 14px; }
.inRow{ display:grid; grid-template-columns:minmax(0,1fr) 150px; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.inRow:first-of-type{ border-top:0; }
.inRow label{ font-weight:600; }
.inRow .ls{ display:block; font-size:12px; color:var(--muted); font-weight:400; }
.money{ position:relative; }
.money span{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; pointer-events:none; }
.money input{ width:100%; padding:10px 10px 10px 22px; text-align:right; font:inherit; font-weight:700; font-variant-numeric:tabular-nums; border:1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius:10px; background:var(--bg); color:var(--ink); }
.money input::placeholder{ font-weight:400; color:color-mix(in srgb, var(--muted) 70%, transparent); }
.money input::-webkit-outer-spin-button, .money input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.money input{ -moz-appearance:textfield; }
.inCard input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
.inCard input.bad{ border-color:var(--bad); }
.money .calcPrev{ position:absolute; right:6px; left:auto; top:-12px; transform:none; font-size:11.5px; font-weight:700; color:var(--accentInk); background:var(--accent); border-radius:999px; padding:2px 9px; z-index:3; box-shadow:0 2px 6px rgba(0,0,0,.18); white-space:nowrap; }
.money .calcPrev.bad{ background:var(--bad); color:#fff; }
.inTip{ font-size:12px; color:var(--muted); margin:-8px 0 10px; }
.inWas{ grid-column:1 / -1; font-size:12px; color:var(--muted); margin-top:-4px; text-align:right; }
.inTotal{ display:flex; justify-content:space-between; align-items:baseline; background:var(--headerBg); color:var(--onDark); border-radius:12px; padding:12px 14px; margin:12px 0 4px; }
.inTotal b{ font-size:22px; font-variant-numeric:tabular-nums; }
.inTotal small{ display:block; color:var(--onDarkFaint); font-size:12px; }
.inTotal .dd{ font-size:12px; text-align:right; }
.inDates{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
.inDates label{ font-size:12.5px; font-weight:600; display:block; margin-bottom:4px; }
.inDates input{ width:100%; padding:9px 10px; font:inherit; border:1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius:10px; background:var(--bg); color:var(--ink); }
.inDates.one{ grid-template-columns:minmax(0,1fr); max-width:260px; }
.inDay{ border:2px solid var(--accent); position:sticky; top:calc(env(safe-area-inset-top, 0px) + 46px); z-index:5; padding:10px 14px; box-shadow:0 6px 14px -8px rgba(0,0,0,.25); }
.inDayRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.inDayRow label{ font-weight:700; font-size:15px; }
.inDayRow{ flex-wrap:nowrap!important; }
.inDayRow input{ padding:6px 8px!important; }
.inDayRow input{ padding:9px 10px; font:inherit; font-weight:700; border:1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius:10px; background:var(--bg); color:var(--ink); }
.inDrop{ display:flex; gap:10px; align-items:center; border:2px dashed color-mix(in srgb, var(--accent) 55%, transparent); border-radius:12px; padding:14px; margin-top:4px; cursor:pointer; font-size:14px; background:var(--accentSoft); }
.inDrop small{ color:var(--muted); }
.upSum{ margin-top:12px; font-size:13.5px; background:var(--surface2); border-radius:10px; padding:10px 12px; }
.upSum .okc{ color:var(--good); font-weight:700; }
.upSum .badc{ color:var(--bad); font-weight:700; }
.upList{ border-top:1px solid var(--line); max-height:420px; overflow:auto; }
.upRow{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:4px 10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.upN{ font-weight:600; font-size:14px; min-width:0; }
.upN span{ display:block; font-size:12px; color:var(--muted); font-weight:400; }
.upN .late{ color:var(--bad); }
.upRow select{ width:100%; padding:8px; font:inherit; font-size:13px; border:1px solid color-mix(in srgb, var(--muted) 40%, transparent); border-radius:9px; background:var(--bg); color:var(--ink); min-width:0; }
.upLinked{ grid-column:2; font-size:11.5px; color:var(--good); font-weight:600; }
.inUpload{ display:flex; gap:10px; align-items:flex-start; border:1px dashed color-mix(in srgb, var(--muted) 45%, transparent); border-radius:12px; padding:12px; margin-top:12px; font-size:14px; }
.inUpload small{ color:var(--muted); }
.inDates .ls{ font-size:11.5px; color:var(--muted); margin-top:3px; }
.inErr{ color:var(--bad); font-size:13px; margin:10px 0 0; }
.inBtns{ display:flex; gap:8px; margin-top:14px; }
.btn{ border:0; border-radius:12px; padding:11px 18px; font-weight:700; cursor:pointer; background:var(--accent); color:var(--accentInk); }
.btn.ghost{ background:var(--surface2); color:var(--ink); }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--headerBg); color:var(--onDark); padding:10px 16px; border-radius:999px; font-size:14px; font-weight:600; z-index:30; }
.inHist{ margin-top:14px; }
.inHist summary{ cursor:pointer; font-weight:600; font-size:13.5px; color:var(--accent); }
.inHist table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px; font-variant-numeric:tabular-nums; }
.inHist th{ text-align:right; color:var(--muted); font-weight:600; padding:5px 4px; border-bottom:1px solid var(--line); }
.inHist td{ text-align:right; padding:6px 4px; border-bottom:1px solid var(--line); }
.inHist th:first-child, .inHist td:first-child{ text-align:left; }
.inAlSum{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 12px; background:var(--headerBg); color:var(--onDark); border-radius:12px; padding:12px 14px; margin:0 0 12px; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 158px); z-index:4; }
.inAlSum small{ display:block; color:var(--onDarkFaint); font-size:12px; }
.inAlSum b{ font-size:18px; font-variant-numeric:tabular-nums; }
.inAlSum .st{ grid-column:1 / -1; font-size:13px; font-weight:600; }
.inAlSum .ok{ color:#7FD9A2; }

<script>
/* ---- sample data (made up) ---- */
/* balances: one entry per day the office saves. No sample days — only what is entered.

var BAL_DAYS = [];
var BAL = { asOf:null, reconciled:null, prevTotal:null, prevAsOf:null, none:true,
  accts:[ { id:'aba', name:'ABA bank', sub:'Cambodia', amt:0 },
          { id:'us',  name:'US bank',  sub:'United States', amt:0 },
          { id:'cash',name:'Cash on hand', sub:'the cash box', amt:0 } ] };
function refreshBal_(){
  BAL_DAYS.sort(function(x,y){ return x.asOf<y.asOf ? 1 : -1; });
  var c=BAL_DAYS[0], pv=BAL_DAYS[1];
  BAL.none=!c; BAL.asOf=c?c.asOf:null; BAL.reconciled=c?c.rec:null; BAL.at=c?(c.at||0):0;
  BAL.accts[0].amt=c?c.aba:0; BAL.accts[1].amt=c?c.us:0; BAL.accts[2].amt=c?c.cash:0;
  BAL.prevAsOf=pv?pv.asOf:null; BAL.prevTotal=pv?pv.aba+pv.us+pv.cash:null;
}
var ALLOC_PREV_ASOF='2026-11-13';
var ALLOC_HIST=[], DEBT_HIST=[];   /* one saved entry per day, newest first */
var ALLOC = [   /* the six allocations and their sub-funds, as the Finances office keeps them — SAMPLE amounts */
  { id:'adm', prev:8690.1, name:'Admin / Operational', eg:'office/general, kitchen, hospitality, technical, building', c:'--al1', dark:false,
    items:[['Office/General',1121.15],['Kitchen',2400],['Hospitality',1850],['Technical',1200],['Building',2600],['Other',650]], note:'The day-to-day cost of running the base.' },
  { id:'fund', prev:9000, name:'Funds', eg:'LT Fund, Development, Training, Other', c:'--al2', dark:false,
    items:[['Leadership team fund (LT Fund)',4000],['Development fund',2500],['Training fund',1800],['Other',700]], note:'The base’s standing funds, each kept for its own purpose.' },
  { id:'min', prev:23050, name:'Ministry budgets', eg:'DTS, DBS, SOMD, schools, music, media, YDC, Community Night', c:'--al3', dark:true,
    items:[['DTS',7800],['DBS',3200],['SOMD',2100],['Other Schools',2600],['GP Music',1950],['GP Media',2300],['YDC',2200],['Community Night',0]], note:'What each ministry and school still has to spend this year.' },
  { id:'sav', prev:6000, name:'Savings', eg:'put aside', c:'--al4', dark:true, single:true,

  { id:'war', prev:5300, name:'War relief', eg:'', c:'--al5', dark:true, single:true,
    items:[['War relief',6300]], note:'Given for war relief — kept apart from everything else.' },
  { id:'des', prev:17900, name:'Designated funds', eg:'KSS & YAP, Other Base Payable (Antonia), Other', c:'--al6', dark:false,
    items:[['KSS & YAP',11200],['Other Base Payable (Antonia)',6500],['Other',700]], note:'Money given for a named person or project — it can only be spent on that.' }
];
/* staff debt — as the A/R Ageing report gives it: by how long it has been owed.
   SAMPLE names, made up for the draft. */
var DEBT = { asOf:'2026-11-23', src:'A/R Ageing Summary · uploaded 23 Nov 2026', title:'SR Staff Debt', people:[
  { n:'Sample Person A',          d:'Skills Training',        b:[11.53, 0, 0, 0, 0] },
  { n:'Sample Person B',          d:'Community Service',      b:[16, 16, 16, 0, 0] },
  { n:'Sample Person C',          d:'Media',                  b:[91.50, 0, 0, 0, 0] },
  { n:'Sample Person D',          d:'Leadership Development', b:[107, 107, 18, 0, 0] },
  { n:'Sample Person E',          d:'Youth Education',        b:[0, 112, 0, 0, 0] },
  { n:'Sample Person F',          d:'Skills Training',        b:[220, 220, 0, 0, 0] },
  { n:'Sample Person G',          d:'Community Service',      b:[107, 107, 107, 107, 111.50] },
  { n:'Sample Person H',          d:'Leadership Development', b:[16, 16, 16, 16, 48] },
  { n:'Sample Person I',          d:'Youth Education',        b:[16, 0, 0, 0, 0] },
  { n:'Sample Person J & K',      d:'Campus Leadership',      b:[590, 0, 0, 0, 0] },
  { n:'Sample Person L',          d:'Media',                  b:[107, 0, 0, 0, 0] },
  { n:'Sample Person M',          d:'Skills Training',        b:[16, 16, 16, 0, 0] },
  { n:'Sample Person N & O',      d:'Community Service',      b:[35, 0, 0, 0, 0] }
] };
/* buckets, as the office's report heads them: Current · 1 month · 2 months · 3 months · Over 3 months.
   "2 months or older" = the 2 months, 3 months and Over 3 months columns. */
var DEBT_COLS=['Current','1 Month','2 Months','3 Months','3+ Months'], DEBT_OLD_FROM=2;
DEBT.people.forEach(function(p){ p.tot=p.b.reduce(function(s,v){ return s+v; },0); p.old=p.b.slice(DEBT_OLD_FROM).reduce(function(s,v){ return s+v; },0); });
ALLOC.forEach(function(a){ a.amt=a.items.reduce(function(s,i){ return s+i[1]; },0); });

/* ---- helpers ---- */
var S = { tab:'dash', open:null };
function money(n, cents){ var s=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:cents?2:0, maximumFractionDigits:cents?2:0}); return (n<0?'−$':'$')+s; }
function date(iso){ var d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function daysAgo(iso){ return Math.round((Date.parse('2026-11-23T00:00:00')-Date.parse(iso+'T00:00:00'))/86400000); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function total(){ var t=BAL.accts.reduce(function(s,a){ return s+a.amt; },0); return S.liveDraw ? Math.round((t+liveNet_())*100)/100 : t; }

/* ---- Dashboard ---- */
/* how an allocation moved since the last balances day, worded like the liquid assets' line */
function alDeltaHtml(a){
  var d=a.amt-a.prev;
  if(Math.abs(d)<0.005) return '<span class="alDelta">Same as '+date(ALLOC_PREV_ASOF)+'</span>';
  return '<span class="alDelta '+(d>0?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+money(Math.abs(d),true)+' since '+date(ALLOC_PREV_ASOF)+'</span>';
}
/* ---- simple sums in the amount boxes: 500-30, 5*6, (120+80)/2, 1,250 + 40 ----
   A small parser of its own (never eval): numbers, + - * / ( ), x × for times, ÷ for divide.
   "$" and thousands commas are ignored; anything after "=" is dropped (5*6=30 → 30). */
function calc_(v){
  if(typeof v==='number') return v;
  var str=String(v==null?'':v).split('=')[0].replace(/[\s$,]/g,'').replace(/[x×]/gi,'*').replace(/÷/g,'/');
  if(!str) return NaN;
  if(/[^0-9.+\-*/()]/.test(str)) return NaN;
  var i=0;
  function num(){ var m=/^\d*\.?\d+|^\d+\./.exec(str.slice(i)); if(!m) throw 0; i+=m[0].length; return parseFloat(m[0]); }
  function atom(){ var c=str[i];
    if(c==='-'){ i++; return -atom(); } if(c==='+'){ i++; return atom(); }
    if(c==='('){ i++; var v2=expr(); if(str[i]!==')') throw 0; i++; return v2; }
    return num(); }
  function term(){ var v2=atom(); while(str[i]==='*'||str[i]==='/'){ var op=str[i++], r=atom(); if(op==='/'&&r===0) throw 0; v2= op==='*' ? v2*r : v2/r; } return v2; }
  function expr(){ var v2=term(); while(str[i]==='+'||str[i]==='-'){ var op=str[i++], r=term(); v2= op==='+' ? v2+r : v2-r; } return v2; }
  try { var out=expr(); if(i!==str.length || !isFinite(out)) return NaN; return Math.round(out*100)/100; } catch(e){ return NaN; }
}
function isSum_(v){ return /[+\-*/x×÷()=]/i.test(String(v).replace(/^\s*-/,'')); }
/* ---- Input: the balances ---- */
function inMoney_(v){ return v==null||v==='' ? '' : Number(v).toFixed(2); }
/* one "as of" day for every report on the Input tab but staff debt, which has its own */
var TODAY='2026-11-23', ALLOC_ASOF='2026-11-20';
function reportDay_(){ return S.reportDay || TODAY; }
function inDayHtml_(){
  var d=reportDay_();
  return '<div class="inCard inDay" id="inDay"><div class="inDayRow"><label for="inReportDay">📅 Reports as of</label>'+
    '<input type="date" id="inReportDay" data-reportday="1" max="'+TODAY+'" value="'+esc(d)+'"></div>'+
    (S.dayErr ? '<p class="inErr" role="alert">⚠️ '+esc(S.dayErr)+'</p>' : '')+undoBtnHtml_()+'</div>';
}
function undoBtnHtml_(){
  var u=UNDO[UNDO.length-1];
  return '<div class="undoBar"><button class="undoBtn'+(S.undoAsk?' ask':'')+'" id="undoLast"'+(u?'':' disabled')+'>↩ '+(S.undoAsk?'Tap again':'Undo')+'</button>'+
    '<span class="dsub" title="'+(u?esc(u.msg):'')+'">'+(u ? esc(u.msg.replace(/^(Removed|Put back|Undid|Brought back)/, function(m){ return m; })) : 'Nothing to undo yet')+'</span>'+
    '<button class="undoBtn" id="inHistBtn"'+(u?'':' disabled')+'>🕘 History</button></div>';
}
function inputHtml(){
  var B=BAL, D=S.inBal || (S.inBal={ aba:'', us:'', cash:'' });
  var acc=function(id){ return B.accts.filter(function(a){ return a.id===id; })[0]; };
  var row=function(id, label, sub){ var a=acc(id);
    return '<div class="inRow"><label for="inB_'+id+'">'+label+'<span class="ls">'+sub+'</span></label>'+
      '<div class="money"><span>$</span><input id="inB_'+id+'" data-inbal="'+id+'" type="text" inputmode="text" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="'+(B.none?'0.00':inMoney_(a.amt))+'" value="'+esc(D[id])+'"></div>'+
      '<div class="inWas">'+(B.none?'Nothing entered yet':'Last time: '+money(a.amt,true)+' on '+date(B.asOf))+'</div></div>'; };
  var h=inDayHtml_()+'<details class="inCard fold" id="inBalances" data-fold="bal"'+(S.foldOpen&&S.foldOpen.bal?' open':'')+'><summary class="foldHead"><span><b>🏦 Balances</b><span class="dsub">'+(B.none?'Nothing entered yet':date(B.asOf)+' · '+money(total(),true))+'</span></span><span class="foldR"><button class="histLink" data-hist="bal">🕘 History</button><span class="chev">▾</span></span></summary>'+
    '<p class="inLast">'+(B.none?'No balances entered yet.':'Last entered for '+date(B.asOf)+'.')+' Type what is in each account on the “Reports as of” day — saving the same day again replaces it.</p>'+
    '<p class="inTip">🧮 Boxes do simple sums: type <b>500-30</b> or <b>5*6</b> and it works it out.</p>'+
    row('aba','ABA bank','Cambodia · US$ account')+row('us','US bank','United States')+row('cash','Cash on hand','the cash box, counted')+
    '<div class="inTotal" id="inTotal">'+inTotalHtml_()+'</div>'+
    (S.inErr ? '<p class="inErr" role="alert">⚠️ '+esc(S.inErr)+'</p>' : '')+
    '<div class="inBtns"><button class="btn" id="inBalSave">Save balances</button>'+(B.none?'':'<button class="btn ghost" id="inBalCopy">Same as last time</button>')+'</div>'+
    '</details>';
  h+=inAllocHtml_();
  h+=inRulesHtml_();
  h+=inBulkHtml_();
  h+=inXferHtml_();
  h+=
    flHtml_('inc')+flHtml_('exp')+inAdvHtml_()+
    inDebtHtml_()+inCatsHtml_()+inLedgerHtml_();
  /* a tick by each part that is done for the day */
  [['inBalances','bal'],['inAlloc','alloc'],['in_inc','inc'],['in_exp','exp'],['inXfer','xfer']].forEach(function(x){
    h=h.replace(new RegExp('(<details class="inCard fold" id="'+x[0]+'"[^>]*><summary class="foldHead">)'), '$1'+dayTick_(x[1]));
  });
  h+=publishHtml_();
  return h;
}
/* ---- Input: the allocations — every sub-fund's balance, in one form ---- */
function inAlVal_(gid, i){ var D=S.inAl||{}, k=gid+'|'+i; if(D[k]!=null) return D[k]; var g=ALLOC.filter(function(a){ return a.id===gid; })[0]; return inMoney_(g.items[i][1]); }
function inAlNum_(gid, i){ var v=calc_(inAlVal_(gid, i)); return isNaN(v)?0:v; }
function inAlGroupTot_(g){ var t=0; g.items.forEach(function(_, i){ t+=inAlNum_(g.id, i); }); return t; }
function inAllocHtml_(){
  var open=S.inAlOpen||{};
  var gap_=total()-ALLOC.reduce(function(s2,g){ return s2+g.amt; },0);
  var h='<details class="inCard fold" id="inAlloc" data-fold="alloc"'+(S.foldOpen&&S.foldOpen.alloc?' open':'')+'><summary class="foldHead"><span><b>📊 Allocations</b><span class="dsub">'+(Math.abs(gap_)<0.005?'✓ Every dollar allocated':(gap_>0?money(gap_,true)+' not allocated yet':money(-gap_,true)+' more than in hand'))+'</span></span><span class="foldR"><button class="histLink" data-hist="al">🕘 History</button><span class="chev">▾</span></span></summary>'+
    '<p class="inLast">How the total liquid assets are set aside. Change any balance, then save — every dollar should be in one place.</p>'+

    '<div class="inAlSum" id="inAlSum">'+inAlSumHtml_()+'</div>';
  h+=ALLOC.map(function(g){
    var changed=g.items.some(function(_, i){ return Math.abs(inAlNum_(g.id,i)-g.items[i][1])>0.004; });
    if(g.single){
      return '<div class="inAlGrp single"><div class="inAlHead"><span class="sw" style="background:var('+g.c+')"></span><label for="inA_'+g.id+'_0" class="gn">'+esc(g.name)+'</label>'+
        '<div class="money"><span>$</span><input id="inA_'+g.id+'_0" data-inal="'+g.id+'|0" type="text" inputmode="text" autocomplete="off" spellcheck="false" enterkeyhint="done" value="'+esc(inAlVal_(g.id,0))+'"></div></div></div>';
    }
    return '<details class="inAlGrp" data-inalgrp="'+g.id+'"'+(open[g.id]?' open':'')+'><summary class="inAlHead"><span class="sw" style="background:var('+g.c+')"></span><span class="gn">'+esc(g.name)+
      '<span class="gs">'+g.items.length+' funds'+(changed?' · <b class="chg">changed</b>':'')+'</span></span><span class="gt" id="inAlT_'+g.id+'">'+money(inAlGroupTot_(g),true)+'</span><span class="chev">▾</span></summary>'+
      '<div class="inAlBody">'+g.items.map(function(it, i){
        return '<div class="inAlRow"><label for="inA_'+g.id+'_'+i+'">'+esc(it[0])+'</label><div class="money"><span>$</span><input id="inA_'+g.id+'_'+i+'" data-inal="'+g.id+'|'+i+'" type="text" inputmode="text" autocomplete="off" spellcheck="false" enterkeyhint="done" value="'+esc(inAlVal_(g.id,i))+'"></div></div>'; }).join('')+
      '</div></details>';
  }).join('');
  h+=(S.inAlErr ? '<p class="inErr" role="alert">⚠️ '+esc(S.inAlErr)+'</p>' : '')+
    '<div class="inBtns"><button class="btn" id="inAlSave">Save allocations</button><button class="btn ghost" id="inAlReset">Undo changes</button></div></details>';
  return h;
}
function inAlSumHtml_(){
  var T=total(), A=ALLOC.reduce(function(s2,g){ return s2+inAlGroupTot_(g); },0), gap=T-A;
  var st = Math.abs(gap)<0.005 ? '<span class="ok">✓ Every dollar is allocated</span>'
    : gap>0 ? '<span class="off">'+money(gap,true)+' not allocated yet</span>' : '<span class="off">'+money(-gap,true)+' more than is in hand</span>';
  return '<div><small>Total liquid assets</small><b>'+money(T,true)+'</b></div><div><small>Allocated</small><b>'+money(A,true)+'</b></div><div class="st">'+st+'</div>';
}
function inAlSave_(){
  var err='';
  ALLOC.forEach(function(g){ g.items.forEach(function(_, i){ var v=inAlVal_(g.id,i); if(v==='') err=err||('Fill in '+g.items[i][0]+' (0 if empty).'); else if(isNaN(calc_(v))) err=err||(g.items[i][0]+': that isn’t a number or a sum I can work out.'); else if(calc_(v)<0) err=err||'Balances can’t be below zero.'; }); });
  var day=reportDay_(); if(!err && (!day || day>TODAY)) err='Pick a “Reports as of” day at the top that isn’t in the future.';
  S.inAlErr=err; if(err){ render(); return; }
  snap_('Put back the allocations from before');
  var alBefore=MANUAL_ALLOCS.length ? allocSnap_(day).groups : null;   /* the first one starts from nothing */
  if(ALLOC_ASOF!==day) ALLOC_PREV_ASOF=ALLOC_ASOF; ALLOC_ASOF=day;
  ALLOC.forEach(function(g){ g.prev=g.amt; g.items.forEach(function(it, i){ it[1]=+inAlNum_(g.id,i).toFixed(2); }); g.amt=g.items.reduce(function(s2,it){ return s2+it[1]; },0); });
  var gap=total()-ALLOC.reduce(function(s2,g){ return s2+g.amt; },0);
  S.alSaved=true;

try { loadState_(JSON.parse(localStorage.getItem(KEEP_KEY)||'null')); } catch(e){}
/* undo: the state as it was before each input, newest last (ten kept, on this device) */
var UNDO_KEY='gp-fin-draft-undo', UNDO=[];
try { UNDO=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]'); if(!Array.isArray(UNDO)) UNDO=[]; } catch(e){ UNDO=[]; }
var UNDO_MAX=40;
function undoSave_(){ while(UNDO.length){ try { localStorage.setItem(UNDO_KEY, JSON.stringify(UNDO)); return; } catch(e){ if(UNDO.length<=1) return; UNDO.shift(); } } try { localStorage.setItem(UNDO_KEY, '[]'); } catch(e){} }
function snap_(msg){ UNDO.forEach(function(x){ delete x.open; }); UNDO.push({ msg:msg, at:Date.now(), st:JSON.parse(JSON.stringify(stateObj_())), open:true }); if(UNDO.length>UNDO_MAX) UNDO.shift(); undoSave_(); }
/* ---- history of inputs: any one of them can be undone on its own ----
   each input keeps the state before it and after it; undoing it takes away only what it changed
   (amounts by the difference, entries by their id), keeping everything done since. If something
   done since changed the very same thing, it can't be pulled apart — then it offers to go back
   to before that input, which undoes the ones after it too. */
var IH_PARTS=[['Categories',['struct','deletedFunds']],['Transfers',['transfers','toolXfers']],['Advances',['advances']],['Income',['incomes','incMap']],['Expenses',['expenses','expMap']],
  ['Staff debt',['debt','debtHist','links']],['Update & approve',['published','dayDone']],['Balances',['bal']],['Formulas & kinds',['incRules','incTypes','expRules','expTypes']],['Allocations',['alloc','allocAsOf','allocPrevAsOf','alHist','alSaved']]];
function same_(x, y){ return JSON.stringify(x)===JSON.stringify(y); }
function ihPart_(u){ if(!u.after) return ''; for(var i=0;i<IH_PARTS.length;i++){ if(IH_PARTS[i][1].some(function(k){ return !same_(u.st[k], u.after[k]); })) return IH_PARTS[i][0]; } return ''; }
function ihKey_(x){ if(Array.isArray(x) && typeof x[0]==='string' && x.length===2 && typeof x[1]==='number') return 't:'+x[0]; if(x && typeof x==='object' && !Array.isArray(x)){ if(x.id!=null) return 'i:'+x.id; if(x.asOf!=null) return 'a:'+x.asOf; } return null; }
function merge3_(B, A, C){
  if(same_(A, B)) return C;
  if(typeof A==='number' && typeof B==='number' && typeof C==='number') return Math.round((C+B-A)*100)/100;
  if(same_(C, A)) return B;
  if(same_(C, B)) return C;

  if(arr){
    var all=A.concat(B, C);
    if(all.length && all.every(function(x){ return ihKey_(x)!=null; })){
      var m=function(L){ var o={}; L.forEach(function(x){ o[ihKey_(x)]=x; }); return o; }, mA=m(A), mB=m(B), mC=m(C), out=[], seen={};
      C.forEach(function(x){ var k=ihKey_(x); seen[k]=1; var r=merge3_(mB[k], mA[k], x); if(r!==undefined) out.push(r); });
      B.forEach(function(x, i){ var k=ihKey_(x); if(seen[k]) return; var r=merge3_(x, mA[k], undefined); if(r!==undefined) out.splice(Math.min(i, out.length), 0, r); });

}
function ihUndoBack_(i){ var u=UNDO[i]; if(!u) return; var cur=JSON.parse(JSON.stringify(stateObj_())), gone=UNDO.length-i;
  UNDO.splice(i); UNDO.push({ msg:'Put back the '+gone+' input'+(gone>1?'s':'')+' undone from “'+u.msg+'” on', at:Date.now(), st:cur, open:true });
  ihApply_(u.st, 'Went back to before “'+u.msg+'”'); }
function ihApply_(st, msg){ resetState_(); loadState_(st); refreshBal_(); keep_();
  S.inBal=null; S.inAl=null; S.ruleDrafts={}; S.xfer=null; S.fl1=null; S.flUp=null; S.debtUp=null; S.undoAsk=false; S.ihAsk=null; S.ihClash=null;
  render(); ihOpen_(); toast('↩ '+msg); }
function ihUndoOne_(i){ var u=UNDO[i]; if(!u) return;
  if(i===UNDO.length-1){ UNDO.pop(); undoSave_(); S.ihAsk=null; ihApply_(u.st, u.msg); return; }
  if(!u.after){ S.ihClash=i; S.ihAsk=null; ihOpen_(); return; }

  try { R=merge3_(u.st, u.after, cur); } catch(e){ if(!e || !e.conflict) throw e; S.ihClash=i; S.ihAsk=null; ihOpen_(); return; }

function ihWhen_(t){ var d=new Date(t); return d.toLocaleDateString('en-GB',{ day:'numeric', month:'short' })+', '+d.toLocaleTimeString('en-GB',{ hour:'2-digit', minute:'2-digit' }); }

      ' You can go back to before it instead — that also undoes the '+n+' input'+(n>1?'s':'')+' after it.<br><button class="ihBtn ask" data-ihback="'+S.ihClash+'">↩ Go back to before it ('+(n+1)+' inputs)</button> <button class="ihBtn" data-ihcancel="1">Keep everything</button></div>'; }
